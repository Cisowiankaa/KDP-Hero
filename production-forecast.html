<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Production Forecast</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.card,.row{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:16px}.card strong{display:block;font-size:28px;margin-top:6px}.row{display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr auto;gap:12px;align-items:center;margin:9px 0}.badge{display:inline-block;border-radius:99px;padding:6px 9px;font-size:11px;font-weight:900}.ontime{background:#e4f7ee;color:#08794e}.risk{background:#fff3d6;color:#8a5a00}.late{background:#ffe6e9;color:#a51d2d}.none{background:#edf0f5;color:#657086}.btn{background:#6842ed;color:#fff;text-decoration:none;padding:8px 10px;border-radius:8px;font-weight:800;font-size:12px}@media(max-width:850px){.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}}@media(max-width:550px){.app{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.row{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="production-manager.html">▶ Production Manager</a><a href="production-calendar.html">📅 Production Calendar</a><a class="on" href="production-forecast.html">◉ Production Forecast</a></aside><main class="main"><h1 style="margin-bottom:4px">◉ Production Forecast</h1><div class="muted">Prognoza terminowości na podstawie pozostałej pracy i rzeczywistego tempa produkcji.</div><div id="summary" class="summary"></div><div id="list"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="production-calendar.js"></script><script src="production-forecast.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let x=KDPProductionForecast.all(),n=k=>x.filter(a=>a.key===k).length;summary.innerHTML=`<div class="card">Na czas<strong>${n('ontime')}</strong></div><div class="card">Ryzyko<strong>${n('risk')}</strong></div><div class="card">Opóźnienie<strong>${n('late')}</strong></div><div class="card">Tempo pracy<strong>${KDPProductionForecast.velocity().toFixed(1)}</strong><span class="muted">etapu / dzień pracy</span></div>`;list.innerHTML=x.length?x.map(a=>`<div class="row"><div><b>${esc(a.title)}</b><div class="muted" style="font-size:11px">Publikacja: ${a.publication?new Date(a.publication+'T12:00').toLocaleDateString('pl-PL'):'nie ustawiono'}</div></div><div><span class="badge ${a.key}">${a.status}</span></div><div><b>${a.remaining}</b><div class="muted" style="font-size:10px">etapów zostało</div></div><div><b>${a.days===null?'—':a.days}</b><div class="muted" style="font-size:10px">dni do terminu</div></div><a class="btn" href="production-calendar.html">Kalendarz →</a></div>`).join(''):'<div class="card">Brak projektów do prognozowania.</div>';</script></body></html>
