<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Łowca nisz</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:24px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.muted{color:#747c8e}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:18px;margin-top:18px}.search{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:9px}.field{border:1px solid #d9dee8;border-radius:9px;padding:11px;width:100%}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:18px}.idea{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:17px}.score{font-size:30px;font-weight:900;color:#6842ed}.meter{height:8px;background:#e9ebf0;border-radius:20px;overflow:hidden;margin:5px 0 12px}.meter i{display:block;height:100%;background:#6842ed}.tag{display:inline-block;background:#f0edff;color:#5634d6;padding:5px 7px;border-radius:7px;font-size:10px;margin:3px}.good{color:#08794e;font-weight:800}.warn{color:#a66200;font-weight:800}.saved{margin-top:18px}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #edf0f4}@media(max-width:900px){.app{grid-template-columns:1fr}.ideas{grid-template-columns:1fr 1fr}.search{grid-template-columns:1fr 1fr}.main{padding:16px}}@media(max-width:560px){.ideas,.search,.row{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a class="on" href="niches.html">◎ Łowca nisz</a><a href="keywords.html">⌕ Research keywords</a><a href="sales.html">◫ Sprzedaż KDP</a><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a></aside><main class="main"><h1>KDP Research — Łowca nisz</h1><p class="muted">Generator i lokalny analizator pomysłów. Wyniki są oceną pomocniczą KDP HERO, a nie danymi sprzedażowymi Amazon.</p><section class="card"><div class="search"><input id="topic" class="field" placeholder="Np. smoki, genealogia, mindfulness, księgowość"><select id="type" class="field"><option>Poradnik</option><option>Activity Book</option><option>Coloring Book</option><option>Workbook</option><option>Journal</option></select><select id="market" class="field"><option>Amazon.com</option><option>Amazon.de</option><option>Amazon.co.uk</option><option>Amazon.pl</option></select><button id="hunt" class="btn">✦ Znajdź nisze</button></div></section><div id="ideas" class="ideas"></div><section class="card saved"><h3>Zapisane pomysły</h3><div id="saved"></div></section><script>const $=s=>document.querySelector(s);let saved=[];try{saved=JSON.parse(localStorage.getItem('kdpNiches')||'[]')}catch(e){}let current=[];const angles=['dla początkujących','krok po kroku','30-dniowe wyzwanie','dla dzieci 4–8 lat','praktyczny workbook','duży druk','wersja prezentowa','bez stresu','100 ćwiczeń'];function hash(s){let h=0;for(let c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}function generate(){let t=$('#topic').value.trim();if(!t)return;let type=$('#type').value,market=$('#market').value;current=Array.from({length:6},(_,i)=>{let angle=angles[(hash(t)+i*3)%angles.length],seed=hash(t+angle+type+market),demand=55+seed%41,competition=25+(seed>>4)%61,trend=45+(seed>>7)%51,score=Math.round(demand*.45+(100-competition)*.35+trend*.2);return {title:`${t}: ${angle}`,topic:t,type,market,angle,demand,competition,trend,score,keywords:[t,`${t} ${angle}`,`${type.toLowerCase()} ${t}`]}});renderIdeas()}function renderIdeas(){$('#ideas').innerHTML=current.map((x,i)=>`<article class="idea"><div class="score">${x.score}/100</div><h3>${x.title}</h3><span class="tag">${x.type}</span><span class="tag">${x.market}</span><p class="muted">Popyt — ocena pomocnicza</p><div class="meter"><i style="width:${x.demand}%"></i></div><p class="muted">Konkurencja — ${x.competition<50?'<span class="good">niższa</span>':'<span class="warn">wyższa</span>'}</p><div class="meter"><i style="width:${x.competition}%"></i></div><p>${x.keywords.map(k=>`<span class="tag">${k}</span>`).join('')}</p><button class="btn" data-save="${i}">Zapisz pomysł</button> <button class="btn" data-start="${i}" style="background:#101827">Utwórz książkę</button></article>`).join('')}function renderSaved(){$('#saved').innerHTML=saved.length?saved.map((x,i)=>`<div class="row"><b>${x.title}</b><span>${x.score}/100</span><span>${x.market}</span><button class="btn" data-sstart="${i}">Rozpocznij projekt</button></div>`).join(''):'<p class="muted">Brak zapisanych pomysłów.</p>'}function store(x){if(!saved.some(y=>y.title===x.title&&y.market===x.market))saved.unshift(x);localStorage.setItem('kdpNiches',JSON.stringify(saved));renderSaved()}function start(x){let p={n:x.title,t:x.type,s:'Outline',p:10,created:new Date().toISOString(),niche:x.topic,market:x.market};let ps=[];try{ps=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}ps.push(p);localStorage.setItem('kdpProjectsV2',JSON.stringify(ps));localStorage.setItem('kdpNewProject',JSON.stringify(p));localStorage.setItem('kdpKeywords',JSON.stringify({selected:x.keywords,keywords:x.keywords}));localStorage.setItem('kdpResearchIdea',JSON.stringify(x));['kdpWriter','kdpCover','kdpManuscript'].forEach(k=>localStorage.removeItem(k));location.href='outline.html'}$('#hunt').onclick=generate;$('#ideas').onclick=e=>{let b=e.target.closest('[data-save],[data-start]');if(!b)return;if(b.dataset.save!=null)store(current[+b.dataset.save]);if(b.dataset.start!=null)start(current[+b.dataset.start])};$('#saved').onclick=e=>{let b=e.target.closest('[data-sstart]');if(b)start(saved[+b.dataset.sstart])};renderSaved();</script></main></div></body></html>
