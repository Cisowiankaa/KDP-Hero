<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Publishing Pipeline</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 14px}.logo{font-size:21px;font-weight:900;margin-bottom:26px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:10px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:24px;overflow:hidden}.muted{color:#70788c}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:17px 0}.tools input,.tools select{background:#fff;border:1px solid #d9dde7;border-radius:9px;padding:10px 12px;min-width:190px}.board{display:grid;grid-template-columns:repeat(8,minmax(220px,1fr));gap:11px;overflow-x:auto;padding:4px 2px 22px}.col{background:#eef0f5;border-radius:14px;padding:10px;min-height:500px}.head{display:flex;justify-content:space-between;align-items:center;font-weight:900;padding:5px}.count{background:#fff;border-radius:99px;padding:4px 8px;font-size:11px}.book{background:#fff;border:1px solid #dfe3eb;border-radius:11px;padding:12px;margin:9px 0;box-shadow:0 2px 6px #00000008}.book.risk{border-color:#e4a11b}.book.late{border-color:#d83b4b}.book b{display:block}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:900;margin-top:6px}.badge.risk{background:#fff1ce;color:#8b5700}.badge.late{background:#ffe3e6;color:#a51d2d}.bar{height:6px;background:#eceef3;border-radius:99px;overflow:hidden;margin:9px 0}.bar i{display:block;height:100%;background:#6842ed}.btn{display:inline-block;border:0;background:#6842ed;color:#fff;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer;margin:7px 4px 0 0}.ghost{background:#eef0f6;color:#30374a}.published .bar i{background:#17a673}@media(max-width:600px){.app{grid-template-columns:1fr}.main{padding:14px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="morning-command-center.html">☀ Morning Command</a><a href="production-manager.html">▶ Production Manager</a><a class="on" href="publishing-pipeline.html">▤ Publishing Pipeline</a><a href="portfolio-planner.html">▦ Portfolio Planner</a><a href="production-calendar.html">📅 Calendar</a></aside><main class="main"><h1 style="margin-bottom:4px">▤ Publishing Pipeline Board</h1><div class="muted">Całe wydawnictwo na jednym ekranie — od researchu do opublikowanej książki.</div><div class="tools"><input id="search" placeholder="🔎 Szukaj książki..."><select id="filter"><option value="all">Wszystkie projekty</option><option value="risk">Tylko zagrożone</option><option value="late">Tylko opóźnione</option><option value="dated">Z terminem publikacji</option></select></div><div id="board" class="board"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="production-forecast.js"></script><script src="publishing-pipeline.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let x=KDPPublishingPipeline.board(),fc=window.KDPProductionForecast?KDPProductionForecast.all():[],q=search.value.toLowerCase().trim(),f=filter.value;board.innerHTML=x.stages.map(st=>{let items=x.cols[st].map(b=>{let z=fc.find(v=>String(v.bookId)===String(b.id))||{},key=z.key||'';return{...b,riskKey:key}}).filter(b=>b.title.toLowerCase().includes(q)).filter(b=>f==='all'||(f==='risk'&&b.riskKey==='risk')||(f==='late'&&b.riskKey==='late')||(f==='dated'&&b.publication));return`<section class="col ${st==='Published'?'published':''}"><div class="head"><span>${st}</span><span class="count">${items.length}</span></div>${items.map(b=>`<article class="book ${b.riskKey==='risk'?'risk':b.riskKey==='late'?'late':''}"><b>${esc(b.title)}</b>${b.riskKey==='risk'?'<span class="badge risk">⚠ TERMIN ZAGROŻONY</span>':b.riskKey==='late'?'<span class="badge late">● OPÓŹNIENIE</span>':''}<div class="muted" style="font-size:11px;margin-top:5px">${esc(b.status)}</div><div class="bar"><i style="width:${Math.max(3,b.progress)}%"></i></div><div class="muted" style="font-size:10px">${b.progress}% ${b.publication?'· '+b.publication:''}</div>${st!=='Published'?`<button class="btn" data-open="${esc(b.id)}" data-url="${esc(b.next)}">Kontynuuj →</button><button class="btn ghost" data-calendar="${esc(b.id)}">Kalendarz</button>`:'<div style="margin-top:9px;color:#08794e;font-size:11px;font-weight:900">✓ Opublikowana</div>'}</article>`).join('')}</section>`}).join('');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>KDPPublishingPipeline.open(b.dataset.open,b.dataset.url));document.querySelectorAll('[data-calendar]').forEach(b=>b.onclick=()=>{localStorage.setItem('kdpCalendarFocusBook',b.dataset.calendar);location.href='production-calendar.html'})}search.oninput=render;filter.onchange=render;render();</script></body></html>
