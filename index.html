<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Publishing Studio</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f8fc;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:800;margin-bottom:30px}.logo b{color:#8b5cf6}.label{font-size:10px;color:#7f8aa0;font-weight:700;margin:22px 10px 7px}.nav button,.nav a{display:block;width:100%;border:0;background:none;color:#d8dfeb;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;text-decoration:none;font-size:13px}.nav button:hover,.nav a:hover,.nav .on{background:#5b36e8;color:#fff}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:25px}.muted{color:#70788c}.actions{display:flex;gap:10px}.actions input,.field{border:1px solid #dce0e8;border-radius:10px;padding:11px;background:#fff}.primary{border:0;border-radius:10px;background:#6842ed;color:#fff;padding:11px 17px;font-weight:700;cursor:pointer}.card{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:17px;margin-top:18px}.hidden{display:none}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.project{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:center;padding:15px 5px;border-bottom:1px solid #eee}.bar{height:7px;background:#e7e8ed;border-radius:8px;overflow:hidden;margin-top:6px}.bar i{height:100%;display:block;background:#16a36a}.btn2{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer;text-decoration:none;color:#222;font-size:12px}.danger{color:#c33}.empty{text-align:center;padding:45px}.steps{font-size:12px;color:#6f7788}.badge{display:inline-block;padding:5px 8px;border-radius:99px;background:#ede9fe;color:#5634d6;font-size:11px;font-weight:700}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:17px}.stat b{display:block;font-size:27px;margin-top:5px}@media(max-width:900px){.project{grid-template-columns:1fr 1fr}.form,.stats{grid-template-columns:1fr}}@media(max-width:650px){.app{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><div class="nav" id="nav"><button class="on" data-page="dashboard">⌂ Dashboard</button><div class="label">MOJE KSIĄŻKI</div><a href="books.html">▣ Wszystkie książki</a><button data-page="projects">▤ Projekty</button><a href="keywords.html">⌕ Research słów kluczowych</a><a href="author-dna.html">♙ Author DNA</a><div class="label">TWORZENIE KSIĄŻKI</div><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Twoje centrum publikacji KDP.</div></div><div class="actions"><input id="search" placeholder="Szukaj projektu..."><button id="newProject" class="primary">＋ Nowy projekt</button></div></div><section id="content"></section><section id="modal" class="card hidden"><h3>Nowy projekt</h3><form id="form" class="form"><label>Tytuł<input id="pTitle" class="field" required></label><label>Typ<select id="pType" class="field"><option>Paperback</option><option>E-book</option><option>Coloring Book</option><option>Activity Book</option></select></label><div><button class="primary">Utwórz i przejdź do planu →</button></div></form></section></main></div><script>const $=s=>document.querySelector(s);let projects=[];try{projects=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}let library=[];try{library=JSON.parse(localStorage.getItem('kdpLibrary')||'[]')}catch(e){}function activeProjects(){return projects.filter(x=>String(x.s||'')!=='Gotowe'&&Number(x.p||0)<100)}function save(){localStorage.setItem('kdpProjectsV2',JSON.stringify(projects))}function route(x){return x.s==='Outline'?'outline.html':x.s==='Pisanie'?'writer.html':x.s==='Okładka'?'cover.html':'check.html'}function projectsView(q=''){let a=activeProjects().filter(x=>String(x.n||'').toLowerCase().includes(q.toLowerCase()));return `<div class="card"><h3>Projekty w trakcie</h3><p class="muted">Ukończone książki są automatycznie przenoszone do biblioteki „Wszystkie książki”.</p>${a.length?a.map(x=>{let real=projects.indexOf(x);return `<div class="project"><div><b>${x.n}</b><div class="steps">Outline → Pisanie → Okładka → KDP Check → Gotowe</div></div><span class="badge">${x.s}</span><div>${x.p||0}%<div class="bar"><i style="width:${x.p||0}%"></i></div></div><span>${x.t||'Paperback'}</span><div><a class="btn2" href="${route(x)}">Kontynuuj</a> <button class="btn2 danger" data-delp="${real}">Usuń</button></div></div>`}).join(''):`<div class="empty"><h3>Brak aktywnych projektów</h3><p class="muted">Możesz rozpocząć nową książkę albo otworzyć bibliotekę ukończonych publikacji.</p><a class="btn2" href="books.html">Otwórz bibliotekę</a></div>`}</div>`}function dashboard(){let a=activeProjects();let writing=a.filter(x=>x.s==='Pisanie').length;let ready=library.length;$('#content').innerHTML=`<div class="stats"><div class="stat"><span class="muted">Aktywne projekty</span><b>${a.length}</b></div><div class="stat"><span class="muted">W trakcie pisania</span><b>${writing}</b></div><div class="stat"><span class="muted">Gotowe książki</span><b>${ready}</b></div></div><div class="card"><h2>KDP HERO Workflow</h2><p class="muted">Outline → automatyczne pisanie → elegancka okładka → KDP Check → biblioteka.</p><p><button class="primary" onclick="show('projects')">Kontynuuj projekty</button> <a class="btn2" href="books.html">Wszystkie książki (${ready})</a> <a class="btn2" href="keywords.html">Research słów kluczowych</a> <a class="btn2" href="author-dna.html">Author DNA</a></p></div>${projectsView()}`}function show(page){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));$('#title').textContent=page==='dashboard'?'Dashboard':'Projekty';page==='dashboard'?dashboard():$('#content').innerHTML=projectsView()}$('#nav').onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.page)};$('#newProject').onclick=()=>$('#modal').classList.toggle('hidden');$('#form').onsubmit=e=>{e.preventDefault();let n=$('#pTitle').value.trim();if(!n)return;let p={n,t:$('#pType').value,s:'Outline',p:10,created:new Date().toISOString()};projects.push(p);save();localStorage.setItem('kdpNewProject',JSON.stringify(p));localStorage.removeItem('kdpWriter');localStorage.removeItem('kdpCover');localStorage.removeItem('kdpKeywords');location.href='outline.html'};$('#content').onclick=e=>{let p=e.target.closest('[data-delp]');if(p&&confirm('Usunąć aktywny projekt?')){projects.splice(+p.dataset.delp,1);save();show('projects')}};$('#search').oninput=e=>{let on=document.querySelector('#nav .on')?.dataset.page||'dashboard';if(on==='projects')$('#content').innerHTML=projectsView(e.target.value)};show('dashboard');</script></body></html>
