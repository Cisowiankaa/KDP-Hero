<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Publishing Studio</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f8fc;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:800;margin-bottom:30px}.logo b{color:#8b5cf6}.label{font-size:10px;color:#7f8aa0;font-weight:700;margin:22px 10px 7px}.nav button,.nav a{display:block;width:100%;border:0;background:none;color:#d8dfeb;padding:11px 12px;border-radius:9px;text-align:left;cursor:pointer;text-decoration:none;font-size:13px}.nav button:hover,.nav a:hover,.nav .on{background:#5b36e8;color:#fff}.main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:25px}.muted{color:#70788c}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions input,.field{border:1px solid #dce0e8;border-radius:10px;padding:11px;background:#fff;font-size:15px}.primary{border:0;border-radius:10px;background:#6842ed;color:#fff;padding:11px 17px;font-weight:700;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}.card{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:17px}.card strong{display:block;font-size:25px;margin:8px 0}.green{color:#139764}.grid{display:grid;grid-template-columns:2fr 1fr;gap:14px}table{width:100%;border-collapse:collapse}th,td{padding:12px 8px;border-bottom:1px solid #eee;text-align:left;font-size:14px}.bar{height:6px;background:#e7e8ed;border-radius:8px;overflow:hidden;width:110px}.bar i{height:100%;display:block;background:#16a36a}.task{padding:10px 0;border-bottom:1px solid #eee}.hidden{display:none}.modal{margin-top:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:13px;font-weight:600}.form input,.form select{display:block;width:100%;margin-top:5px}.delete{border:0;background:none;color:#c33;cursor:pointer}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.tool{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:17px;text-decoration:none;color:#151827}.tool b{display:block;margin-bottom:5px}.tool:hover{border-color:#7655ee;transform:translateY(-1px)}@media(max-width:950px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.tools{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.side{min-height:auto}.main{padding:16px}.stats,.tools{grid-template-columns:1fr}.form{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b><div style="font-size:10px;color:#9aa5b8;margin-left:32px">AI Publishing Studio</div></div><div class="nav" id="nav"><button class="on" data-page="dashboard">⌂ Dashboard</button><div class="label">MOJE KSIĄŻKI</div><button data-page="books">▣ Wszystkie książki</button><button data-page="projects">▤ Projekty</button><button data-page="keywords">⌕ Research słów kluczowych</button><button data-page="dna">♙ Author DNA</button><div class="label">TWORZENIE KSIĄŻKI</div><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a><div class="label">ANALITYKA</div><button data-page="analytics">⌁ Analityka sprzedaży</button><button data-page="settings">⚙ Ustawienia</button></div></aside><main class="main"><div class="top"><div><h1 id="title">Dzień dobry! 👋</h1><div id="subtitle" class="muted">Kontynuuj pracę nad swoimi książkami.</div></div><div class="actions"><input id="search" placeholder="Szukaj książek, projektów..."><button id="newProject" class="primary">＋ Nowy projekt</button></div></div><section id="content"></section><section id="modal" class="card modal hidden"><h3>Nowy projekt KDP</h3><form id="form" class="form"><label>Tytuł<input id="pTitle" class="field" required></label><label>Typ<select id="pType" class="field"><option>Paperback</option><option>E-book</option><option>Coloring Book</option><option>Activity Book</option></select></label><label>Status<select id="pStatus" class="field"><option>Szkic</option><option>Pisanie</option><option>Okładka</option><option>KDP Check</option><option>Gotowe</option></select></label><label>Postęp %<input id="pProgress" class="field" type="number" min="0" max="100" value="0"></label><div><button class="primary">Zapisz projekt</button></div></form></section></main></div><script>let projects=JSON.parse(localStorage.getItem('kdpProjects')||'null')||[{n:'Mindful Habits',t:'Paperback',s:'Pisanie',p:72},{n:'Deep Work System',t:'E-book',s:'Okładka',p:40},{n:'Atomic Focus',t:'Paperback',s:'KDP Check',p:90},{n:'The Productivity Reset',t:'E-book',s:'Gotowe',p:100},{n:'Minimalist Living',t:'Paperback',s:'Szkic',p:20}];const c=document.querySelector('#content');function save(){localStorage.setItem('kdpProjects',JSON.stringify(projects))}function table(q=''){let a=projects.filter(x=>x.n.toLowerCase().includes(q.toLowerCase()));return '<div class="card"><h3>Twoje projekty</h3><div style="overflow:auto"><table><tr><th>Projekt</th><th>Status</th><th>Postęp</th><th>Typ</th><th></th></tr>'+a.map(x=>{let i=projects.indexOf(x);return `<tr><td><b>${x.n}</b></td><td>${x.s}</td><td>${x.p}%<div class="bar"><i style="width:${x.p}%"></i></div></td><td>${x.t}</td><td><button class="delete" data-del="${i}">Usuń</button></td></tr>`}).join('')+'</table></div></div>'}function dashboard(){let score=localStorage.getItem('kdpCheckScore')||'—';c.innerHTML='<div class="stats"><div class="card">Sprzedane egzemplarze<strong>12 847</strong><small class="green">↑ 24,6%</small></div><div class="card">Szacowany przychód<strong>28 743 zł</strong><small class="green">↑ 18,3%</small></div><div class="card">KENP<strong>1,32M</strong><small class="green">↑ 32,1%</small></div><div class="card">Aktywne projekty<strong>'+projects.filter(x=>x.s!=="Gotowe").length+'</strong></div><div class="card">KDP Check<strong>'+score+(score==='—'?'':'/100')+'</strong><small class="green">wynik projektu</small></div></div><div class="grid">'+table()+'<div class="card"><h3>Zadania na dziś</h3><label class="task"><input type="checkbox"> Dokończ rozdział 8</label><br><label class="task"><input type="checkbox"> Sprawdź metadane</label><br><label class="task"><input type="checkbox"> Raport sprzedaży</label><br><label class="task"><input type="checkbox"> Zaplanuj promocję</label></div></div><div class="tools"><a class="tool" href="outline.html"><b>✎ AI Outline Creator</b><span class="muted">Automatyczny plan książki</span></a><a class="tool" href="writer.html"><b>✐ AI Pisanie</b><span class="muted">Twórz e-book i rozdziały</span></a><a class="tool" href="cover.html"><b>▧ Okładka AI</b><span class="muted">Projektuj okładkę</span></a><a class="tool" href="check.html"><b>✓ KDP Check</b><span class="muted">Kontrola przed publikacją</span></a></div>'}function show(page){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.page===page));if(page==='dashboard'){document.querySelector('#title').textContent='Dzień dobry! 👋';document.querySelector('#subtitle').textContent='Kontynuuj pracę nad swoimi książkami.';dashboard();return}let names={books:'Wszystkie książki',projects:'Projekty',keywords:'Research słów kluczowych',dna:'Author DNA',analytics:'Analityka sprzedaży',settings:'Ustawienia'};document.querySelector('#title').textContent=names[page];document.querySelector('#subtitle').textContent='Moduł KDP HERO';c.innerHTML=(page==='projects'||page==='books')?table():'<div class="card"><h3>'+names[page]+'</h3><p class="muted">Moduł jest przygotowany do dalszej rozbudowy.</p></div>'}document.querySelector('#nav').onclick=e=>{let b=e.target.closest('button');if(b)show(b.dataset.page)};document.querySelector('#newProject').onclick=()=>document.querySelector('#modal').classList.toggle('hidden');document.querySelector('#form').onsubmit=e=>{e.preventDefault();let n=document.querySelector('#pTitle').value.trim();if(!n)return;projects.push({n,t:document.querySelector('#pType').value,s:document.querySelector('#pStatus').value,p:Math.max(0,Math.min(100,+document.querySelector('#pProgress').value||0))});save();document.querySelector('#modal').classList.add('hidden');e.target.reset();dashboard()};c.onclick=e=>{let b=e.target.closest('[data-del]');if(b){projects.splice(+b.dataset.del,1);save();dashboard();return}let t=e.target.closest('[data-tool]');if(t){e.preventDefault();show(t.dataset.tool)}};document.querySelector('#search').oninput=e=>c.innerHTML=table(e.target.value);dashboard();</script></body></html>
