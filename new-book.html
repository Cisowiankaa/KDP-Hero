<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Nowa książka</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:34px;max-width:1050px}.muted{color:#747c8e}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:22px 0}.step{background:#e8ebf1;border-radius:8px;padding:9px;text-align:center;font-size:11px;font-weight:800}.step.on{background:#6842ed;color:#fff}.card{background:#fff;border:1px solid #e1e5ec;border-radius:16px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:12px;margin-top:6px;font-size:14px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 18px;font-weight:800;cursor:pointer}.ghost{background:#eeeafe;color:#5634d6}.actions{display:flex;justify-content:space-between;margin-top:20px}.summary{background:#f7f8fb;border-radius:12px;padding:16px;margin-top:15px;line-height:1.8}.error{color:#a51d2d;font-weight:700;margin-top:10px}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:16px}.grid,.steps{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a class="on" href="new-book.html">＋ Nowa książka</a></aside><main class="main"><h1>Utwórz nową książkę</h1><p class="muted">Kreator przygotuje niezależny projekt i uruchomi właściwy workflow KDP.</p><div class="steps"><div class="step on">1. Podstawy</div><div class="step">2. Publikacja</div><div class="step">3. Rynek</div><div class="step">4. Nisza</div><div class="step">5. Start</div></div><section class="card"><div id="panel"></div><div id="error" class="error"></div><div class="actions"><button id="back" class="btn ghost">← Wstecz</button><button id="next" class="btn">Dalej →</button></div></section><script src="project-store.js"></script><script>const $=s=>document.querySelector(s);let step=0,d={title:'',author:'Karolcia',type:'Paperback',language:'Polski',market:'Amazon.pl',niche:'',audience:'',target:15000};const panels=[()=>`<h2>Podstawowe dane</h2><div class="grid"><label>Tytuł książki<input id="title" class="field" value="${d.title}"></label><label>Autor<input id="author" class="field" value="${d.author}"></label></div>`,()=>`<h2>Typ publikacji</h2><div class="grid"><label>Format<select id="type" class="field"><option>Paperback</option><option>Hardcover</option><option>E-book</option><option>Workbook</option><option>Activity Book</option><option>Coloring Book</option></select></label><label>Docelowa długość<select id="target" class="field"><option value="8000">8 000 słów</option><option value="15000">15 000 słów</option><option value="25000">25 000 słów</option><option value="40000">40 000 słów</option></select></label></div>`,()=>`<h2>Język i rynek Amazon</h2><div class="grid"><label>Język<select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select></label><label>Rynek<select id="market" class="field"><option>Amazon.pl</option><option>Amazon.com</option><option>Amazon.co.uk</option><option>Amazon.de</option></select></label></div>`,()=>`<h2>Nisza i odbiorca</h2><label>Temat / nisza<input id="niche" class="field" value="${d.niche}" placeholder="np. mindfulness dla początkujących"></label><label><p>Docelowy czytelnik</p><input id="audience" class="field" value="${d.audience}" placeholder="np. początkujący dorośli"></label>`,()=>`<h2>Projekt gotowy do utworzenia</h2><div class="summary"><b>${d.title||'—'}</b><br>Autor: ${d.author}<br>Typ: ${d.type}<br>Język: ${d.language}<br>Rynek: ${d.market}<br>Nisza: ${d.niche||'—'}<br>Odbiorca: ${d.audience||'—'}<br>Cel: ${Number(d.target).toLocaleString('pl-PL')} słów</div><p class="muted">Po utworzeniu przejdziesz do Research Keywords, a następnie Outline → AI Pisanie → Manuskrypt → Okładka → KDP Check.</p>`];function capture(){['title','author','type','language','market','niche','audience','target'].forEach(k=>{let el=$('#'+k);if(el)d[k]=el.value})}function render(){document.querySelectorAll('.step').forEach((x,i)=>x.classList.toggle('on',i===step));$('#panel').innerHTML=panels[step]();['type','language','market','target'].forEach(k=>{let el=$('#'+k);if(el)el.value=String(d[k])});$('#back').style.visibility=step?'visible':'hidden';$('#next').textContent=step===4?'✓ Utwórz projekt':'Dalej →';$('#error').textContent=''}function valid(){capture();if(step===0&&!d.title.trim())return'Tytuł książki jest wymagany.';if(step===3&&!d.niche.trim())return'Wpisz temat lub niszę książki.';return''}$('#next').onclick=()=>{let e=valid();if(e){$('#error').textContent=e;return}if(step<4){step++;render();return}let id=KDPProjectStore.create(d.title,d.type);if(!id){$('#error').textContent='Nie udało się utworzyć projektu.';return}let project={n:d.title,t:d.type,s:'Keywords',p:5,author:d.author,language:d.language,market:d.market,niche:d.niche,audience:d.audience,target:+d.target,created:new Date().toISOString()};localStorage.setItem('kdpNewProject',JSON.stringify(project));localStorage.setItem('kdpResearchIdea',JSON.stringify({topic:d.niche,market:d.market,type:d.type}));localStorage.setItem('kdpWriter',JSON.stringify({title:d.title,topic:d.niche,author:d.author,language:d.language,audience:d.audience,target:+d.target,chapters:[]}));KDPProjectStore.saveCurrent();location.href='keywords.html'};$('#back').onclick=()=>{capture();if(step>0){step--;render()}};render();</script></main></div></body></html>
