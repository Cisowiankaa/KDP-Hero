<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Production Calendar</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.card{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:17px;margin-top:15px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.toolbar select,.toolbar input{padding:10px;border:1px solid #d9dde5;border-radius:8px}.btn{border:0;border-radius:8px;background:#6842ed;color:#fff;padding:10px 13px;font-weight:900;cursor:pointer}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:125px;background:#fff;border:1px solid #e2e5eb;border-radius:11px;padding:9px}.day.today{outline:2px solid #6842ed}.date{font-weight:900;margin-bottom:7px}.event{display:block;text-decoration:none;background:#f1efff;color:#3f2a9d;border-radius:7px;padding:6px;margin:4px 0;font-size:10px}.event.done{opacity:.45;text-decoration:line-through}.pub{background:#e4f7ee;color:#08794e}.nav{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.nav button{border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer}@media(max-width:900px){.days{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.app{grid-template-columns:1fr}.days{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="production-manager.html">▶ Production Manager</a><a class="on" href="production-calendar.html">📅 Production Calendar</a><a href="weekly-summary.html">▦ Podsumowanie tygodnia</a><a href="monthly-production.html">▤ Plan miesiąca</a></aside><main class="main"><h1 style="margin-bottom:4px">📅 Production Calendar</h1><div class="muted">Dzień → tydzień → miesiąc. Zmiana daty publikacji przelicza cały harmonogram książki.</div><section class="card"><b>Przelicz harmonogram książki</b><div class="toolbar" style="margin-top:10px"><select id="book"></select><input id="date" type="date"><button class="btn" id="rebuild">⚡ Zmień termin i przelicz</button></div><div id="msg" class="muted" style="font-size:12px;margin-top:8px"></div></section><div class="nav"><button id="prev">← Poprzedni</button><h2 id="month" style="margin:0"></h2><button id="next">Następny →</button></div><div id="calendar" class="days"></div></main></div><script src="project-store.js"></script><script src="production-calendar.js"></script><script>let cursor=new Date();cursor.setDate(1);function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let books=KDPProjectStore.list();book.innerHTML='<option value="">— wybierz książkę —</option>'+books.map(b=>`<option value="${esc(b.id)}">${esc(b.title||'Bez tytułu')}</option>`).join('');book.onchange=()=>{let b=books.find(x=>String(x.id)===book.value);date.value=b?KDPProductionCalendar.publication(b):''};rebuild.onclick=()=>{if(!book.value||!date.value){msg.textContent='Wybierz książkę i datę publikacji.';return}let x=KDPProductionCalendar.rebuild(book.value,date.value);msg.textContent=x?`✓ Przeliczono ${x.length} etapów produkcji.`:'Nie udało się przeliczyć harmonogramu.';render()};function key(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function render(){month.textContent=cursor.toLocaleDateString('pl-PL',{month:'long',year:'numeric'});let y=cursor.getFullYear(),m=cursor.getMonth(),last=new Date(y,m+1,0).getDate(),events=KDPProductionCalendar.events(),today=key(new Date()),html='';for(let i=1;i<=last;i++){let d=new Date(y,m,i),k=key(d),ev=events.filter(x=>x.date===k);html+=`<div class="day ${k===today?'today':''}"><div class="date">${i} <span class="muted" style="font-size:10px">${d.toLocaleDateString('pl-PL',{weekday:'short'})}</span></div>${ev.map(x=>`<a class="event ${x.kind==='publication'?'pub':''} ${x.done?'done':''}" href="${x.url}"><b>${esc(x.title)}</b><br>${esc(x.label)}</a>`).join('')}</div>`}calendar.innerHTML=html}prev.onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};next.onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};render();</script></body></html>
