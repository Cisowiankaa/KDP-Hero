<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Deadline Optimizer</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.card,.row{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:16px}.card strong{display:block;font-size:29px;margin-top:6px}.row{display:grid;grid-template-columns:1.4fr .8fr .8fr .7fr auto;gap:12px;align-items:center;margin:9px 0}.btn{border:0;border-radius:8px;background:#6842ed;color:#fff;padding:9px 11px;font-weight:900;cursor:pointer}.ok{color:#08794e}.warn{color:#a45d00}.danger{color:#a51d2d}@media(max-width:800px){.row{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:550px){.app{grid-template-columns:1fr}.row{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="morning-command-center.html">☀ Morning Command</a><a href="production-calendar.html">📅 Production Calendar</a><a href="production-forecast.html">◉ Production Forecast</a><a class="on" href="deadline-optimizer.html">◎ Deadline Optimizer</a></aside><main class="main"><h1 style="margin-bottom:4px">◎ Deadline Optimizer</h1><div class="muted">Bezpieczne terminy publikacji wyliczone z realnego tempa pracy i pozostałych etapów produkcji.</div><div id="stats" class="grid"></div><div id="msg" class="muted"></div><h2>Rekomendowane terminy</h2><div id="list"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="smart-workload-engine.js"></script><script src="production-calendar.js"></script><script src="production-forecast.js"></script><script src="deadline-optimizer.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function render(){let x=KDPDeadlineOptimizer.optimize();stats.innerHTML=`<div class="card">Realnie / dzień<strong>${x.dailyCapacity}</strong></div><div class="card">Realnie / tydzień<strong>${x.weeklyCapacity}</strong></div><div class="card">Realnie / miesiąc<strong>${x.monthlyCapacity}</strong></div>`;list.innerHTML=x.books.map(b=>`<div class="row"><div><b>${esc(b.title)}</b><div class="muted">${b.remaining} etapów pozostało</div></div><div><span class="${b.status==='Na czas'?'ok':b.status==='Ryzyko'?'warn':'danger'}">${esc(b.status)}</span></div><div><b>${b.current||'—'}</b><div class="muted">obecny termin</div></div><div><b>${b.safe}</b><div class="muted">bezpieczny termin</div></div>${b.action==='Bez zmian'?'<span class="ok">✓ Bez zmian</span>':`<button class="btn" data-id="${esc(b.bookId)}" data-date="${b.safe}">${esc(b.action)}</button>`}</div>`).join('')||'<div class="card">Brak książek do optymalizacji.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let ok=KDPDeadlineOptimizer.apply(b.dataset.id,b.dataset.date);msg.textContent=ok?'✓ Termin i harmonogram książki zostały przeliczone.':'Nie udało się zmienić terminu.';render()})}render();</script></body></html>
