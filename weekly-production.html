<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Tygodniowy plan produkcji</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin:16px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.dark{background:#101827}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}.day{background:#fff;border:1px solid #e1e5ec;border-radius:13px;padding:12px;min-height:250px}.day.today{border:2px solid #6842ed}.date{font-size:11px;color:#747c8e}.task{background:#f7f5ff;border-left:3px solid #6842ed;border-radius:8px;padding:9px;margin-top:9px;font-size:11px}.task b{display:block;margin-bottom:4px}.muted{color:#747c8e}.field{padding:10px;border:1px solid #d9dee7;border-radius:9px}.progress{height:9px;background:#e9edf3;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:#6842ed}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary div{background:#f8fafc;border-radius:10px;padding:13px}.summary b{display:block;font-size:22px;margin-top:4px}@media(max-width:1100px){.week{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:15px}.week,.summary{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a href="work-scheduler.html">📅 Planer pracy</a><a class="on" href="weekly-production.html">▦ Plan tygodniowy</a><a href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><div class="top"><div><h1>▦ Tygodniowy plan produkcji</h1><p class="muted">Automatyczny harmonogram: research → outline → pisanie → korekta → okładka → KDP Check → publikacja.</p></div><button id="generate" class="btn">⚡ Ułóż tydzień automatycznie</button></div><section class="card"><div class="top"><label>Książka: <select id="book" class="field"></select></label><label>Start: <input id="start" type="date" class="field"></label></div></section><section class="card"><div class="summary"><div>Zaplanowane etapy<b id="steps">0/7</b></div><div>Wykonane<b id="done">0</b></div><div>Postęp tygodnia<b id="pct">0%</b></div></div><div class="progress" style="margin-top:14px"><i id="bar" style="width:0"></i></div></section><section id="week" class="week"></section><script src="project-store.js"></script><script>const KEY='kdpWeeklyProduction',$=s=>document.querySelector(s),stages=[['Research niszy i keywords','keywords.html'],['AI Outline Creator','outline.html'],['Pisanie rozdziałów','writer.html'],['Korekta i manuskrypt','manuscript.html'],['Okładka AI','cover.html'],['KDP Check i Quality Gate','check.html'],['Przygotowanie publikacji','publishing-center.html']];function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function fmt(d){return d.toISOString().slice(0,10)}function init(){let bs=KDPProjectStore.list();$('#book').innerHTML=bs.map(b=>`<option value="${b.id}">${b.title||'Bez tytułu'}</option>`).join('');let now=new Date(),m=new Date(now);m.setDate(now.getDate()-((now.getDay()+6)%7));$('#start').value=fmt(m);render()}function generate(){let bs=KDPProjectStore.list(),b=bs.find(x=>x.id===$('#book').value);if(!b)return alert('Najpierw utwórz książkę.');let start=new Date($('#start').value+'T09:00:00'),tasks=stages.map((s,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return{id:String(Date.now())+'-'+i,bookId:b.id,bookTitle:b.title||'Bez tytułu',stage:s[0],url:s[1],date:fmt(d),done:false}});save({bookId:b.id,bookTitle:b.title,start:$('#start').value,tasks,updatedAt:new Date().toISOString()});render()}function render(){let x=load(),tasks=Array.isArray(x.tasks)?x.tasks:[],done=tasks.filter(t=>t.done).length;$('#steps').textContent=tasks.length+'/7';$('#done').textContent=done;$('#pct').textContent=(tasks.length?Math.round(done/tasks.length*100):0)+'%';$('#bar').style.width=(tasks.length?Math.round(done/tasks.length*100):0)+'%';let start=$('#start').value?new Date($('#start').value+'T12:00:00'):new Date(),today=fmt(new Date());$('#week').innerHTML=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let ds=fmt(d),ts=tasks.filter(t=>t.date===ds);return `<div class="day ${ds===today?'today':''}"><b>${['Pon','Wt','Śr','Czw','Pt','Sob','Nd'][i]}</b><div class="date">${d.toLocaleDateString('pl-PL')}</div>${ts.map(t=>`<div class="task"><input type="checkbox" data-id="${t.id}" ${t.done?'checked':''}> <b>${t.stage}</b><span>${t.bookTitle}</span><div style="margin-top:7px"><button class="btn dark" style="padding:6px 8px;font-size:10px" data-open="${t.id}">Otwórz →</button></div></div>`).join('')||'<p class="muted" style="font-size:11px">Brak zadania</p>'}</div>`}).join('')}$('#generate').onclick=generate;$('#start').onchange=render;$('#week').onchange=e=>{let c=e.target.closest('[data-id]');if(!c)return;let x=load(),t=x.tasks?.find(t=>t.id===c.dataset.id);if(t){t.done=c.checked;t.doneAt=c.checked?new Date().toISOString():null;save(x);render()}};$('#week').onclick=e=>{let b=e.target.closest('[data-open]');if(!b)return;let x=load(),t=x.tasks?.find(t=>t.id===b.dataset.open);if(t&&KDPProjectStore.load(t.bookId))location.href=t.url};init();</script></main></div></body></html>
