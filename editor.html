<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Editor</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.on,.side a:hover{background:#5b36e8}.main{padding:28px;max-width:1100px}.muted{color:#747c8e}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:18px;margin-top:16px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 14px;font-weight:800;cursor:pointer}.ghost{background:#ede9fe;color:#5431d6}.score{font-size:38px;font-weight:900}.issue{padding:12px 0;border-bottom:1px solid #edf0f4}.ok{color:#08794e}.warn{color:#a66200}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="writer.html">✐ AI Pisanie</a><a href="manuscript.html">▤ Manuskrypt</a><a class="on" href="editor.html">✦ AI Editor</a><a href="check.html">✓ KDP Check</a></aside><main class="main"><h1>AI Editor — Redakcja książki</h1><p class="muted">Analiza całego manuskryptu przed przygotowaniem wersji KDP.</p><section class="card"><button id="analyze" class="btn ghost">◎ Analizuj całą książkę</button> <button id="apply" class="btn">✦ Popraw cały manuskrypt</button><div id="summary" style="margin-top:16px"></div></section><section id="details" class="card"></section><script src="project-store.js"></script><script src="project-switcher.js"></script><script src="version-history.js"></script><script src="book-memory.js"></script><script src="editor-engine.js"></script><script>const $=s=>document.querySelector(s);function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(r){$('#summary').innerHTML=`<div class="score">${r.score}/100</div><b>${r.issues?'Wykryto '+r.issues+' elementów do sprawdzenia':'✓ Manuskrypt wygląda dobrze'}</b><p class="muted">Duplikaty zdań: ${r.duplicates.length} · rozdziały: ${r.chapters.length}</p>`;$('#details').innerHTML='<h3>Raport redakcyjny</h3>'+r.chapters.map(x=>`<div class="issue"><b>${esc(x.title)}</b><span style="float:right" class="${x.issues.length?'warn':'ok'}">${x.issues.length?x.issues.length+' uwag':'✓ OK'}</span><div class="muted">${x.issues.map(esc).join(' · ')||'Brak podstawowych problemów redakcyjnych.'}</div></div>`).join('')+(r.duplicates.length?`<div class="issue"><b>Powtórzone zdania</b><div class="muted">${r.duplicates.slice(0,8).map(x=>'Rozdziały '+x.chapters.join(' i ')+': '+esc(x.sentence.slice(0,120))).join('<br>')}</div></div>`:'')}$('#analyze').onclick=()=>render(KDPEditor.analyze());$('#apply').onclick=()=>{if(confirm('Wykonać automatyczną redakcję całej książki? Przed zmianą zostanie utworzony checkpoint.'))render(KDPEditor.apply())};render(KDPEditor.analyze());</script></main></div></body></html>
