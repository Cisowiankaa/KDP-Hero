<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Finalizacja książki</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:24px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.on,.side a:hover{background:#5b36e8}.main{padding:28px;max-width:1050px}.muted{color:#747c8e}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:16px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:13px 17px;font-weight:800;cursor:pointer}.step{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f4}.icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#eef1f5}.done .icon{background:#e6faef;color:#08794e}.bad .icon{background:#fff4df;color:#a66200}.pill{font-size:11px;font-weight:800}.progress{height:11px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:15px 0}.progress i{display:block;height:100%;background:#6842ed;transition:.25s}.success{display:none;background:#ecfdf5;border-color:#b9efd2}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="writer.html">✐ AI Pisanie</a><a href="editor.html">✦ AI Editor</a><a class="on" href="finalize.html">⚡ Finalizacja</a><a href="check.html">✓ KDP Check</a><a href="publish-package.html">★ Publish Package</a></aside><main class="main"><h1>⚡ Finalizacja książki</h1><p class="muted">Jeden proces: checkpoint → redakcja → analiza jakości → przygotowanie manuskryptu → kontrola gotowości.</p><section class="card"><button id="start" class="btn">✦ FINALIZUJ CAŁĄ KSIĄŻKĘ</button><div class="progress"><i id="bar" style="width:0"></i></div><p id="status" class="muted">Gotowe do uruchomienia.</p><div id="steps"></div></section><section id="success" class="card success"><h2>✓ Finalizacja zakończona</h2><p id="result"></p><a href="check.html" class="btn" style="display:inline-block;text-decoration:none">Otwórz KDP Check →</a></section><script src="project-store.js"></script><script src="project-switcher.js"></script><script src="version-history.js"></script><script src="book-memory.js"></script><script src="editor-engine.js"></script><script>const $=s=>document.querySelector(s);let states=[['Checkpoint bezpieczeństwa','wait'],['Redakcja całego manuskryptu','wait'],['Aktualizacja Book Memory','wait'],['Analiza jakości redakcyjnej','wait'],['Przygotowanie danych KDP Check','wait']];function render(){let done=states.filter(x=>x[1]==='done').length;$('#bar').style.width=Math.round(done/states.length*100)+'%';$('#steps').innerHTML=states.map((x,i)=>`<div class="step ${x[1]}"><span class="icon">${x[1]==='done'?'✓':x[1]==='bad'?'!':i+1}</span><b>${x[0]}</b><span class="pill">${x[1]==='done'?'GOTOWE':x[1]==='bad'?'UWAGA':'OCZEKUJE'}</span></div>`).join('')}async function pause(){return new Promise(r=>setTimeout(r,180))}async function run(){states=states.map(x=>[x[0],'wait']);render();$('#start').disabled=true;try{$('#status').textContent='Tworzę checkpoint bezpieczeństwa…';if(window.KDPVersions)KDPVersions.snapshot('Przed finalizacją książki');states[0][1]='done';render();await pause();$('#status').textContent='Redaguję cały manuskrypt…';let report=KDPEditor.apply();states[1][1]='done';render();await pause();$('#status').textContent='Aktualizuję pamięć książki…';if(window.KDPBookMemory)KDPBookMemory.build();states[2][1]='done';render();await pause();$('#status').textContent='Analizuję jakość…';report=KDPEditor.analyze();states[3][1]=report.score>=70?'done':'bad';render();await pause();$('#status').textContent='Przygotowuję dane dla KDP Check…';let w=JSON.parse(localStorage.getItem('kdpWriter')||'{}'),m=JSON.parse(localStorage.getItem('kdpManuscript')||'{}'),words=String(m.content||'').trim().split(/\s+/).filter(Boolean).length;localStorage.setItem('kdpFinalization',JSON.stringify({readyForCheck:report.score>=70&&words>=3000,editorScore:report.score,words,completedAt:new Date().toISOString()}));if(window.KDPProjectStore)KDPProjectStore.saveCurrent();if(window.KDPVersions)KDPVersions.snapshot('Finalizacja książki zakończona');states[4][1]='done';render();$('#status').textContent='✓ Finalizacja zakończona.';$('#result').textContent=`Ocena redakcyjna: ${report.score}/100 · manuskrypt: ${words.toLocaleString('pl-PL')} słów. Następny etap: KDP Check Pro.`;$('#success').style.display='block'}catch(e){$('#status').textContent='Finalizacja zatrzymana: '+e.message}finally{$('#start').disabled=false}}$('#start').onclick=run;render();</script></main></div></body></html>
