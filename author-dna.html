<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Author DNA</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1250px;width:100%}.muted{color:#737b8d}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:14px;margin-top:5px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #dce0e8;background:#fff;border-radius:99px;padding:9px 12px;cursor:pointer}.chip.on{background:#6842ed;color:#fff;border-color:#6842ed}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.profile{background:linear-gradient(135deg,#101827,#17233b);color:#fff;border-radius:14px;padding:20px}.profile b{color:#c7b7ff}.ok{color:#08794e;font-weight:800}@media(max-width:700px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▣ Wszystkie książki</a><a href="keywords.html">⌕ Research słów kluczowych</a><a class="on" href="author-dna.html">♙ Author DNA</a><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a></aside><main class="main"><h1>Author DNA</h1><p class="muted">Zapisz własny profil pisarski. KDP HERO wykorzysta go przy planowaniu i pisaniu kolejnych książek.</p><div class="grid"><section class="card"><h3>Profil autora</h3><label>Nazwa autora<input id="name" class="field" value="Karolcia"></label><label>Główna tematyka<input id="niche" class="field" placeholder="np. poradniki, biznes, rozwój osobisty"></label><label>Docelowy czytelnik<input id="audience" class="field" placeholder="np. początkujący, kobiety 25–45"></label><label>Opis stylu<textarea id="description" class="field" rows="5" placeholder="Jak mają brzmieć Twoje książki?"></textarea></label></section><section class="card"><h3>DNA stylu</h3><p class="muted">Ton</p><div id="tone" class="chips"><button class="chip">Przystępny</button><button class="chip">Profesjonalny</button><button class="chip">Ciepły</button><button class="chip">Ekspercki</button><button class="chip">Motywujący</button></div><p class="muted">Sposób pisania</p><div id="writing" class="chips"><button class="chip">Krótkie akapity</button><button class="chip">Przykłady</button><button class="chip">Checklisty</button><button class="chip">Krok po kroku</button><button class="chip">Ćwiczenia</button><button class="chip">Podsumowania</button></div><label>Czego unikać<textarea id="avoid" class="field" rows="3" placeholder="np. powtórzeń, trudnego języka, długich wstępów"></textarea></label></section></div><section class="card"><h3>Instrukcja dla Auto Writera</h3><div id="preview" class="profile"></div><p><button id="save" class="btn">✓ Zapisz Author DNA</button></p><p id="status" class="ok"></p></section><script>const $=s=>document.querySelector(s);let d={};try{d=JSON.parse(localStorage.getItem('kdpAuthorDNA')||'{}')||{}}catch(e){}let tone=Array.isArray(d.tone)?d.tone:[],writing=Array.isArray(d.writing)?d.writing:[];['name','niche','audience','description','avoid'].forEach(k=>{if(d[k])$('#'+k).value=d[k]});function chips(id,arr){document.querySelectorAll('#'+id+' .chip').forEach(b=>{b.classList.toggle('on',arr.includes(b.textContent));b.onclick=()=>{let i=arr.indexOf(b.textContent);i>=0?arr.splice(i,1):arr.push(b.textContent);b.classList.toggle('on');preview()}})}function preview(){let name=$('#name').value||'Autor',niche=$('#niche').value||'wybrana tematyka',aud=$('#audience').value||'docelowy czytelnik';$('#preview').innerHTML=`<b>${name}</b><p>Pisz książki z obszaru: ${niche}. Odbiorca: ${aud}. Ton: ${tone.join(', ')||'naturalny i czytelny'}. Stosuj: ${writing.join(', ')||'jasną strukturę i praktyczne przykłady'}. ${$('#description').value?`Styl autora: ${$('#description').value}.`:''} ${$('#avoid').value?`Unikaj: ${$('#avoid').value}.`:''}</p>`}function save(){d={name:$('#name').value,niche:$('#niche').value,audience:$('#audience').value,description:$('#description').value,avoid:$('#avoid').value,tone:[...tone],writing:[...writing]};localStorage.setItem('kdpAuthorDNA',JSON.stringify(d));$('#status').textContent='✓ Author DNA zapisane. Profil może być używany przez Outline Creator i Auto Writer.';preview()}chips('tone',tone);chips('writing',writing);document.querySelectorAll('input,textarea').forEach(x=>x.addEventListener('input',preview));$('#save').onclick=save;preview();</script></main></div></body></html>
