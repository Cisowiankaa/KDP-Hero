<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Auto Workflow</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1250px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:16px}.hero{background:linear-gradient(135deg,#101827,#291b61);color:#fff}.muted{color:#747c8e}.hero .muted{color:#c8c7dc}.step{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid #edf0f4}.step:last-child{border:0}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ede9fe;color:#5b36e8;font-weight:900}.ok .num{background:#e7f9ef;color:#08794e}.current{background:#faf8ff;border-radius:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.dark{background:#101827}.bar{height:12px;background:#edf0f4;border-radius:20px;overflow:hidden}.hero .bar{background:#ffffff22}.fill{height:100%;background:#8b5cf6}.actions{display:flex;gap:10px;flex-wrap:wrap}.pill{display:inline-block;background:#ffffff18;padding:6px 9px;border-radius:99px;font-size:11px}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:15px}.step{grid-template-columns:40px 1fr}.step .btn{grid-column:2}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a class="on" href="workflow.html">⚡ Auto Workflow</a><a href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><h1>⚡ Auto Workflow</h1><p class="muted">Jedna ścieżka prowadząca aktywną książkę od researchu do publikacji.</p><section class="card hero"><span class="pill">AKTYWNA KSIĄŻKA</span><h2 id="bookTitle">—</h2><p id="bookMeta" class="muted"></p><div class="bar"><div id="fill" class="fill"></div></div><p id="progress"></p></section><section id="steps" class="card"></section><section class="card"><h2 id="nextTitle">Następny krok</h2><p id="next"></p><div class="actions"><a id="continue" class="btn">Kontynuuj →</a><button id="refresh" class="btn dark">Odśwież status</button><a class="btn dark" href="books.html">Zmień książkę</a></div></section><script src="project-store.js"></script><script src="workflow-progress.js"></script><script src="project-switcher.js"></script><script>const $=s=>document.querySelector(s);const labels={keywords:'Research Keywords',outline:'Outline',writer:'AI Pisanie',manuscript:'Manuskrypt',cover:'Okładka AI',check:'KDP Check',package:'Publish Package',publishing:'Publishing Center'};function get(k,d={}){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function render(){let id=KDPProjectStore.active(),all=KDPProjectStore.books(),book=all[id];if(!book){$('#bookTitle').textContent='Brak aktywnej książki';$('#bookMeta').textContent='Utwórz lub wybierz projekt w bibliotece.';$('#steps').innerHTML='<p class="muted">Nie ma projektu do prowadzenia.</p>';$('#continue').href='new-book.html';$('#continue').textContent='＋ Utwórz książkę';return}let flow=KDPWorkflow.save(),p=get('kdpNewProject'),w=get('kdpWriter'),entries=KDPWorkflow.STEPS,current=entries.find(([key])=>!flow.done[key]),nextUrl=current?current[1]:'publishing-center.html';$('#bookTitle').textContent=book.title;$('#bookMeta').textContent=[w.author||p.author||'Karolcia',book.type||p.t||'Paperback',p.language||''].filter(Boolean).join(' · ');$('#fill').style.width=flow.progress+'%';$('#progress').innerHTML=`Ukończono <b>${flow.completed}/${flow.total}</b> etapów · <b>${flow.progress}%</b>`;$('#steps').innerHTML=entries.map(([key,url],i)=>{let done=!!flow.done[key],isCurrent=current&&current[0]===key;return `<div class="step ${done?'ok':''} ${isCurrent?'current':''}"><div class="num">${done?'✓':i+1}</div><div><b>${labels[key]}</b><div class="muted">${done?'Etap zakończony':isCurrent?'Następny etap aktywnego workflow':'Oczekuje na wcześniejsze etapy'}</div></div><a class="btn ${isCurrent?'':'dark'}" href="${url}">${done?'Sprawdź':isCurrent?'Rozpocznij':'Otwórz'}</a></div>`}).join('');if(current){$('#nextTitle').textContent='Następny krok: '+labels[current[0]];$('#next').innerHTML=`KDP HERO wykrył pierwszy niezakończony etap. Po jego zapisaniu postęp zostanie przeliczony automatycznie.`;$('#continue').href=nextUrl;$('#continue').textContent='Kontynuuj: '+labels[current[0]]+' →'}else{$('#nextTitle').textContent='Workflow zakończony';$('#next').innerHTML='<b style="color:#08794e">✓ Wszystkie główne etapy są zakończone. Projekt można otworzyć w Publishing Center.</b>';$('#continue').href='publishing-center.html';$('#continue').textContent='Otwórz Publishing Center →'}KDPProjectStore.saveCurrent()}$('#refresh').onclick=render;render();</script></main></div></body></html>
