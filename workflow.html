<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Auto Workflow</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1250px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:16px}.muted{color:#747c8e}.step{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid #edf0f4}.step:last-child{border:0}.num{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#ede9fe;color:#5b36e8;font-weight:900}.ok .num{background:#e7f9ef;color:#08794e}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.dark{background:#101827}.bar{height:12px;background:#edf0f4;border-radius:20px;overflow:hidden}.fill{height:100%;background:#6842ed}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:15px}.step{grid-template-columns:40px 1fr}.step .btn{grid-column:2}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="workflow.html">⚡ Auto Workflow</a><a href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><h1>⚡ Automatyczny workflow książki</h1><p class="muted">KDP HERO wykrywa zakończone etapy i prowadzi projekt do następnego kroku.</p><section class="card"><div class="bar"><div id="fill" class="fill"></div></div><p id="progress"></p></section><section id="steps" class="card"></section><section class="card"><h2>Następny krok</h2><p id="next"></p><div class="actions"><a id="continue" class="btn">Kontynuuj automatycznie →</a><button id="refresh" class="btn dark">Odśwież status</button></div></section><script>const $=s=>document.querySelector(s);function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}}function state(){let o=get('kdpOutline'),w=get('kdpWriter'),m=get('kdpManuscript'),c=get('kdpCover'),k=get('kdpKeywords'),check=get('kdpPublishReady'),p=get('kdpPublishPackage'),f=get('kdpFinalPublishing'),words=String(m.content||m.text||'').trim().split(/\s+/).filter(Boolean).length,kw=Array.isArray(k.selected)?k.selected:Array.isArray(k.keywords)?k.keywords:[];return[{n:'Pomysł i projekt',done:!!(get('kdpNewProject').n||w.title||c.title),url:'index.html'},{n:'Outline',done:!!(o.chapters?.length||o.outline?.length||o.content),url:'outline.html'},{n:'Pisanie',done:!!(w.content||w.chapters?.length||words>100),url:'writer.html'},{n:'Manuskrypt',done:words>500,url:'manuscript.html'},{n:'Okładka',done:!!c.generated,url:'cover.html'},{n:'Keywords',done:kw.length>=7,url:'keywords.html'},{n:'KDP Check',done:!!check.ready,url:'check.html'},{n:'Publish Package',done:String(p.description||'').length>=400,url:'publish-package.html'},{n:'Final Publishing',done:!!f.ready,url:'publishing-center.html'}]}function render(){let s=state(),done=s.filter(x=>x.done).length,pct=Math.round(done/s.length*100),next=s.find(x=>!x.done)||s[s.length-1];$('#fill').style.width=pct+'%';$('#progress').innerHTML=`Ukończono <b>${done}/${s.length}</b> etapów · <b>${pct}%</b>`;$('#steps').innerHTML=s.map((x,i)=>`<div class="step ${x.done?'ok':''}"><div class="num">${x.done?'✓':i+1}</div><div><b>${x.n}</b><div class="muted">${x.done?'Etap zakończony':'Oczekuje na wykonanie'}</div></div><a class="btn dark" href="${x.url}">${x.done?'Sprawdź':'Otwórz'}</a></div>`).join('');$('#next').innerHTML=done===s.length?'<b style="color:#08794e">✓ Projekt przeszedł cały workflow i jest gotowy do końcowej publikacji.</b>':`KDP HERO proponuje teraz: <b>${next.n}</b>.`;$('#continue').href=next.url;$('#continue').textContent=done===s.length?'Otwórz Publishing Center →':'Kontynuuj: '+next.n+' →';localStorage.setItem('kdpWorkflow',JSON.stringify({done,total:s.length,progress:pct,next:next.n,updatedAt:new Date().toISOString()}))}$('#refresh').onclick=render;render();</script></main></div></body></html>
