<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Wszystkie książki</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#747c8e}.search,.sort{border:1px solid #d9dee7;border-radius:10px;padding:11px;background:#fff}.search{width:250px}.btn{border:1px solid #dce0e8;background:#fff;border-radius:8px;padding:8px 9px;text-decoration:none;color:#222;font-size:12px;cursor:pointer}.primary{background:#6842ed;color:#fff;border-color:#6842ed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat,.book,.filters{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:16px}.stat b{display:block;font-size:26px;margin-top:5px}.filters{margin-top:16px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.filter{border:1px solid #dce0e8;background:#fff;border-radius:99px;padding:8px 11px;font-size:11px;font-weight:800;cursor:pointer}.filter.on{background:#6842ed;color:#fff;border-color:#6842ed}.sortbox{margin-left:auto}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}.cover{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(150deg,#07111d,#17202c);color:#f4d589;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 25px #1112}.cover h2{font-family:Georgia,serif;font-size:23px}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#eef1f5;color:#465063;margin-right:3px}.badge.writing{background:#ede9fe;color:#5634d6}.badge.review{background:#fff3d9;color:#946000}.badge.ready{background:#e7f9ef;color:#08794e}.badge.submitted{background:#e4f3ff;color:#12669a}.badge.published{background:#dff8e9;color:#05663f}.priority.urgent{background:#ffe3e7;color:#a51d2d}.priority.high{background:#fff0d5;color:#946000}.priority.normal{background:#e9f1ff;color:#245e9b}.priority.low{background:#eef1f5;color:#596273}.progress{height:7px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#6842ed}.meta{font-size:12px;color:#777f90;line-height:1.7}.empty{text-align:center;padding:70px;background:#fff;border:1px dashed #ccd2dd;border-radius:15px;margin-top:18px}@media(max-width:1100px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.main{padding:16px}.sortbox{margin-left:0}}@media(max-width:520px){.books,.stats{grid-template-columns:1fr}.search{width:100%}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="books.html">▤ Wszystkie książki</a><a href="new-book.html">＋ Nowa książka</a><a href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><div class="top"><div><h1>Wszystkie książki</h1><p class="muted">Najważniejsze projekty mogą być automatycznie wyświetlane na początku.</p></div><div><input id="search" class="search" placeholder="Szukaj książki…"> <a href="new-book.html" class="btn primary">＋ Nowa książka</a></div></div><section class="stats"><div class="stat"><span class="muted">Wszystkie</span><b id="count">0</b></div><div class="stat"><span class="muted">W trakcie</span><b id="activeCount">0</b></div><div class="stat"><span class="muted">Gotowe / KDP</span><b id="ready">0</b></div><div class="stat"><span class="muted">Opublikowane</span><b id="published">0</b></div></section><section class="filters" id="filters"><button class="filter on" data-filter="all">Wszystkie</button><button class="filter" data-filter="idea">Pomysł</button><button class="filter" data-filter="writing">Pisanie</button><button class="filter" data-filter="review">Kontrola</button><button class="filter" data-filter="ready">Gotowe</button><button class="filter" data-filter="submitted">W KDP</button><button class="filter" data-filter="published">Opublikowane</button><div class="sortbox">Sortuj: <select id="sort" class="sort"><option value="priority">Priorytet — najważniejsze</option><option value="progress">Najbliżej ukończenia</option><option value="updated">Ostatnio zmieniane</option><option value="title">Tytuł A–Z</option></select></div></section><section id="library"></section><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script>const $=s=>document.querySelector(s);let currentFilter='all';function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseSnap(b,k,d={}){try{return JSON.parse(b.snapshot?.[k]||JSON.stringify(d))}catch(e){return d}}function render(){let q=$('#search').value.toLowerCase(),list=KDPProjectStore.list(),active=KDPProjectStore.active(),statuses=list.map(b=>KDPBookStatus.status(b));$('#count').textContent=list.length;$('#activeCount').textContent=statuses.filter(s=>!['ready','submitted','published'].includes(s.key)).length;$('#ready').textContent=statuses.filter(s=>['ready','submitted'].includes(s.key)).length;$('#published').textContent=statuses.filter(s=>s.key==='published').length;let filtered=list.filter(b=>{let s=KDPBookStatus.status(b),w=parseSnap(b,'kdpWriter'),match=[b.title,b.type,w.author,w.topic].join(' ').toLowerCase().includes(q);return match&&(currentFilter==='all'||s.key===currentFilter)});filtered=KDPBookPriority.sort(filtered,$('#sort').value);if(!filtered.length){$('#library').innerHTML='<div class="empty"><h2>Brak książek w tym widoku</h2></div>';return}$('#library').innerHTML='<div class="books">'+filtered.map(b=>{let w=parseSnap(b,'kdpWriter'),s=KDPBookStatus.status(b),p=KDPBookPriority.rank(b),isActive=b.id===active;return `<article class="book"><div class="cover"><div><small>${isActive?'AKTYWNY PROJEKT':'KDP PROJECT'}</small><h2>${esc(b.title||'Bez tytułu')}</h2></div><small>${esc(String(w.author||'Karolcia').toUpperCase())}</small></div><h3>${esc(b.title)}</h3><span class="badge ${s.key}">${esc(s.label)}</span><span class="badge priority ${p.key}">Priorytet: ${p.label}</span><div class="progress"><i style="width:${s.progress}%"></i></div><div class="meta">Postęp: <b>${s.progress}%</b><br>Aktualizacja: ${new Date(b.updatedAt||b.createdAt).toLocaleString('pl-PL')}</div><p><button class="btn primary" data-open="${b.id}" data-next="${esc(s.next)}">${s.key==='published'?'Otwórz':'Kontynuuj'} →</button></p></article>`}).join('')+'</div>'}$('#filters').onclick=e=>{let b=e.target.closest('[data-filter]');if(!b)return;currentFilter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('on',x===b));render()};$('#search').oninput=render;$('#sort').onchange=render;$('#library').onclick=e=>{let b=e.target.closest('[data-open]');if(b&&KDPProjectStore.load(b.dataset.open))location.href=b.dataset.next||'keywords.html'};render();</script></main></div></body></html>
