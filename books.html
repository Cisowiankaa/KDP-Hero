<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Wszystkie książki</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#747c8e}.search{border:1px solid #d9dee7;border-radius:10px;padding:12px;width:280px}.btn{border:1px solid #dce0e8;background:#fff;border-radius:8px;padding:8px 9px;text-decoration:none;color:#222;font-size:12px;cursor:pointer}.primary{background:#6842ed;color:#fff;border-color:#6842ed}.danger{color:#a51d2d;border-color:#efc5ca}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat,.book{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:16px}.stat b{display:block;font-size:26px;margin-top:5px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}.cover{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(150deg,#07111d,#17202c);color:#f4d589;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 25px #1112}.cover.ivory{background:linear-gradient(150deg,#fffdf7,#ece4d5);color:#171717}.cover.tech{background:linear-gradient(150deg,#050914,#153a59);color:#eaf7ff}.cover h2{font-family:Georgia,serif;font-size:23px;line-height:1.05}.cover small{letter-spacing:2px;font-weight:800}.badge{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#e7f9ef;color:#08794e}.active{background:#f0edff;color:#5634d6;margin-left:4px}.meta{font-size:12px;color:#777f90;line-height:1.7}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.keywords{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.kw{background:#f0edff;color:#5634d6;border-radius:6px;padding:4px 6px;font-size:9px}.progress{height:7px;background:#e9edf3;border-radius:20px;overflow:hidden;margin:10px 0 4px}.progress i{display:block;height:100%;background:#6842ed}.empty{text-align:center;padding:70px 20px;background:#fff;border:1px dashed #ccd2dd;border-radius:15px;margin-top:18px}.notice{margin-top:15px;background:#eefbf4;color:#08794e;padding:11px;border-radius:9px;display:none}@media(max-width:1100px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.main{padding:16px}}@media(max-width:520px){.books,.stats{grid-template-columns:1fr}.search{width:100%}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="books.html">▤ Wszystkie książki</a><a href="new-book.html">＋ Nowa książka</a><a href="keywords.html">⌕ Research keywords</a><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="manuscript.html">▤ Manuskrypt</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a></aside><main class="main"><div class="top"><div><h1 style="margin:0">Wszystkie książki</h1><p class="muted">Każdy projekt pamięta własne dane i etap, na którym przerwano pracę.</p></div><div><input id="search" class="search" placeholder="Szukaj książki…"> <a href="new-book.html" class="btn primary">＋ Nowa książka</a></div></div><section class="stats"><div class="stat"><span class="muted">Wszystkie</span><b id="count">0</b></div><div class="stat"><span class="muted">Aktywna</span><b id="activeCount">0</b></div><div class="stat"><span class="muted">Gotowe KDP</span><b id="ready">0</b></div><div class="stat"><span class="muted">Ostatnio zmienione</span><b id="recent">0</b></div></section><div id="notice" class="notice"></div><section id="library"></section><script src="project-store.js"></script><script src="workflow-progress.js"></script><script src="project-switcher.js"></script><script>const $=s=>document.querySelector(s);function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function parseSnap(b,key,d={}){try{return JSON.parse(b.snapshot?.[key]||JSON.stringify(d))}catch(e){return d}}function styleClass(v){return v==='Modern Ivory'?'ivory':v==='Midnight Tech'?'tech':''}function workflowFor(b){let w=parseSnap(b,'kdpWorkflow',{});return{progress:Number(w.progress)||0,next:w.next||'keywords.html'}}function flash(t){$('#notice').textContent=t;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',2500)}function render(){let q=$('#search').value.toLowerCase(),list=KDPProjectStore.list(),active=KDPProjectStore.active(),filtered=list.filter(b=>{let p=parseSnap(b,'kdpNewProject'),w=parseSnap(b,'kdpWriter'),k=parseSnap(b,'kdpKeywords'),keys=Array.isArray(k.selected)?k.selected:[];return[b.title,b.type,p.n,w.author,w.topic,...keys].join(' ').toLowerCase().includes(q)});$('#count').textContent=list.length;$('#activeCount').textContent=active?1:0;$('#ready').textContent=list.filter(b=>parseSnap(b,'kdpPublishReady').ready).length;$('#recent').textContent=list.filter(b=>Date.now()-new Date(b.updatedAt||b.createdAt).getTime()<7*86400000).length;if(!filtered.length){$('#library').innerHTML=`<div class="empty"><h2>${list.length?'Brak wyników':'Biblioteka jest jeszcze pusta'}</h2><p class="muted">Utwórz pierwszy projekt książki.</p><a class="btn primary" href="new-book.html">＋ Utwórz książkę</a></div>`;return}$('#library').innerHTML='<div class="books">'+filtered.map(b=>{let p=parseSnap(b,'kdpNewProject'),w=parseSnap(b,'kdpWriter'),c=parseSnap(b,'kdpCover'),k=parseSnap(b,'kdpKeywords'),r=parseSnap(b,'kdpPublishReady'),flow=workflowFor(b),keys=Array.isArray(k.selected)?k.selected:[],isActive=b.id===active;return `<article class="book"><div class="cover ${styleClass(c.variant)}"><div><small>${isActive?'AKTYWNY PROJEKT':'KDP PROJECT'}</small><h2>${esc(b.title||p.n||'Bez tytułu')}</h2></div><div><div style="font-size:11px;margin-bottom:10px">${esc(b.type||p.t||'Paperback')} · ${esc(c.format||'KDP')}</div><small>${esc(String(w.author||c.author||'Karolcia').toUpperCase())}</small></div></div><h3>${esc(b.title)}</h3><span class="badge">${r.ready?'✓ KDP READY':'○ W TRAKCIE'}</span>${isActive?'<span class="badge active">AKTYWNA</span>':''}<div class="progress"><i style="width:${flow.progress}%"></i></div><div class="meta">Postęp workflow: <b>${flow.progress}%</b><br>Typ: ${esc(b.type||'Paperback')}<br>Aktualizacja: ${new Date(b.updatedAt||b.createdAt).toLocaleString('pl-PL')}</div><div class="keywords">${keys.slice(0,4).map(x=>`<span class="kw">${esc(x)}</span>`).join('')}</div><div class="actions"><button class="btn primary" data-open="${b.id}" data-next="${esc(flow.next)}">Kontynuuj</button><button class="btn" data-rename="${b.id}">Zmień nazwę</button><button class="btn" data-copy="${b.id}">Duplikuj</button><button class="btn danger" data-delete="${b.id}">Usuń</button></div></article>`}).join('')+'</div>'}$('#search').oninput=render;$('#library').onclick=e=>{let b=e.target.closest('[data-open],[data-rename],[data-copy],[data-delete]');if(!b)return;if(b.dataset.open){if(KDPProjectStore.load(b.dataset.open)){let next=(JSON.parse(localStorage.getItem('kdpWorkflow')||'{}').next)||b.dataset.next||'keywords.html';location.href=next}}else if(b.dataset.rename){let all=KDPProjectStore.books(),old=all[b.dataset.rename]?.title||'',name=prompt('Nowa nazwa książki:',old);if(name&&KDPProjectStore.rename(b.dataset.rename,name)){flash('✓ Nazwa została zmieniona.');render()}}else if(b.dataset.copy){let all=KDPProjectStore.books(),old=all[b.dataset.copy]?.title||'Książka',name=prompt('Nazwa kopii:',old+' — kopia');if(name){let id=KDPProjectStore.duplicate(b.dataset.copy,name);if(id){flash('✓ Utworzono niezależną kopię książki.');render()}}}else if(b.dataset.delete){let all=KDPProjectStore.books(),name=all[b.dataset.delete]?.title||'ten projekt';if(confirm(`Usunąć „${name}”? Tej operacji nie można cofnąć.`)){KDPProjectStore.remove(b.dataset.delete);flash('Projekt został usunięty.');render()}}};render();</script></main></div></body></html>
