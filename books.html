<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Biblioteka</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#747c8e}.search{border:1px solid #d9dee7;border-radius:10px;padding:12px;width:280px}.btn{border:1px solid #dce0e8;background:#fff;border-radius:8px;padding:8px 9px;text-decoration:none;color:#222;font-size:12px;cursor:pointer}.primary{background:#6842ed;color:#fff;border-color:#6842ed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.stat,.book{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:16px}.stat b{display:block;font-size:26px;margin-top:5px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}.cover{aspect-ratio:2/3;border-radius:10px;background:linear-gradient(150deg,#07111d,#17202c);color:#f4d589;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 25px #1112}.cover.ivory{background:linear-gradient(150deg,#fffdf7,#ece4d5);color:#171717}.cover.tech{background:linear-gradient(150deg,#050914,#153a59);color:#eaf7ff}.cover h2{font-family:Georgia,serif;font-size:23px;line-height:1.05}.cover small{letter-spacing:2px;font-weight:800}.badge,.amazon{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:800}.badge{background:#e7f9ef;color:#08794e}.amazon{background:#fff3dc;color:#9a5c00;margin-left:4px}.amazon.live{background:#e7f9ef;color:#08794e}.meta{font-size:12px;color:#777f90;line-height:1.7}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.keywords{display:flex;gap:4px;flex-wrap:wrap;margin-top:9px}.kw{background:#f0edff;color:#5634d6;border-radius:6px;padding:4px 6px;font-size:9px}.empty{text-align:center;padding:70px 20px;background:#fff;border:1px dashed #ccd2dd;border-radius:15px;margin-top:18px}@media(max-width:1100px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.main{padding:16px}}@media(max-width:520px){.books,.stats{grid-template-columns:1fr}.search{width:100%}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="books.html">▤ Wszystkie książki</a><a href="keywords.html">⌕ Research keywords</a><a href="author-dna.html">♙ Author DNA</a><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="manuscript.html">▤ Manuskrypt</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a></aside><main class="main"><div class="top"><div><h1 style="margin:0">Wszystkie książki</h1><p class="muted">Biblioteka publikacji i centrum zarządzania książkami KDP.</p></div><div><input id="search" class="search" placeholder="Szukaj książki, autora, keyword…"> <a class="btn primary" href="outline.html">＋ Nowa książka</a></div></div><section class="stats"><div class="stat"><span class="muted">Wszystkie</span><b id="count">0</b></div><div class="stat"><span class="muted">Gotowe</span><b id="ready">0</b></div><div class="stat"><span class="muted">Opublikowane Amazon</span><b id="live">0</b></div><div class="stat"><span class="muted">Archiwum</span><b id="archived">0</b></div></section><section id="library"></section><script>let books=[];try{books=JSON.parse(localStorage.getItem('kdpLibrary')||'[]')}catch(e){}const $=s=>document.querySelector(s);function save(){localStorage.setItem('kdpLibrary',JSON.stringify(books))}function styleClass(v){return v==='Modern Ivory'?'ivory':v==='Midnight Tech'?'tech':''}function actualIndex(x){return books.indexOf(x)}function render(q=''){q=q.toLowerCase();let a=books.filter(x=>([x.n,x.author,x.t,x.format,...(x.keywords||[])].join(' ')).toLowerCase().includes(q));$('#count').textContent=books.length;$('#ready').textContent=books.filter(x=>!x.archived).length;$('#live').textContent=books.filter(x=>x.amazonStatus==='Opublikowana').length;$('#archived').textContent=books.filter(x=>x.archived).length;if(!a.length){$('#library').innerHTML=`<div class="empty"><h2>${books.length?'Brak wyników':'Biblioteka jest jeszcze pusta'}</h2><p class="muted">Ukończ projekt w KDP Check albo rozpocznij nową książkę.</p><a class="btn primary" href="outline.html">＋ Utwórz książkę</a></div>`;return}$('#library').innerHTML=`<div class="books">${a.map(x=>{let i=actualIndex(x);return `<article class="book" style="${x.archived?'opacity:.58':''}"><div class="cover ${styleClass(x.coverVariant)}"><div><small>${x.archived?'ARCHIWUM':'KDP EDITION'}</small><h2>${x.n||'Bez tytułu'}</h2></div><div><div style="font-size:11px;margin-bottom:10px">${x.t||'Paperback'} · ${x.format||'KDP'}</div><small>${String(x.author||'Karolcia').toUpperCase()}</small></div></div><h3>${x.n||'Bez tytułu'}</h3><span class="badge">✓ ${x.s||'Gotowe'} · ${x.p||100}%</span><span class="amazon ${x.amazonStatus==='Opublikowana'?'live':''}">${x.amazonStatus==='Opublikowana'?'● Amazon LIVE':'○ Nieopublikowana'}</span><p class="meta">Autor: ${x.author||'Karolcia'}<br>Format: ${x.t||'Paperback'} ${x.format?'· '+x.format:''}<br>${x.completedAt?'Ukończono: '+new Date(x.completedAt).toLocaleDateString('pl-PL'):''}</p><div class="keywords">${(x.keywords||[]).slice(0,4).map(k=>`<span class="kw">${k}</span>`).join('')}</div><div class="actions"><button class="btn primary" data-edit="${i}">Edytuj</button><button class="btn" data-export="${i}">Eksport</button><button class="btn" data-copy="${i}">Duplikuj</button><button class="btn" data-amazon="${i}">${x.amazonStatus==='Opublikowana'?'Cofnij LIVE':'Amazon LIVE'}</button><button class="btn" data-archive="${i}">${x.archived?'Przywróć':'Archiwizuj'}</button></div></article>`}).join('')}</div>`}$('#search').oninput=e=>render(e.target.value);$('#library').onclick=e=>{let b=e.target.closest('[data-edit],[data-export],[data-copy],[data-amazon],[data-archive]');if(!b)return;let key=['edit','export','copy','amazon','archive'].find(k=>b.dataset[k]!=null),i=+b.dataset[key],x=books[i];if(key==='edit'){localStorage.setItem('kdpNewProject',JSON.stringify(x));location.href='writer.html'}if(key==='export'){localStorage.setItem('kdpNewProject',JSON.stringify(x));location.href='export.html'}if(key==='copy'){let y={...x,n:(x.n||'Książka')+' — kopia',s:'Projekt',p:10,amazonStatus:'',archived:false,completedAt:''};books.unshift(y);save();let ps=[];try{ps=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}ps.unshift(y);localStorage.setItem('kdpProjectsV2',JSON.stringify(ps));render($('#search').value)}if(key==='amazon'){x.amazonStatus=x.amazonStatus==='Opublikowana'?'':'Opublikowana';save();render($('#search').value)}if(key==='archive'){x.archived=!x.archived;save();render($('#search').value)}};render();</script></main></div></body></html>
