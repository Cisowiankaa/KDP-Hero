<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Wszystkie książki</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:white;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:25px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.muted{color:#747c8e}.search{border:1px solid #d9dee7;border-radius:10px;padding:12px;width:280px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat,.card{background:white;border:1px solid #e1e5ec;border-radius:15px;padding:18px}.stat b{display:block;font-size:26px;margin-top:5px}.books{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:18px}.book{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:14px}.cover{aspect-ratio:2/3;border-radius:9px;background:linear-gradient(150deg,#07111d,#17202c);color:#f4d589;padding:20px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 12px 25px #1112}.cover.ivory{background:linear-gradient(150deg,#fffdf7,#ece4d5);color:#171717}.cover.tech{background:linear-gradient(150deg,#050914,#153a59);color:#eaf7ff}.cover h2{font-family:Georgia,serif;font-size:23px;line-height:1.05}.cover small{letter-spacing:2px;font-weight:800}.badge{display:inline-block;background:#e7f9ef;color:#08794e;padding:5px 8px;border-radius:99px;font-size:11px;font-weight:800}.meta{font-size:12px;color:#777f90;line-height:1.7}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #dce0e8;background:#fff;border-radius:8px;padding:8px 9px;text-decoration:none;color:#222;font-size:12px;cursor:pointer}.primary{background:#6842ed;color:#fff;border-color:#6842ed}.empty{text-align:center;padding:70px 20px;background:#fff;border:1px dashed #ccd2dd;border-radius:15px;margin-top:18px}.empty h2{margin-bottom:6px}@media(max-width:1100px){.books{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{grid-template-columns:1fr}.books{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr}.main{padding:16px}}@media(max-width:520px){.books{grid-template-columns:1fr}.search{width:100%}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="books.html">▤ Wszystkie książki</a><a href="index.html">▥ Projekty</a><a href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a></aside><main class="main"><div class="top"><div><h1 style="margin:0">Wszystkie książki</h1><p class="muted">Twoja biblioteka ukończonych publikacji KDP.</p></div><input id="search" class="search" placeholder="Szukaj książki lub autora…"></div><section class="stats"><div class="stat"><span class="muted">Gotowe książki</span><b id="count">0</b></div><div class="stat"><span class="muted">Paperback</span><b id="paper">0</b></div><div class="stat"><span class="muted">E-book / pozostałe</span><b id="digital">0</b></div></section><section id="library"></section><script>let books=[];try{books=JSON.parse(localStorage.getItem('kdpLibrary')||'[]')}catch(e){}const $=s=>document.querySelector(s);function styleClass(v){return v==='Modern Ivory'?'ivory':v==='Midnight Tech'?'tech':''}function render(q=''){let a=books.filter(x=>(String(x.n||'')+' '+String(x.author||'')).toLowerCase().includes(q.toLowerCase()));$('#count').textContent=books.length;$('#paper').textContent=books.filter(x=>x.t==='Paperback').length;$('#digital').textContent=books.filter(x=>x.t!=='Paperback').length;if(!a.length){$('#library').innerHTML=`<div class="empty"><h2>${books.length?'Brak wyników':'Biblioteka jest jeszcze pusta'}</h2><p class="muted">${books.length?'Zmień wyszukiwaną frazę.':'Ukończ książkę w KDP Check, a automatycznie pojawi się tutaj.'}</p><a class="btn primary" href="outline.html">＋ Utwórz nową książkę</a></div>`;return}$('#library').innerHTML=`<div class="books">${a.map((x,i)=>`<article class="book"><div class="cover ${styleClass(x.coverVariant)}"><div><small>PREMIUM EDITION</small><h2>${x.n||'Bez tytułu'}</h2></div><div><div style="font-size:11px;margin-bottom:10px">${x.t||'Paperback'} · ${x.format||'KDP'}</div><small>${String(x.author||'Karolcia').toUpperCase()}</small></div></div><h3>${x.n||'Bez tytułu'}</h3><span class="badge">✓ ${x.s||'Gotowe'} · ${x.p||100}%</span><p class="meta">Autor: ${x.author||'Karolcia'}<br>Format: ${x.t||'Paperback'} ${x.format?'· '+x.format:''}<br>${x.completedAt?'Ukończono: '+new Date(x.completedAt).toLocaleDateString('pl-PL'):''}</p><div class="actions"><button class="btn primary" data-open="${i}">Otwórz</button><a class="btn" href="check.html">KDP Check</a><button class="btn" data-delete="${i}">Usuń</button></div></article>`).join('')}</div>`}$('#search').oninput=e=>render(e.target.value);$('#library').onclick=e=>{let o=e.target.closest('[data-open]');if(o){let b=books[+o.dataset.open];localStorage.setItem('kdpNewProject',JSON.stringify(b));location.href='index.html'}let d=e.target.closest('[data-delete]');if(d&&confirm('Usunąć książkę z biblioteki?')){books.splice(+d.dataset.delete,1);localStorage.setItem('kdpLibrary',JSON.stringify(books));render($('#search').value)}};render();</script></main></div></body></html>
