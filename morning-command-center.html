<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Morning Command Center 4.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.hero{background:linear-gradient(135deg,#101827,#34207e);color:#fff;border-radius:17px;padding:24px;margin:18px 0}.hero .muted{color:#cbd1df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.task{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:15px}.card strong{display:block;font-size:28px;margin-top:6px}.task{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;margin:8px 0}.num{width:32px;height:32px;border-radius:50%;background:#ede9fe;color:#5634d6;display:grid;place-items:center;font-weight:900}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:10px 13px;font-weight:900;cursor:pointer}.startday{font-size:16px;padding:14px 20px;background:#19a974}.pause{background:#e3a008}.evening{background:#4338ca;text-decoration:none;display:inline-block}.danger{color:#a51d2d;font-weight:900}.progress{height:9px;background:#ffffff2b;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#fff}.health,.capacity{padding:12px 14px;border-radius:11px;margin:12px 0;font-size:13px}.health.ok,.capacity{background:#eefbf6;color:#12684e;border:1px solid #c8ecde}.health.bad{background:#fff4e5;color:#8a5700;border:1px solid #f0d6a4}.ceo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 20px}.ceo .card{border-top:3px solid #6842ed}.tag{display:inline-block;font-size:10px;font-weight:900;padding:4px 7px;border-radius:99px;background:#ede9fe;color:#5634d6;margin-top:6px}@media(max-width:850px){.grid,.ceo{grid-template-columns:1fr 1fr}}@media(max-width:550px){.app{grid-template-columns:1fr}.grid,.ceo{grid-template-columns:1fr}.task{grid-template-columns:36px 1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="morning-command-center.html">☀ Morning Command</a><a href="evening-command-center.html">🌙 Evening Command</a><a href="ceo-mode.html">♛ CEO Mode</a><a href="production-manager.html">▶ Production Manager</a><a href="production-calendar.html">📅 Production Calendar</a><a href="production-forecast.html">◉ Production Forecast</a><a href="system-health-center.html">🛡 System Health</a></aside><main class="main"><h1 style="margin-bottom:4px">☀ Morning Command Center 4.1</h1><div class="muted" id="date"></div><div id="health"></div><div id="capacity"></div><section id="hero" class="hero"></section><div id="stats" class="grid"></div><h2>♛ TOP 3 CEO</h2><div id="ceoTop" class="ceo"></div><h2>Plan na dzisiaj</h2><div id="tasks"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="production-calendar.js"></script><script src="production-forecast.js"></script><script src="morning-command-center.js"></script><script src="smart-workload-engine.js"></script><script src="ceo-mode.js"></script><script src="self-healing-engine.js"></script><script src="day-autopilot.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let x=KDPMorningCommand.build(),w=KDPDayAutopilot.workload(),ap=KDPDayAutopilot.state(),p=KDPDayAutopilot.progress(),h=KDPSelfHealing.diagnose(),ceo=KDPCEOMode.build(),first=w.tasks[0];date.textContent=new Date(x.day+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',year:'numeric',month:'long',day:'numeric'});health.innerHTML=h.healthy?'<div class="health ok">🛡 System Health: wszystkie silniki gotowe do pracy.</div>':`<div class="health bad">🛠 Wykryto <b>${h.issues.length}</b> problemów. <button class="btn" id="heal">Napraw</button></div>`;capacity.innerHTML=`<div class="capacity"><b>Dzisiejsza pojemność:</b> ${w.capacity.limit} zadań · odłożone ${w.deferred||0} · ryzyko ${x.risk.length} · zaległe ${x.late}.</div>`;if(ap&&ap.finished)hero.innerHTML=`<div class="muted">DZIEŃ PRODUKCYJNY ZAKOŃCZONY</div><h2>✓ Autopilot wykonał plan</h2><p>${p.completed} z ${p.total} zadań. Przejdź do Evening Command, aby zapisać raport i przygotować kolejny dzień.</p><div class="progress"><i style="width:100%"></i></div><a class="btn evening" href="evening-command-center.html">🌙 ZAMKNIJ DZIEŃ →</a>`;else if(ap&&(ap.active||ap.paused))hero.innerHTML=`<div class="muted">DAY AUTOPILOT · ${ap.paused?'PAUZA':'AKTYWNY'}</div><h2>${ap.current?esc(ap.current.title):'Plan dnia'}</h2><p>${ap.current?esc(ap.current.text||'Następne zadanie'):'Oczekiwanie'}</p><div class="progress"><i style="width:${p.percent}%"></i></div><p>${p.completed}/${p.total} · ${p.percent}% · replany ${p.replans||0}</p>${ap.paused?'<button class="btn startday" id="resumeAuto">▶ Wznów dzień</button>':'<button class="btn pause" id="pauseAuto">Ⅱ Pauza</button>'}`;else hero.innerHTML=first?`<div class="muted">PIERWSZE ZADANIE · ${esc(first.status||'')}</div><h2>${esc(first.title)}</h2><p>${esc(first.text||'Rozpocznij produkcję')}</p><button class="btn startday" id="startAuto">▶ ROZPOCZNIJ DZIEŃ</button>`:`<h2>✓ Brak zadań na dziś</h2><p>System nie znalazł aktywnych zadań wymagających pracy.</p><a class="btn evening" href="evening-command-center.html">🌙 PODSUMUJ DZIEŃ →</a>`;stats.innerHTML=`<div class="card">Zadania dziś<strong>${w.tasks.length}</strong></div><div class="card">TOP CEO<strong>${ceo.focus.length}</strong></div><div class="card">Ryzyko<strong>${x.risk.length}</strong></div><div class="card">Zaległe<strong class="danger">${x.late}</strong></div>`;ceoTop.innerHTML=ceo.focus.map((r,i)=>`<div class="card"><small class="muted">#${i+1} PRIORYTET CEO</small><b>${esc(r.title)}</b><div class="tag">${esc(r.status)}</div><p class="muted" style="font-size:12px">${r.reasons.length?esc(r.reasons.join(' · ')):'Aktywny projekt'}${r.publication?' · publikacja '+new Date(r.publication+'T12:00').toLocaleDateString('pl-PL'):''}</p></div>`).join('')||'<div class="card muted">Brak aktywnych projektów CEO.</div>';tasks.innerHTML=w.tasks.map((t,i)=>`<div class="task"><div class="num">${i+1}</div><div><b>${esc(t.title)}</b><div class="muted">${esc(t.text)}</div></div><button class="btn" data-start="${i}">Start →</button></div>`).join('')||'<div class="card muted">Brak zadań.</div>';let heal=document.getElementById('heal'),b=document.getElementById('startAuto'),c=document.getElementById('pauseAuto'),d=document.getElementById('resumeAuto');if(heal)heal.onclick=()=>{KDPSelfHealing.repair({source:'morning-command'});render()};if(b)b.onclick=()=>{let z=KDPSelfHealing.diagnose();if(!z.healthy)KDPSelfHealing.repair({source:'start-day'});KDPDayAutopilot.start()};if(c)c.onclick=()=>{KDPDayAutopilot.pause();render()};if(d)d.onclick=()=>KDPDayAutopilot.resume(true);document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>KDPMorningCommand.open(w.tasks[Number(b.dataset.start)]))}window.addEventListener('kdp-day-autopilot',()=>setTimeout(render,0));window.addEventListener('kdp-project-change',()=>setTimeout(render,0));render();</script></body></html>
