<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Morning Command Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.hero{background:linear-gradient(135deg,#101827,#34207e);color:#fff;border-radius:17px;padding:22px;margin:18px 0}.hero .muted{color:#cbd1df}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.task{background:#fff;border:1px solid #e3e6ed;border-radius:13px;padding:15px}.card strong{display:block;font-size:28px;margin-top:6px}.task{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;margin:8px 0}.num{width:32px;height:32px;border-radius:50%;background:#ede9fe;color:#5634d6;display:grid;place-items:center;font-weight:900}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:10px 13px;font-weight:900;cursor:pointer}.start{background:#fff;color:#34207e}.auto{background:#13a36f;color:#fff;margin-left:8px}.pause{background:#e3a008}.danger{color:#a51d2d;font-weight:900}.progress{height:9px;background:#ffffff2b;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;background:#fff;border-radius:99px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.task{grid-template-columns:36px 1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="morning-command-center.html">☀ Morning Command</a><a href="production-manager.html">▶ Production Manager</a><a href="production-calendar.html">📅 Production Calendar</a><a href="production-forecast.html">◉ Production Forecast</a></aside><main class="main"><h1 style="margin-bottom:4px">☀ Morning Command Center</h1><div class="muted" id="date"></div><section id="hero" class="hero"></section><div id="stats" class="grid"></div><h2>Plan na dzisiaj</h2><div id="tasks"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="production-calendar.js"></script><script src="production-forecast.js"></script><script src="morning-command-center.js"></script><script src="day-autopilot.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let x=KDPMorningCommand.build(),ap=KDPDayAutopilot.state(),p=KDPDayAutopilot.progress();date.textContent=new Date(x.day+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',year:'numeric',month:'long',day:'numeric'});if(ap&&ap.finished)hero.innerHTML=`<div class="muted">AUTOPILOT DNIA</div><h2>✓ Plan dnia zakończony</h2><p>Wykonano ${p.completed} z ${p.total} zaplanowanych zadań.</p><div class="progress"><i style="width:100%"></i></div>`;else if(ap&&(ap.active||ap.paused))hero.innerHTML=`<div class="muted">AUTOPILOT DNIA · ${ap.paused?'PAUZA':'AKTYWNY'}</div><h2>${ap.current?esc(ap.current.title):'Plan dnia'}</h2><p>${ap.current?esc(ap.current.text||'Następne zadanie'):'Oczekiwanie na zadanie'}</p><div class="progress"><i style="width:${p.percent}%"></i></div><p>${p.completed} / ${p.total} zadań · ${p.percent}%</p>${ap.paused?'<button class="btn auto" id="resumeAuto">▶ Wznów Autopilot</button>':'<button class="btn pause" id="pauseAuto">Ⅱ Pauza</button>'}`;else hero.innerHTML=x.first?`<div class="muted">NAJLEPSZY START DNIA</div><h2 style="margin:6px 0">${esc(x.first.title)}</h2><p>${esc(x.first.text)}</p><button class="btn start" id="startFirst">▶ Zacznij od tego zadania</button><button class="btn auto" id="startAuto">⚡ Uruchom Autopilot dnia</button>`:`<h2>✓ Plan dnia jest czysty</h2><p class="muted">Nie ma obecnie zadań wymagających rozpoczęcia.</p>`;stats.innerHTML=`<div class="card">Zadania dzisiaj<strong>${x.queue.length}</strong></div><div class="card">Wykonane przez Autopilot<strong>${p.completed}</strong></div><div class="card">Książki zagrożone<strong>${x.risk.length}</strong></div><div class="card">Opóźnione<strong class="danger">${x.late}</strong></div>`;tasks.innerHTML=x.queue.slice(0,10).map((t,i)=>`<div class="task"><div class="num">${i+1}</div><div><b>${esc(t.title)}</b><div class="muted" style="font-size:12px">${esc(t.text)}</div></div><button class="btn" data-start="${i}">Start →</button></div>`).join('')||'<div class="card muted">Brak zadań na dziś.</div>';let a=document.getElementById('startFirst'),b=document.getElementById('startAuto'),c=document.getElementById('pauseAuto'),d=document.getElementById('resumeAuto');if(a)a.onclick=()=>KDPMorningCommand.open(x.first);if(b)b.onclick=()=>KDPDayAutopilot.start();if(c)c.onclick=()=>{KDPDayAutopilot.pause();render()};if(d)d.onclick=()=>KDPDayAutopilot.resume(true);document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>KDPMorningCommand.open(x.queue[Number(b.dataset.start)]))}window.addEventListener('kdp-day-autopilot',()=>setTimeout(render,0));render();</script></body></html>
