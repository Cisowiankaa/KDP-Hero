<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Planer pracy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1100px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:11px;border:1px solid #d9dee7;border-radius:9px;font:inherit}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.task{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #edf0f4}.muted{color:#747c8e}.late{color:#a51d2d;font-weight:800}.today{color:#08794e;font-weight:800}.pill{font-size:10px;padding:5px 7px;border-radius:99px;background:#ede9fe;color:#5634d6;font-weight:900}.danger{background:#fff;color:#a51d2d;border:1px solid #efc5ca;padding:7px 9px;border-radius:8px;cursor:pointer}@media(max-width:700px){.app{grid-template-columns:1fr}.grid,.task{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a class="on" href="work-scheduler.html">📅 Planer pracy</a><a href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><h1>📅 Planer pracy nad książkami</h1><p class="muted">Ustaw konkretną datę i godzinę pracy. Zaplanowane pozycje pojawiają się poniżej jako nadchodzące zadania.</p><section class="card"><h2>Zaplanuj pracę</h2><div class="grid"><label class="field">Książka<select id="book"></select></label><label class="field">Rodzaj zadania<select id="type"><option>Pisanie rozdziału</option><option>Research słów kluczowych</option><option>Okładka</option><option>Korekta i kontrola</option><option>Przygotowanie publikacji</option><option>Sprawdzenie KDP</option></select></label><label class="field">Data<input id="date" type="date"></label><label class="field">Godzina<input id="time" type="time"></label></div><label class="field" style="margin-top:12px">Notatka<textarea id="note" rows="3" placeholder="Co dokładnie chcesz zrobić?"></textarea></label><button id="add" class="btn" style="margin-top:12px">＋ Dodaj do planu</button></section><section class="card"><h2>Nadchodzące zadania</h2><div id="tasks"></div></section><script src="project-store.js"></script><script>const KEY='kdpScheduledWork',$=s=>document.querySelector(s);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function books(){return KDPProjectStore.list()}function init(){let bs=books();$('#book').innerHTML=bs.map(b=>`<option value="${b.id}">${b.title||'Bez tytułu'}</option>`).join('');let d=new Date();$('#date').value=d.toISOString().slice(0,10);$('#time').value='09:00';render()}function render(){let x=load().sort((a,b)=>new Date(a.at)-new Date(b.at)),now=new Date(),today=new Date().toISOString().slice(0,10);$('#tasks').innerHTML=x.length?x.map((t,i)=>{let dt=new Date(t.at),ds=t.at.slice(0,10),cls=dt<now?'late':ds===today?'today':'',label=dt<now?'ZALEGŁE':ds===today?'DZISIAJ':'NADCHODZĄCE';return `<div class="task"><div><b>${t.bookTitle}</b> <span class="pill">${label}</span><div class="${cls}" style="margin-top:5px">${dt.toLocaleString('pl-PL')}</div><div class="muted" style="margin-top:4px">${t.type}${t.note?' · '+t.note:''}</div></div><button class="danger" data-del="${i}">Usuń</button></div>`}).join(''):'<p class="muted">Nie masz jeszcze zaplanowanych zadań.</p>'}$('#add').onclick=()=>{let id=$('#book').value,b=books().find(x=>x.id===id),date=$('#date').value,time=$('#time').value;if(!b||!date||!time)return alert('Wybierz książkę, datę i godzinę.');let x=load();x.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),bookId:id,bookTitle:b.title||'Bez tytułu',type:$('#type').value,note:$('#note').value.trim(),at:date+'T'+time,done:false,createdAt:new Date().toISOString()});save(x);$('#note').value='';render()};$('#tasks').onclick=e=>{let b=e.target.closest('[data-del]');if(!b)return;let x=load().sort((a,c)=>new Date(a.at)-new Date(c.at));x.splice(+b.dataset.del,1);save(x);render()};init();</script></main></div></body></html>
