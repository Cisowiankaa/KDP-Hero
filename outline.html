<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Outline Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:8px;margin-top:10px}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:13px 18px;font-weight:800;cursor:pointer}.outline{display:grid;gap:9px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid #e6e9ef;border-radius:10px}.num{width:34px;height:34px;border-radius:9px;background:#ede9fe;color:#5634d6;display:grid;place-items:center;font-weight:800}.small{font-size:12px;color:#737b8d}.ok{color:#08794e;font-weight:700}.flow,.dna{padding:10px 12px;border-radius:10px;font-size:12px}.flow{background:#f0edff;color:#5634d6;font-weight:700}.dna{background:#ecfdf5;color:#08794e;margin-top:10px}@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="author-dna.html">♙ Author DNA</a></aside><main class="main"><div class="small">KDP HERO / AI Outline Creator</div><h1>AI Outline Creator</h1><div class="flow">1. OUTLINE → 2. AI PISANIE → 3. OKŁADKA → 4. KDP CHECK → 5. BIBLIOTEKA</div><div id="dnaInfo" class="dna"></div><section class="card"><h3>Ustaw książkę</h3><div class="grid"><input id="title" class="field" placeholder="Tytuł książki"><input id="topic" class="field" placeholder="Temat / nisza"><select id="count" class="field"><option value="8">8 rozdziałów</option><option value="10" selected>10 rozdziałów</option><option value="12">12 rozdziałów</option></select><select id="type" class="field"><option>Poradnik praktyczny</option><option>E-book edukacyjny</option><option>Książka ekspercka</option><option>Workbook</option></select><input id="audience" class="field" placeholder="Odbiorca"><input id="style" class="field" placeholder="Styl"></div><textarea id="notes" class="field" rows="3" style="margin-top:10px" placeholder="Dodatkowe wymagania..."></textarea><button id="generate" class="btn" style="margin-top:12px">✦ UTWÓRZ PLAN KSIĄŻKI</button></section><section class="card"><h3>Plan rozdziałów</h3><div id="outline" class="outline"><p class="small">Wpisz temat i utwórz plan.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="send" class="btn">ZAPISZ PLAN I PRZEJDŹ DO AI PISANIE →</button><button id="regen" class="btn" style="background:#ede9fe;color:#5634d6">↻ Inny plan</button></div><p id="status" class="ok"></p></section><script>const $=s=>document.querySelector(s);let plan=[],current=null,dna={};try{current=JSON.parse(localStorage.getItem('kdpNewProject')||'null')}catch(e){}try{dna=JSON.parse(localStorage.getItem('kdpAuthorDNA')||'{}')||{}}catch(e){}if(current){$('#title').value=current.n||'';$('#topic').value=current.n||''}$('#audience').value=dna.audience||'Początkujący';$('#style').value=(dna.tone||[]).join(', ')||dna.description||'Praktyczny i prosty';$('#dnaInfo').innerHTML=Object.keys(dna).length?`✓ Author DNA aktywne: <b>${dna.name||'Autor'}</b> · ${dna.audience||'odbiorca ogólny'} · ${(dna.tone||[]).join(', ')||'naturalny styl'}`:'Author DNA nie jest jeszcze skonfigurowane — używam ustawień projektu.';const base=['Wprowadzenie: problem i obietnica dla czytelnika','Fundamenty i najważniejsze pojęcia','Przygotowanie i pierwszy krok','Metoda krok po kroku','Praktyczne zastosowanie','Przykłady i scenariusze','Najczęstsze błędy i rozwiązania','Narzędzia, checklisty i dobre praktyki','Plan działania i wdrożenie','Podsumowanie i dalsze kroki','Techniki zaawansowane','Plan dalszego rozwoju'];function make(){let topic=$('#topic').value.trim()||$('#title').value.trim();if(!topic){$('#status').textContent='Wpisz temat lub tytuł.';return}let n=+$('#count').value;plan=Array.from({length:n},(_,i)=>({title:`Rozdział ${i+1} — ${base[i]}`,text:''}));render();$('#status').textContent='✓ Plan gotowy z uwzględnieniem Author DNA.'}function render(){$('#outline').innerHTML=plan.map((x,i)=>`<div class="row"><span class="num">${i+1}</span><input class="field chapterName" data-i="${i}" value="${x.title.replace(/^Rozdział \d+ — /,'')}"><span class="small">edytowalny</span></div>`).join('')}$('#generate').onclick=make;$('#regen').onclick=()=>{make();if(plan.length>3){plan[1].title='Rozdział 2 — Najważniejsze zasady i kontekst';plan[3].title='Rozdział 4 — System działania w praktyce';render();$('#status').textContent='✓ Alternatywny plan gotowy.'}};$('#outline').oninput=e=>{if(e.target.matches('.chapterName')){let i=+e.target.dataset.i;plan[i].title=`Rozdział ${i+1} — ${e.target.value}`}};$('#send').onclick=()=>{if(!plan.length){make();if(!plan.length)return}let dnaInstruction=`Author DNA: autor ${dna.name||'Karolcia'}; odbiorca ${dna.audience||$('#audience').value}; ton ${(dna.tone||[]).join(', ')||$('#style').value}; stosuj ${(dna.writing||[]).join(', ')||'jasną strukturę'}; ${dna.description?`styl: ${dna.description};`:''} ${dna.avoid?`unikaj: ${dna.avoid};`:''}`;let writer={title:$('#title').value||'',topic:$('#topic').value||$('#title').value||'',author:dna.name||'Karolcia',language:'Polski',audience:$('#audience').value,style:$('#style').value,goal:$('#type').value,instructions:[dnaInstruction,$('#notes').value].filter(Boolean).join(' '),authorDNA:dna,chapters:plan};localStorage.setItem('kdpWriter',JSON.stringify(writer));let ps=[];try{ps=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}let ix=ps.findIndex(x=>x.n===writer.title);if(ix>=0){ps[ix].s='Pisanie';ps[ix].p=25}else{ps.push({n:writer.title,t:current?.t||'Paperback',s:'Pisanie',p:25})}localStorage.setItem('kdpProjectsV2',JSON.stringify(ps));localStorage.setItem('kdpNewProject',JSON.stringify(ps[ix>=0?ix:ps.length-1]));$('#status').textContent='✓ Plan i Author DNA przekazane do Auto Writera.';setTimeout(()=>location.href='writer.html',250)};</script></main></div></body></html>
