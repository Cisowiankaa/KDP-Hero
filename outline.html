<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Outline Creator</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:8px;margin-top:10px}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:13px 18px;font-weight:800;cursor:pointer}.outline{display:grid;gap:9px}.row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid #e6e9ef;border-radius:10px}.num{width:34px;height:34px;border-radius:9px;background:#ede9fe;color:#5634d6;display:grid;place-items:center;font-weight:800}.small{font-size:12px;color:#737b8d}.ok{color:#08794e;font-weight:700}@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a class="on" href="outline.html">✎ AI Outline Creator</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka AI</a><a href="check.html">✓ KDP Check</a></aside><main class="main"><div class="small">KDP HERO / AI Outline Creator</div><h1>AI Outline Creator</h1><p class="small">Utwórz kompletny plan książki i przekaż go jednym kliknięciem do Auto Writera.</p><section class="card"><h3>Ustaw książkę</h3><div class="grid"><input id="title" class="field" placeholder="Tytuł książki"><input id="topic" class="field" placeholder="Temat / nisza"><select id="count" class="field"><option value="8">8 rozdziałów</option><option value="10" selected>10 rozdziałów</option><option value="12">12 rozdziałów</option></select><select id="type" class="field"><option>Poradnik praktyczny</option><option>E-book edukacyjny</option><option>Książka ekspercka</option><option>Workbook</option></select><select id="audience" class="field"><option>Początkujący</option><option>Średniozaawansowani</option><option>Zaawansowani</option></select><select id="style" class="field"><option>Praktyczny i prosty</option><option>Profesjonalny</option><option>Lekki i przystępny</option><option>Ekspercki</option></select></div><textarea id="notes" class="field" rows="3" style="margin-top:10px" placeholder="Dodatkowe wymagania do struktury książki..."></textarea><button id="generate" class="btn" style="margin-top:12px">✦ UTWÓRZ PLAN KSIĄŻKI</button></section><section class="card"><h3>Plan rozdziałów</h3><div id="outline" class="outline"><p class="small">Wpisz temat i utwórz plan.</p></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button id="send" class="btn">Przekaż do AI Pisanie →</button><button id="regen" class="btn" style="background:#ede9fe;color:#5634d6">↻ Utwórz inny plan</button></div><p id="status" class="ok"></p></section><script>const $=s=>document.querySelector(s);let plan=[];const base=['Wprowadzenie: dlaczego ten temat ma znaczenie','Fundamenty i najważniejsze pojęcia','Od czego zacząć — przygotowanie','Metoda krok po kroku','Pierwsze praktyczne zastosowanie','Przykłady i scenariusze z życia','Najczęstsze błędy i pułapki','Narzędzia, checklisty i dobre praktyki','Plan działania i wdrożenie','Jak mierzyć rezultaty i poprawiać efekty','Techniki zaawansowane','Podsumowanie i dalsze kroki'];const alt=['Problem, który rozwiązuje ta książka','Co trzeba wiedzieć przed startem','Najważniejsze zasady sukcesu','Budowanie własnego systemu','Praktyka: pierwsze rezultaty','Studia przypadków i przykłady','Co robić, gdy coś nie działa','Optymalizacja procesu','Plan 7/30 dni','Utrwalanie rezultatów','Poziom zaawansowany','Plan dalszego rozwoju'];function make(useAlt=false){let topic=$('#topic').value.trim()||$('#title').value.trim();if(!topic){$('#status').textContent='Wpisz temat lub tytuł książki.';return}let n=+$(`#count`).value,list=useAlt?alt:base;plan=Array.from({length:n},(_,i)=>({title:`Rozdział ${i+1} — ${list[i]}`,text:''}));$('#outline').innerHTML=plan.map((x,i)=>`<div class="row"><span class="num">${i+1}</span><input class="field chapterName" data-i="${i}" value="${x.title.replace(/^Rozdział \d+ — /,'')}"><span class="small">edytowalny</span></div>`).join('');$('#status').textContent='✓ Plan utworzony. Możesz zmienić każdy tytuł rozdziału.'}$('#generate').onclick=()=>make(false);$('#regen').onclick=()=>make(true);$('#outline').oninput=e=>{if(e.target.matches('.chapterName')){let i=+e.target.dataset.i;plan[i].title=`Rozdział ${i+1} — ${e.target.value}`}};$('#send').onclick=()=>{if(!plan.length){make(false);if(!plan.length)return}let old={};try{old=JSON.parse(localStorage.getItem('kdpWriter')||'{}')||{}}catch(e){}let data={...old,title:$('#title').value||old.title||'',topic:$('#topic').value||old.topic||'',audience:$('#audience').value,style:$('#style').value,goal:$('#type').value,instructions:$('#notes').value||old.instructions||'',author:old.author||'Karolcia',language:old.language||'Polski',chapters:plan};localStorage.setItem('kdpWriter',JSON.stringify(data));$('#status').textContent='✓ Plan zapisany w AI Pisanie. Otwieram Auto Writer…';setTimeout(()=>location.href='writer.html',350)};</script></main></div></body></html>
