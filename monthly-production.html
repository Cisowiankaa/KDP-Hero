<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Plan miesięczny</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:18px;margin:16px 0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 15px;font-weight:800;cursor:pointer}.field{padding:10px;border:1px solid #d9dee7;border-radius:9px;background:#fff}.weeks{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.week{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:14px}.item{background:#f7f5ff;border-left:3px solid #6842ed;border-radius:8px;padding:10px;margin-top:9px;font-size:12px}.item b{display:block;margin-bottom:5px}.date{color:#08794e;font-weight:800}.muted{color:#747c8e}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f8fafc;border-radius:10px;padding:13px}.stat b{display:block;font-size:23px;margin-top:4px}@media(max-width:1000px){.weeks{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.app{grid-template-columns:1fr}.main{padding:15px}.weeks,.stats{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a href="work-scheduler.html">📅 Planer pracy</a><a href="weekly-production.html">▦ Plan tygodniowy</a><a class="on" href="monthly-production.html">▦ Plan miesięczny</a></aside><main class="main"><div class="top"><div><h1>▦ Miesięczny plan produkcji</h1><p class="muted">KDP HERO rozdziela aktywne książki na tygodnie i wyznacza planowane terminy publikacji.</p></div><button id="generate" class="btn">⚡ Ułóż miesiąc automatycznie</button></div><section class="card top"><label>Miesiąc <input id="month" type="month" class="field"></label><label>Maks. książek <select id="limit" class="field"><option>4</option><option>8</option><option>12</option></select></label></section><section class="card"><div class="stats"><div class="stat">Zaplanowane książki<b id="books">0</b></div><div class="stat">Planowane publikacje<b id="launches">0</b></div><div class="stat">Najbliższa publikacja<b id="next">—</b></div></div></section><section id="weeks" class="weeks"></section><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script>const KEY='kdpMonthlyProduction',$=s=>document.querySelector(s);function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function generate(){let [y,m]=$('#month').value.split('-').map(Number),start=new Date(y,m-1,1,12),limit=+$('#limit').value,list=KDPProjectStore.list().filter(b=>KDPBookStatus.status(b).key!=='published');list=KDPBookPriority.sort(list,'priority').slice(0,limit);let items=list.map((b,i)=>{let week=i%4,slot=Math.floor(i/4),work=new Date(start);work.setDate(1+week*7+slot);let launch=new Date(work);launch.setDate(work.getDate()+6);return{id:b.id,title:b.title||'Bez tytułu',week:week+1,start:localDate(work),launch:localDate(launch),status:KDPBookStatus.status(b).label,priority:KDPBookPriority.rank(b).label}});save({month:$('#month').value,items,updatedAt:new Date().toISOString()});render()}function render(){let x=load(),items=Array.isArray(x.items)?x.items:[];$('#books').textContent=items.length;$('#launches').textContent=items.length;let upcoming=items.map(i=>i.launch).filter(d=>d>=localDate(new Date())).sort();$('#next').textContent=upcoming[0]?new Date(upcoming[0]+'T12:00').toLocaleDateString('pl-PL'):'—';$('#weeks').innerHTML=Array.from({length:4},(_,i)=>`<div class="week"><h3>Tydzień ${i+1}</h3><div class="muted">Produkcja i przygotowanie publikacji</div>${items.filter(x=>x.week===i+1).map(t=>`<div class="item"><b>${t.title}</b><div>${t.status} · Priorytet: ${t.priority}</div><div style="margin-top:6px">Start: ${new Date(t.start+'T12:00').toLocaleDateString('pl-PL')}</div><div class="date">Publikacja: ${new Date(t.launch+'T12:00').toLocaleDateString('pl-PL')}</div></div>`).join('')||'<p class="muted">Wolny tydzień</p>'}</div>`).join('')}let n=new Date();$('#month').value=String(n.getFullYear())+'-'+String(n.getMonth()+1).padStart(2,'0');$('#generate').onclick=generate;render();</script></main></div></body></html>
