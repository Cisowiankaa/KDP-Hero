<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Studio pisania</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.back{display:block;color:#ccd5e3;text-decoration:none;margin:25px 0}.side h4{color:#8995a8;font-size:11px}.chapter{width:100%;border:0;background:transparent;color:#dce3ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.chapter.on,.chapter:hover{background:#5b36e8}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e1e5ec;border-radius:13px;padding:18px;margin-top:18px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.ghost{background:#ede9fe;color:#5431d6}.editor{min-height:420px;resize:vertical;line-height:1.65}.stats{display:flex;gap:18px;color:#6c7484;font-size:13px}.outline{display:grid;grid-template-columns:1fr 1fr;gap:12px}.outline div{border:1px solid #e1e5ec;border-radius:10px;padding:13px}.notice{color:#16885d;font-size:13px}@media(max-width:800px){.app{grid-template-columns:1fr}.row,.outline{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a class="back" href="index.html">← Dashboard</a><h4>ROZDZIAŁY</h4><div id="chapters"></div><button id="addChapter" class="chapter">＋ Dodaj rozdział</button></aside><main class="main"><div class="top"><div><h1 style="margin:0">AI Pisanie</h1><p style="color:#737b8d">Studio tworzenia e-booka i książki KDP</p></div><div><button id="save" class="btn">Zapisz książkę</button></div></div><div class="card"><div class="row"><input id="bookTitle" class="field" placeholder="Tytuł książki"><input id="author" class="field" placeholder="Autor"><select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select></div></div><div class="card"><h3>Generator struktury książki</h3><div class="row"><input id="topic" class="field" placeholder="Temat, np. KSeF bez stresu"><select id="chapterCount" class="field"><option>8 rozdziałów</option><option selected>10 rozdziałów</option><option>12 rozdziałów</option></select><button id="generate" class="btn ghost">Utwórz spis treści</button></div><div id="outline" class="outline" style="margin-top:14px"></div></div><div class="card"><div class="top"><div><input id="chapterTitle" class="field" style="font-weight:700;font-size:18px" value="Rozdział 1"></div><div class="stats"><span id="words">0 słów</span><span id="chars">0 znaków</span></div></div><textarea id="editor" class="field editor" placeholder="Zacznij pisać treść rozdziału..."></textarea><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button id="intro" class="btn ghost">Wstaw propozycję wstępu</button><button id="expand" class="btn ghost">Rozwiń akapit</button><button id="clear" class="btn ghost">Wyczyść</button></div></div><p id="notice" class="notice"></p></main></div><script>let data=JSON.parse(localStorage.getItem('kdpWriter')||'null')||{title:'',author:'Karolcia',language:'Polski',chapters:[{title:'Rozdział 1',text:''}]};let active=0;const $=s=>document.querySelector(s);function persist(){data.title=$('#bookTitle').value;data.author=$('#author').value;data.language=$('#language').value;data.chapters[active]={title:$('#chapterTitle').value,text:$('#editor').value};localStorage.setItem('kdpWriter',JSON.stringify(data))}function render(){persist();$('#chapters').innerHTML=data.chapters.map((x,i)=>`<button class="chapter ${i===active?'on':''}" data-i="${i}">${i+1}. ${x.title.replace(/^Rozdział \d+\s*[-–:]?\s*/,'')||'Rozdział'}</button>`).join('')}function load(i){persist();active=i;$('#chapterTitle').value=data.chapters[i].title;$('#editor').value=data.chapters[i].text;render();count()}function count(){let t=$('#editor').value.trim();$('#words').textContent=(t?t.split(/\s+/).length:0)+' słów';$('#chars').textContent=t.length+' znaków'}$('#bookTitle').value=data.title;$('#author').value=data.author;$('#language').value=data.language;$('#chapterTitle').value=data.chapters[0].title;$('#editor').value=data.chapters[0].text;render();count();$('#chapters').onclick=e=>{let b=e.target.closest('[data-i]');if(b)load(+b.dataset.i)};$('#addChapter').onclick=()=>{persist();data.chapters.push({title:'Rozdział '+(data.chapters.length+1),text:''});load(data.chapters.length-1)};$('#editor').oninput=()=>{count();persist()};$('#chapterTitle').oninput=render;$('#save').onclick=()=>{persist();$('#notice').textContent='✓ Książka została zapisana lokalnie w KDP HERO.'};$('#generate').onclick=()=>{let topic=$('#topic').value.trim()||'Twoja książka';let n=parseInt($('#chapterCount').value)||10;data.chapters=Array.from({length:n},(_,i)=>({title:`Rozdział ${i+1} — ${['Wprowadzenie','Podstawy','Najważniejsze pojęcia','Plan działania','Praktyczne przykłady','Najczęstsze błędy','Narzędzia i wskazówki','Strategia krok po kroku','Optymalizacja','Podsumowanie'][i]||'Temat '+(i+1)}`,text:''}));active=0;$('#outline').innerHTML=data.chapters.map((x,i)=>`<div><b>${i+1}.</b> ${x.title.split('—')[1]||x.title}<br><small>Temat: ${topic}</small></div>`).join('');load(0);$('#notice').textContent='✓ Utworzono strukturę książki.'};$('#intro').onclick=()=>{$('#editor').value+=($('#editor').value?'\n\n':'')+'W tym rozdziale poznasz najważniejsze informacje dotyczące omawianego zagadnienia. Przejdziemy od podstaw do praktycznych wskazówek, które możesz od razu wykorzystać.';count();persist()};$('#expand').onclick=()=>{$('#editor').value+=($('#editor').value?'\n\n':'')+'Warto przyjrzeć się temu zagadnieniu dokładniej. Kluczowe jest zrozumienie kolejnych kroków, zastosowanie ich w praktyce oraz sprawdzenie rezultatów przed przejściem do następnego etapu.';count();persist()};$('#clear').onclick=()=>{if(confirm('Wyczyścić treść tego rozdziału?')){$('#editor').value='';count();persist()}};</script></body></html>
