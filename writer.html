<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Auto Writer 2.3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.back{display:block;color:#ccd5e3;text-decoration:none;margin:24px 0}.chapter{width:100%;border:0;background:transparent;color:#dce3ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.chapter.on,.chapter:hover{background:#5b36e8}.main{padding:26px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.auto{background:linear-gradient(90deg,#5b36e8,#8b5cf6);font-size:17px}.ghost{background:#ede9fe;color:#5431d6}.editor{min-height:430px;line-height:1.7;resize:vertical}.progress{height:10px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#6842ed;width:0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.summary div{background:#f8f9fc;border-radius:10px;padding:12px}.summary b{display:block;font-size:20px}.small{font-size:13px;color:#737b8d}.ok{color:#08794e;font-weight:800}.dna{background:#ecfdf5;color:#08794e;padding:11px;border-radius:10px;margin-top:10px;font-size:13px}.next{display:none;background:#ecfdf5;border-radius:10px;padding:14px;margin-top:14px}@media(max-width:800px){.app{grid-template-columns:1fr}.grid,.summary{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a class="back" href="index.html">← Dashboard</a><h4>ROZDZIAŁY</h4><div id="chapters"></div></aside><main class="main"><h1>AI Pisanie — Auto Writer 2.3</h1><p class="small">Automatyczne pisanie wszystkich rozdziałów zgodnie z profilem Author DNA.</p><div id="dnaInfo" class="dna"></div><section class="card"><div class="grid"><input id="bookTitle" class="field" placeholder="Tytuł książki"><input id="topic" class="field" placeholder="Temat książki"><input id="author" class="field" placeholder="Autor"><select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select><input id="audience" class="field" placeholder="Odbiorca"><input id="style" class="field" placeholder="Styl"></div><textarea id="instructions" class="field" rows="3" style="margin-top:10px" placeholder="Dodatkowe instrukcje"></textarea></section><section class="card"><button id="writeAll" class="btn auto">✦ NAPISZ CAŁĄ KSIĄŻKĘ AUTOMATYCZNIE</button> <button id="continue" class="btn ghost">▶ Kontynuuj niedokończone</button><div class="progress"><i id="progress"></i></div><p id="status" class="small">Gotowe do rozpoczęcia.</p><div class="summary"><div>Rozdziały<b id="total">0</b></div><div>Gotowe<b id="done">0</b></div><div>Słowa<b id="wordsTotal">0</b></div><div>Postęp<b id="pct">0%</b></div></div><div id="next" class="next"><b class="ok">✓ Pisanie zakończone.</b><p>Projekt automatycznie przeszedł do etapu Okładka.</p><a class="btn" style="display:inline-block;text-decoration:none" href="cover.html">Przejdź do Okładka AI →</a></div></section><section class="card"><input id="chapterTitle" class="field" style="font-size:18px;font-weight:800"><textarea id="editor" class="field editor" style="margin-top:10px"></textarea><p><button id="rewrite" class="btn ghost">↻ Napisz ponownie</button> <button id="expand" class="btn ghost">＋ Rozwiń</button> <button id="save" class="btn">Zapisz</button></p><p id="notice" class="ok"></p></section><script>const $=s=>document.querySelector(s);let raw={},dna={};try{raw=JSON.parse(localStorage.getItem('kdpWriter')||'{}')||{}}catch(e){}try{dna=raw.authorDNA||JSON.parse(localStorage.getItem('kdpAuthorDNA')||'{}')||{}}catch(e){}let data={title:String(raw.title||''),topic:String(raw.topic||raw.title||''),author:String(raw.author||dna.name||'Karolcia'),language:String(raw.language||'Polski'),audience:String(raw.audience||dna.audience||'Początkujący'),style:String(raw.style||(dna.tone||[]).join(', ')||'Praktyczny i prosty'),instructions:String(raw.instructions||''),chapters:Array.isArray(raw.chapters)?raw.chapters:[]};data.chapters=data.chapters.map((x,i)=>({title:String(x?.title||`Rozdział ${i+1}`),text:String(x?.text||'')}));if(!data.chapters.length)data.chapters=Array.from({length:10},(_,i)=>({title:`Rozdział ${i+1} — ${['Wprowadzenie','Fundamenty','Przygotowanie','Metoda krok po kroku','Praktyczne zastosowanie','Przykłady','Błędy i pułapki','Narzędzia i checklisty','Plan działania','Podsumowanie'][i]}`,text:''}));let active=0;$('#bookTitle').value=data.title;$('#topic').value=data.topic;$('#author').value=data.author;$('#language').value=data.language;$('#audience').value=data.audience;$('#style').value=data.style;$('#instructions').value=data.instructions;$('#dnaInfo').innerHTML=Object.keys(dna).length?`✓ Author DNA aktywne: <b>${dna.name||data.author}</b> · ton: ${(dna.tone||[]).join(', ')||data.style} · zasady: ${(dna.writing||[]).join(', ')||'czytelna struktura'}`:'Author DNA nieaktywne — używam ustawień tej książki.';function persist(){data.title=String($('#bookTitle').value||'');data.topic=String($('#topic').value||data.title||'');data.author=String($('#author').value||'Karolcia');data.language=$('#language').value;data.audience=String($('#audience').value||'');data.style=String($('#style').value||'');data.instructions=String($('#instructions').value||'');if(data.chapters[active]){data.chapters[active].title=String($('#chapterTitle').value||data.chapters[active].title);data.chapters[active].text=String($('#editor').value||'')}localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));summary()}function render(){$('#chapters').innerHTML=data.chapters.map((x,i)=>`<button class="chapter ${i===active?'on':''}" data-i="${i}">${i+1}. ${(x.title.split('—')[1]||x.title).trim()} ${String(x.text||'').trim()?'✓':''}</button>`).join('')}function display(i){if(i<0||i>=data.chapters.length)return;active=i;$('#chapterTitle').value=data.chapters[i].title;$('#editor').value=data.chapters[i].text;render();summary()}function load(i){persist();display(i)}function summary(){let total=data.chapters.length,done=data.chapters.filter(x=>String(x.text||'').trim()).length,words=data.chapters.reduce((n,x)=>n+(String(x.text||'').trim()?String(x.text).trim().split(/\s+/).length:0),0),pct=total?Math.round(done/total*100):0;$('#total').textContent=total;$('#done').textContent=done;$('#wordsTotal').textContent=words.toLocaleString('pl-PL');$('#pct').textContent=pct+'%';$('#progress').style.width=pct+'%';$('#next').style.display=pct===100?'block':'none'}function textFor(i,extra=false){let topic=data.topic||data.title||'temat książki',name=String(data.chapters[i].title).replace(/^Rozdział \d+ — /,''),tone=(dna.tone||[]).join(', ')||data.style,audience=dna.audience||data.audience,features=dna.writing||[],avoid=dna.avoid||'';let p=[`${name} to część książki o temacie „${topic}”, przygotowana dla grupy: ${audience}. Tekst prowadzi czytelnika od zrozumienia zagadnienia do konkretnego działania.`,`${dna.description?dna.description+' ':''}Ton rozdziału: ${tone}. Najważniejsze informacje są przedstawiane jasno, bez zbędnego komplikowania tematu.`,`Zacznij od konkretnego celu. Podziel zagadnienie na małe etapy i po każdym z nich sprawdź rezultat. Dzięki temu czytelnik może od razu zastosować wiedzę w praktyce.`,features.includes('Przykłady')?`Przykład praktyczny: wybierz jeden realny problem związany z „${name}”, określ oczekiwany rezultat, wykonaj pierwszą wersję rozwiązania i popraw ją na podstawie efektu.`:`W praktyce warto przejść od teorii bezpośrednio do wykonania pierwszego prostego kroku.`,features.includes('Checklisty')?'Checklista: określ cel; przygotuj potrzebne materiały; wykonaj działanie; sprawdź efekt; popraw wynik.':'Najważniejsza zasada: przygotuj, wykonaj, sprawdź i popraw.',features.includes('Ćwiczenia')?`Ćwiczenie: zapisz trzy działania związane z zagadnieniem „${name}” i wykonaj pierwsze z nich jeszcze dziś.`:`Zastosuj jedną wskazówkę z tego rozdziału od razu, zanim przejdziesz dalej.`,features.includes('Podsumowania')?`Podsumowanie: najważniejsze jest konsekwentne przełożenie wiedzy na działanie. ${avoid?'W tekście unikamy: '+avoid+'.':''}`:`${avoid?'Zgodnie z Author DNA unikamy: '+avoid+'.':''}`];return (extra?p.slice(3):p).join('\n\n')}function writeOne(i,extra=false){data.chapters[i].text=extra?(String(data.chapters[i].text||'')+'\n\n'+textFor(i,true)):textFor(i,false)}function advance(){let ps=[];try{ps=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}let ix=ps.findIndex(x=>String(x.n||'')===data.title);if(ix>=0){ps[ix].s='Okładka';ps[ix].p=60;localStorage.setItem('kdpProjectsV2',JSON.stringify(ps));localStorage.setItem('kdpNewProject',JSON.stringify(ps[ix]))}let cover={};try{cover=JSON.parse(localStorage.getItem('kdpCover')||'{}')||{}}catch(e){}cover.title=data.title;cover.author=data.author;cover.niche=data.topic;localStorage.setItem('kdpCover',JSON.stringify(cover))}async function run(onlyEmpty=false){persist();if(!data.topic.trim()&&!data.title.trim()){$('#status').textContent='Wpisz temat lub tytuł książki.';return}$('#writeAll').disabled=true;$('#continue').disabled=true;let targets=data.chapters.map((x,i)=>i).filter(i=>!onlyEmpty||!String(data.chapters[i].text||'').trim());for(let i of targets){$('#status').textContent=`Piszę rozdział ${i+1} z ${data.chapters.length} zgodnie z Author DNA…`;writeOne(i);localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));display(i);await new Promise(r=>setTimeout(r,180))}display(0);advance();summary();$('#writeAll').disabled=false;$('#continue').disabled=false;$('#status').textContent='✓ Cała książka napisana zgodnie z Author DNA.';$('#notice').textContent='✓ Rozdziały zapisane.'}$('#chapters').onclick=e=>{let b=e.target.closest('[data-i]');if(b)load(+b.dataset.i)};$('#writeAll').onclick=()=>run(false);$('#continue').onclick=()=>run(true);$('#rewrite').onclick=()=>{persist();writeOne(active);localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));display(active)};$('#expand').onclick=()=>{persist();writeOne(active,true);localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));display(active)};$('#save').onclick=()=>{persist();$('#notice').textContent='✓ Zapisano.'};document.querySelectorAll('#bookTitle,#topic,#author,#language,#audience,#style,#instructions').forEach(x=>x.addEventListener('change',persist));display(0);</script></main></div></body></html>
