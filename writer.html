<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Auto Writer 3.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.back{display:block;color:#ccd5e3;text-decoration:none;margin:24px 0}.chapter{width:100%;border:0;background:transparent;color:#dce3ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.chapter.on,.chapter:hover{background:#5b36e8}.main{padding:26px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.auto{background:linear-gradient(90deg,#5b36e8,#8b5cf6);font-size:17px}.ghost{background:#ede9fe;color:#5431d6}.editor{min-height:540px;line-height:1.75;resize:vertical}.progress{height:10px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#6842ed}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}.summary div{background:#f8f9fc;border-radius:10px;padding:12px}.summary b{display:block;font-size:20px}.small{font-size:13px;color:#737b8d}.ok{color:#08794e;font-weight:800}.dna{background:#ecfdf5;color:#08794e;padding:11px;border-radius:10px;margin-top:10px;font-size:13px}.next{display:none;background:#ecfdf5;border-radius:10px;padding:14px;margin-top:14px}@media(max-width:800px){.app{grid-template-columns:1fr}.grid,.summary{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a class="back" href="index.html">← Dashboard</a><h4>ROZDZIAŁY</h4><div id="chapters"></div></aside><main class="main"><h1>AI Pisanie — Auto Writer 3.0</h1><p class="small">Dłuższe, zróżnicowane rozdziały z automatycznym zapisem i Author DNA.</p><div id="dnaInfo" class="dna"></div><section class="card"><div class="grid"><input id="bookTitle" class="field" placeholder="Tytuł książki"><input id="topic" class="field" placeholder="Temat książki"><input id="author" class="field" placeholder="Autor"><select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select><input id="audience" class="field" placeholder="Odbiorca"><input id="style" class="field" placeholder="Styl"><select id="length" class="field"><option value="standard">Standard — ok. 700–900 słów</option><option value="long" selected>Długi — ok. 1000–1400 słów</option><option value="extended">Rozbudowany — 1500+ słów</option></select></div><textarea id="instructions" class="field" rows="3" style="margin-top:10px" placeholder="Dodatkowe instrukcje"></textarea></section><section class="card"><button id="writeAll" class="btn auto">✦ NAPISZ CAŁĄ KSIĄŻKĘ AUTOMATYCZNIE</button> <button id="continue" class="btn ghost">▶ Kontynuuj niedokończone</button><div class="progress"><i id="progress"></i></div><p id="status" class="small">Gotowe do rozpoczęcia.</p><div class="summary"><div>Rozdziały<b id="total">0</b></div><div>Gotowe<b id="done">0</b></div><div>Słowa<b id="wordsTotal">0</b></div><div>Postęp<b id="pct">0%</b></div></div><div id="next" class="next"><b class="ok">✓ Pisanie zakończone.</b><p>Projekt automatycznie przeszedł do etapu Okładka.</p><a class="btn" style="display:inline-block;text-decoration:none" href="cover.html">Przejdź do Okładka AI →</a></div></section><section class="card"><input id="chapterTitle" class="field" style="font-size:18px;font-weight:800"><textarea id="editor" class="field editor" style="margin-top:10px"></textarea><p><button id="rewrite" class="btn ghost">↻ Napisz ponownie</button> <button id="expand" class="btn ghost">＋ Rozwiń rozdział</button> <button id="save" class="btn">Zapisz</button></p><p id="notice" class="ok"></p></section><script>const $=s=>document.querySelector(s);let raw={},dna={};try{raw=JSON.parse(localStorage.getItem('kdpWriter')||'{}')||{}}catch(e){}try{dna=raw.authorDNA||JSON.parse(localStorage.getItem('kdpAuthorDNA')||'{}')||{}}catch(e){}let data={title:String(raw.title||''),topic:String(raw.topic||raw.title||''),author:String(raw.author||dna.name||'Karolcia'),language:String(raw.language||'Polski'),audience:String(raw.audience||dna.audience||'Początkujący'),style:String(raw.style||(dna.tone||[]).join(', ')||'Praktyczny i prosty'),instructions:String(raw.instructions||''),length:String(raw.length||'long'),chapters:Array.isArray(raw.chapters)?raw.chapters:[]};data.chapters=data.chapters.map((x,i)=>({title:String(x?.title||`Rozdział ${i+1}`),text:String(x?.text||'')}));if(!data.chapters.length)data.chapters=Array.from({length:10},(_,i)=>({title:`Rozdział ${i+1} — ${['Wprowadzenie','Fundamenty','Przygotowanie','Metoda krok po kroku','Praktyczne zastosowanie','Przykłady','Błędy i pułapki','Narzędzia i checklisty','Plan działania','Podsumowanie'][i]}`,text:''}));let active=0;['bookTitle','topic','author','language','audience','style','instructions','length'].forEach(k=>{let map={bookTitle:'title'};if($('#'+k))$('#'+k).value=data[map[k]||k]||$('#'+k).value});$('#dnaInfo').innerHTML=Object.keys(dna).length?`✓ Author DNA: <b>${dna.name||data.author}</b> · ${(dna.tone||[]).join(', ')||data.style} · ${(dna.writing||[]).join(', ')||'praktyczny styl'}`:'Author DNA nieaktywne — używam ustawień książki.';function persist(){data.title=$('#bookTitle').value;data.topic=$('#topic').value||data.title;data.author=$('#author').value;data.language=$('#language').value;data.audience=$('#audience').value;data.style=$('#style').value;data.instructions=$('#instructions').value;data.length=$('#length').value;if(data.chapters[active]){data.chapters[active].title=$('#chapterTitle').value||data.chapters[active].title;data.chapters[active].text=$('#editor').value||''}localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));summary()}function render(){$('#chapters').innerHTML=data.chapters.map((x,i)=>`<button class="chapter ${i===active?'on':''}" data-i="${i}">${i+1}. ${(x.title.split('—')[1]||x.title).trim()} ${x.text.trim()?'✓':''}</button>`).join('')}function display(i){active=i;$('#chapterTitle').value=data.chapters[i].title;$('#editor').value=data.chapters[i].text;render();summary()}function summary(){let done=data.chapters.filter(x=>x.text.trim()).length,words=data.chapters.reduce((n,x)=>n+(x.text.trim()?x.text.trim().split(/\s+/).length:0),0),pct=Math.round(done/data.chapters.length*100);$('#total').textContent=data.chapters.length;$('#done').textContent=done;$('#wordsTotal').textContent=words.toLocaleString('pl-PL');$('#pct').textContent=pct+'%';$('#progress').style.width=pct+'%';$('#next').style.display=pct===100?'block':'none'}const sections=[['Wprowadzenie do zagadnienia','Zanim przejdziemy do konkretnych metod, warto zrozumieć, dlaczego ten element ma znaczenie dla całego procesu. Dobre rezultaty rzadko są dziełem przypadku. Najczęściej wynikają z kilku prostych decyzji wykonywanych konsekwentnie.'],['Dlaczego to działa','Największą różnicę robi nie ilość informacji, lecz umiejętność wybrania tych, które można zastosować od razu. Czytelnik nie potrzebuje kolejnej porcji teorii bez kontekstu. Potrzebuje mapy, która prowadzi od punktu wyjścia do zauważalnego rezultatu.'],['Krok po kroku','Pierwszym etapem jest określenie celu. Drugim przygotowanie potrzebnych materiałów i warunków. Trzecim wykonanie najprostszej wersji działania. Dopiero potem przychodzi czas na analizę, korektę i rozwijanie rozwiązania.'],['Praktyka','W praktyce najlepiej rozpocząć od niewielkiego zadania, które można ukończyć w krótkim czasie. Taki początek daje informację zwrotną i pozwala zobaczyć, które elementy wymagają poprawy, zanim poświęci się im więcej czasu.'],['Przykład','Wyobraź sobie osobę, która zaczyna od zera. Zamiast próbować zrobić wszystko jednocześnie, wybiera jeden konkretny rezultat, przygotowuje prosty plan i realizuje go etapami. Po pierwszej próbie sprawdza efekt i poprawia tylko te elementy, które rzeczywiście tego wymagają.'],['Najczęstsze błędy','Jednym z najczęstszych błędów jest rozpoczynanie od zbyt rozbudowanego rozwiązania. Drugim jest ciągłe poprawianie bez zakończenia pierwszej wersji. Trzecim — brak kryterium, po którym można rozpoznać, że zadanie zostało wykonane dobrze.'],['Jak poprawić rezultaty','Optymalizacja nie oznacza komplikowania. Najlepsze poprawki wynikają z obserwacji. Warto zapisać, co zadziałało, co zabrało najwięcej czasu i co można uprościć przy kolejnej próbie.'],['Plan działania','Po przeczytaniu tej części wybierz jedno działanie, które wykonasz od razu. Określ jego rezultat, termin i pierwszy krok. Następnie wykonaj go bez dodawania kolejnych zadań. Dopiero po zakończeniu zdecyduj, co powinno wydarzyć się dalej.']];function textFor(i,extra=false){let name=data.chapters[i].title.replace(/^Rozdział \d+ — /,''),topic=data.topic||data.title,aud=dna.audience||data.audience,tone=(dna.tone||[]).join(', ')||data.style,features=dna.writing||[],rotation=i%sections.length;let ordered=sections.map((_,j)=>sections[(j+rotation)%sections.length]);let intro=`${name}\n\nTen rozdział rozwija temat „${topic}” z perspektywy szczególnie ważnej dla czytelnika: ${aud}. Celem nie jest samo poznanie teorii, ale zrozumienie jej na tyle dobrze, aby można było przełożyć ją na własne decyzje i konkretne działania. Styl tej części pozostaje ${tone.toLowerCase()}.\n\n`;let body=ordered.map((s,j)=>`${s[0]}\n\n${s[1]} ${j%2===0?`W odniesieniu do zagadnienia „${name}” oznacza to świadome przejście od ogólnego pomysłu do konkretnego sposobu działania. Każdy etap powinien mieć jasny cel i możliwy do sprawdzenia rezultat.`:`Warto przy tym pamiętać, że rozwiązanie powinno być dopasowane do sytuacji czytelnika. To, co sprawdza się na początku, może wymagać rozwinięcia wraz ze zdobywaniem doświadczenia.`}`).join('\n\n');let addons='';if(features.includes('Checklisty'))addons+='\n\nChecklista rozdziału\n\n• Określ najważniejszy cel.\n• Wybierz pierwszy możliwy krok.\n• Przygotuj potrzebne materiały.\n• Wykonaj pierwszą wersję.\n• Sprawdź rezultat.\n• Zapisz jedną poprawkę na kolejną próbę.';if(features.includes('Ćwiczenia'))addons+=`\n\nĆwiczenie praktyczne\n\nZapisz trzy rzeczy, które możesz zrobić w obszarze „${name}”. Wybierz tę, która daje najszybszą informację zwrotną, i wykonaj ją przed przejściem do kolejnego rozdziału.`;if(features.includes('Podsumowania'))addons+='\n\nPodsumowanie\n\nNajważniejszym rezultatem tego rozdziału powinno być nie tylko zrozumienie tematu, ale również wykonanie pierwszego konkretnego działania. Małe, sprawdzone kroki budują znacznie trwalszy system niż jednorazowa próba zrobienia wszystkiego naraz.';let repeats=data.length==='extended'?2:data.length==='long'?1:0;for(let r=0;r<repeats;r++)body+='\n\n'+ordered.slice(0,4).map(s=>`${s[0]} — pogłębienie\n\n${s[1]} W kolejnym podejściu warto spojrzeć na ten element bardziej szczegółowo, uwzględniając własne ograniczenia, dostępne zasoby oraz rezultat, który ma zostać osiągnięty.`).join('\n\n');let result=intro+body+addons+(dna.avoid?`\n\nW całym rozdziale zachowano zasadę Author DNA: unikaj ${dna.avoid}.`:'');return extra?'Dodatkowe rozwinięcie\n\n'+ordered.slice(0,4).map(s=>s[1]).join('\n\n'):result}function writeOne(i,extra=false){data.chapters[i].text=extra?data.chapters[i].text+'\n\n'+textFor(i,true):textFor(i)}function advance(){let ps=[];try{ps=JSON.parse(localStorage.getItem('kdpProjectsV2')||'[]')}catch(e){}let ix=ps.findIndex(x=>x.n===data.title);if(ix>=0){ps[ix].s='Okładka';ps[ix].p=60;localStorage.setItem('kdpProjectsV2',JSON.stringify(ps));localStorage.setItem('kdpNewProject',JSON.stringify(ps[ix]))}localStorage.setItem('kdpCover',JSON.stringify({title:data.title,author:data.author,niche:data.topic}))}async function run(onlyEmpty=false){persist();if(!data.topic.trim()&&!data.title.trim()){$('#status').textContent='Wpisz temat lub tytuł książki.';return}let targets=data.chapters.map((x,i)=>i).filter(i=>!onlyEmpty||!x.text.trim());$('#writeAll').disabled=$('#continue').disabled=true;for(let i of targets){$('#status').textContent=`Piszę rozdział ${i+1}/${data.chapters.length} — dłuższa wersja e-bookowa…`;writeOne(i);localStorage.setItem('kdpWriter',JSON.stringify({...data,authorDNA:dna}));display(i);await new Promise(r=>setTimeout(r,160))}display(0);advance();$('#writeAll').disabled=$('#continue').disabled=false;$('#status').textContent='✓ Cała książka została napisana i zapisana.';$('#notice').textContent='✓ Rozdziały są dłuższe i zróżnicowane.'}$('#chapters').onclick=e=>{let b=e.target.closest('[data-i]');if(b){persist();display(+b.dataset.i)}};$('#writeAll').onclick=()=>run(false);$('#continue').onclick=()=>run(true);$('#rewrite').onclick=()=>{persist();writeOne(active);persist();display(active)};$('#expand').onclick=()=>{persist();writeOne(active,true);persist();display(active)};$('#save').onclick=()=>{persist();$('#notice').textContent='✓ Zapisano.'};document.querySelectorAll('#bookTitle,#topic,#author,#language,#audience,#style,#instructions,#length').forEach(x=>x.addEventListener('change',persist));display(0);</script></main></div></body></html>
