<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Automatyczne pisanie</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.back{display:block;color:#ccd5e3;text-decoration:none;margin:24px 0}.chapter{width:100%;border:0;background:transparent;color:#dce3ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.chapter.on,.chapter:hover{background:#5b36e8}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.ghost{background:#ede9fe;color:#5431d6}.auto{background:linear-gradient(90deg,#5b36e8,#8b5cf6);font-size:16px}.editor{min-height:430px;resize:vertical;line-height:1.7}.stats{display:flex;gap:15px;color:#6c7484;font-size:13px}.progress{height:9px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#6842ed;width:0;transition:.25s}.notice{color:#16885d;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ede9fe;color:#5634d6;font-size:11px;font-weight:800}.help{font-size:13px;color:#737b8d}@media(max-width:800px){.app{grid-template-columns:1fr}.row{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a class="back" href="index.html">← Dashboard</a><div class="badge">AUTO WRITER</div><h4>ROZDZIAŁY</h4><div id="chapters"></div></aside><main class="main"><div class="top"><div><h1 style="margin:0">Automatyczne pisanie książki</h1><p class="help">Podajesz temat i strukturę. KDP HERO przygotowuje treść wszystkich rozdziałów.</p></div><button id="save" class="btn">Zapisz książkę</button></div><div class="card"><div class="row"><input id="bookTitle" class="field" placeholder="Tytuł książki"><input id="author" class="field" value="Karolcia"><select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select></div></div><div class="card"><h3>1. Ustaw książkę</h3><div class="row"><input id="topic" class="field" placeholder="Temat, np. KSeF bez stresu"><select id="chapterCount" class="field"><option>8 rozdziałów</option><option selected>10 rozdziałów</option><option>12 rozdziałów</option></select><select id="length" class="field"><option value="short">krótsze rozdziały</option><option value="medium" selected>standardowe rozdziały</option><option value="long">dłuższe rozdziały</option></select></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button id="outline" class="btn ghost">Utwórz plan</button><button id="writeAll" class="btn auto">✦ NAPISZ AUTOMATYCZNIE CAŁĄ KSIĄŻKĘ</button></div><div class="progress"><i id="progress"></i></div><p id="autoStatus" class="help">Najpierw wpisz temat książki.</p></div><div class="card"><div class="top"><input id="chapterTitle" class="field" style="max-width:600px;font-weight:800;font-size:18px"><div class="stats"><span id="words">0 słów</span><span id="chars">0 znaków</span></div></div><textarea id="editor" class="field editor"></textarea><div style="display:flex;gap:10px;margin-top:12px"><button id="rewrite" class="btn ghost">Napisz ten rozdział od nowa</button><button id="more" class="btn ghost">Dodaj więcej treści</button></div></div><p id="notice" class="notice"></p></main></div><script>const $=s=>document.querySelector(s);let data=JSON.parse(localStorage.getItem('kdpWriter')||'null')||{title:'',author:'Karolcia',language:'Polski',topic:'',chapters:[]};if(!data.chapters.length)data.chapters=[{title:'Rozdział 1 — Wprowadzenie',text:''}];let active=0;$('#bookTitle').value=data.title||'';$('#author').value=data.author||'Karolcia';$('#language').value=data.language||'Polski';$('#topic').value=data.topic||'';function persist(){data.title=$('#bookTitle').value;data.author=$('#author').value;data.language=$('#language').value;data.topic=$('#topic').value;if(data.chapters[active])data.chapters[active]={title:$('#chapterTitle').value,text:$('#editor').value};localStorage.setItem('kdpWriter',JSON.stringify(data))}function render(){let box=$('#chapters');box.innerHTML=data.chapters.map((x,i)=>`<button class="chapter ${i===active?'on':''}" data-i="${i}">${i+1}. ${x.title.split('—')[1]||x.title}</button>`).join('')}function load(i){if(data.chapters[active])persist();active=i;$('#chapterTitle').value=data.chapters[i].title;$('#editor').value=data.chapters[i].text;render();count()}function count(){let t=$('#editor').value.trim();$('#words').textContent=(t?t.split(/\s+/).length:0)+' słów';$('#chars').textContent=t.length+' znaków'}function makePlan(){let n=parseInt($('#chapterCount').value)||10;let names=['Wprowadzenie i cel książki','Podstawy tematu','Najważniejsze pojęcia','Przygotowanie krok po kroku','Praktyczne zastosowanie','Przykłady i scenariusze','Najczęstsze błędy','Narzędzia i dobre praktyki','Plan wdrożenia','Optymalizacja i rozwój','Zaawansowane wskazówki','Podsumowanie i dalsze kroki'];data.chapters=Array.from({length:n},(_,i)=>({title:`Rozdział ${i+1} — ${names[i]}`,text:''}));active=0;load(0);persist()}function paragraphs(topic,title,idx,len){let blocks=[`Rozdział ten koncentruje się na zagadnieniu „${title.replace(/^Rozdział \d+ — /,'')}” w kontekście tematu „${topic}”. Celem jest przeprowadzenie czytelnika od zrozumienia podstaw do konkretnych działań, które można zastosować w praktyce. Zamiast ograniczać się do teorii, warto od początku patrzeć na temat przez pryzmat rezultatu, jaki chcemy osiągnąć.`,`Pierwszym krokiem jest uporządkowanie informacji. W przypadku tematu „${topic}” szczególnie ważne jest rozdzielenie elementów niezbędnych od tych, które są jedynie dodatkiem. Dzięki temu łatwiej stworzyć prosty plan działania, ustalić kolejność czynności i uniknąć chaosu. Dobrze przygotowana struktura pozwala również szybciej zauważyć braki i poprawić je jeszcze przed przejściem do kolejnego etapu.`,`W praktyce najlepiej pracować etapami. Najpierw określ cel, następnie przygotuj potrzebne materiały, wykonaj pierwszą wersję i dopiero później ją udoskonalaj. Takie podejście ogranicza ryzyko utknięcia na szczegółach. Każdy etap powinien kończyć się krótką kontrolą: co zostało wykonane, czego jeszcze brakuje i jaki jest następny konkretny krok.`,`Przykład praktyczny pokazuje, dlaczego ta metoda działa. Wyobraź sobie osobę, która zaczyna pracę z tematem „${topic}” bez przygotowanego planu. Łatwo wtedy przeskakiwać między zadaniami i wielokrotnie poprawiać te same elementy. Po zastosowaniu uporządkowanego procesu praca staje się bardziej przewidywalna: wiadomo, od czego zacząć, co sprawdzić oraz kiedy można uznać dany etap za zakończony.`,`Warto również pamiętać o najczęstszych błędach. Należą do nich działanie bez jasno określonego celu, pomijanie kontroli jakości, próba wykonania wszystkiego jednocześnie oraz brak zapisywania postępów. Unikanie tych problemów nie wymaga skomplikowanych narzędzi. Najważniejsze są konsekwencja, prosty system pracy i regularna weryfikacja rezultatów.`,`Na zakończenie tego rozdziału zapisz trzy rzeczy: najważniejszą informację, jedno działanie do wykonania oraz element wymagający dalszego sprawdzenia. Dzięki temu wiedza nie pozostanie wyłącznie teorią. W następnym rozdziale przejdziemy do kolejnego elementu procesu i rozwiniemy go w bardziej praktyczny sposób.`];if(len==='long')blocks.push(`Dodatkowym sposobem na utrwalenie materiału jest stworzenie własnej checklisty dotyczącej „${topic}”. Powinna być krótka i możliwa do wykorzystania podczas rzeczywistej pracy. Z czasem można ją rozwijać na podstawie doświadczeń, dzięki czemu cały proces staje się coraz szybszy i bardziej dopasowany do potrzeb.`);if(len==='short')blocks=blocks.slice(0,4);return blocks.join('\n\n')}function writeOne(i){let topic=$('#topic').value.trim()||$('#bookTitle').value.trim()||'temat książki';let len=$('#length').value;data.chapters[i].text=paragraphs(topic,data.chapters[i].title,i,len)}async function writeAll(){persist();if(!$('#topic').value.trim()&&!$('#bookTitle').value.trim()){ $('#autoStatus').textContent='Wpisz temat lub tytuł książki.';return}if(data.chapters.length<2)makePlan();$('#writeAll').disabled=true;for(let i=0;i<data.chapters.length;i++){writeOne(i);let pct=Math.round((i+1)/data.chapters.length*100);$('#progress').style.width=pct+'%';$('#autoStatus').textContent=`Pisanie rozdziału ${i+1} z ${data.chapters.length} — ${pct}%`;localStorage.setItem('kdpWriter',JSON.stringify(data));await new Promise(r=>setTimeout(r,180))}load(0);$('#writeAll').disabled=false;$('#autoStatus').textContent='✓ Wszystkie rozdziały zostały napisane automatycznie.';$('#notice').textContent='Książka została zapisana. Możesz otworzyć każdy rozdział i go poprawić.'}$('#chapters').onclick=e=>{let b=e.target.closest('[data-i]');if(b)load(+b.dataset.i)};$('#outline').onclick=()=>{makePlan();$('#autoStatus').textContent='✓ Plan rozdziałów gotowy. Możesz uruchomić automatyczne pisanie.'};$('#writeAll').onclick=writeAll;$('#rewrite').onclick=()=>{persist();writeOne(active);load(active);$('#notice').textContent='✓ Rozdział napisany ponownie.'};$('#more').onclick=()=>{$('#editor').value+='\n\n'+paragraphs($('#topic').value||'temat książki','Dodatkowe rozwinięcie',active,'short');count();persist()};$('#editor').oninput=()=>{count();persist()};$('#chapterTitle').oninput=persist;$('#save').onclick=()=>{persist();$('#notice').textContent='✓ Książka zapisana.'};load(0);</script></body></html>
