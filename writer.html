<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — AI Pisanie</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f7f8fc;color:#171827}.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.back{display:block;color:#ccd5e3;text-decoration:none;margin:24px 0}.chapter{width:100%;border:0;background:transparent;color:#dce3ef;text-align:left;padding:10px;border-radius:8px;cursor:pointer}.chapter.on,.chapter:hover{background:#5b36e8}.main{padding:26px}.top{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e1e5ec;border-radius:14px;padding:18px;margin-top:16px}.field{width:100%;border:1px solid #d9dee8;border-radius:9px;padding:11px;font-size:15px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 17px;font-weight:800;cursor:pointer}.ghost{background:#ede9fe;color:#5431d6}.auto{background:linear-gradient(90deg,#5b36e8,#8b5cf6);font-size:17px;padding:15px 20px}.editor{min-height:440px;resize:vertical;line-height:1.7}.stats{display:flex;gap:15px;color:#6c7484;font-size:13px}.progress{height:10px;background:#e8eaf0;border-radius:20px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#6842ed;width:0;transition:.25s}.notice{color:#16885d;font-weight:700}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ede9fe;color:#5634d6;font-size:11px;font-weight:800}.help{font-size:13px;color:#737b8d}.mode{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#ecfdf5;color:#08794e;border-radius:10px;font-size:13px;font-weight:700}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.summary div{background:#f8f9fc;border-radius:10px;padding:12px}.summary b{display:block;font-size:20px;margin-top:4px}@media(max-width:800px){.app{grid-template-columns:1fr}.grid3,.grid2,.summary{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a class="back" href="index.html">← Dashboard</a><div class="badge">AUTO WRITER 2.0</div><h4>ROZDZIAŁY</h4><div id="chapters"></div></aside><main class="main"><div class="top"><div><h1 style="margin:0">AI Pisanie — Auto Writer</h1><p class="help">Ustaw książkę raz. KDP HERO tworzy plan i pisze rozdziały kolejno.</p></div><div class="mode">● TRYB LOKALNY — bez API</div></div><div class="card"><h3>1. Ustawienia książki</h3><div class="grid3"><input id="bookTitle" class="field" placeholder="Tytuł książki"><input id="topic" class="field" placeholder="Temat książki"><input id="author" class="field" value="Karolcia"><select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select><select id="audience" class="field"><option>Początkujący</option><option>Średniozaawansowani</option><option>Zaawansowani</option><option>Dzieci 3–5 lat</option><option>Dzieci 6–8 lat</option></select><select id="style" class="field"><option>Praktyczny i prosty</option><option>Profesjonalny</option><option>Lekki i przystępny</option><option>Ekspercki</option><option>Motywacyjny</option></select><select id="chapterCount" class="field"><option>8 rozdziałów</option><option selected>10 rozdziałów</option><option>12 rozdziałów</option></select><select id="length" class="field"><option value="short">Krótsze rozdziały</option><option value="medium" selected>Standardowe rozdziały</option><option value="long">Dłuższe rozdziały</option></select><select id="goal" class="field"><option>Poradnik praktyczny</option><option>E-book edukacyjny</option><option>Książka ekspercka</option><option>Workbook</option></select></div><label class="help" style="display:block;margin-top:12px">Dodatkowe instrukcje<textarea id="instructions" class="field" rows="3" placeholder="Np. bez powtórzeń, dużo przykładów, checklisty na końcu rozdziałów..."></textarea></label></div><div class="card"><h3>2. Automatyczne tworzenie</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="outline" class="btn ghost">Najpierw utwórz plan</button><button id="writeAll" class="btn auto">✦ NAPISZ CAŁĄ KSIĄŻKĘ AUTOMATYCZNIE</button><button id="continue" class="btn ghost">▶ Kontynuuj niedokończone</button></div><div class="progress"><i id="progress"></i></div><p id="autoStatus" class="help">Gotowe do rozpoczęcia.</p><div class="summary"><div>Rozdziały<b id="sumCh">0</b></div><div>Gotowe<b id="sumDone">0</b></div><div>Słowa<b id="sumWords">0</b></div><div>Postęp<b id="sumPct">0%</b></div></div></div><div class="card"><div class="top"><input id="chapterTitle" class="field" style="max-width:650px;font-weight:800;font-size:18px"><div class="stats"><span id="words">0 słów</span><span id="chars">0 znaków</span></div></div><textarea id="editor" class="field editor"></textarea><div style="display:flex;gap:10px;margin-top:12px;flex-wrap:wrap"><button id="rewrite" class="btn ghost">↻ Napisz rozdział od nowa</button><button id="more" class="btn ghost">＋ Rozwiń rozdział</button><button id="save" class="btn">Zapisz</button></div></div><p id="notice" class="notice"></p></main></div><script>const $=s=>document.querySelector(s);let data=JSON.parse(localStorage.getItem('kdpWriter')||'null')||{title:'',topic:'',author:'Karolcia',language:'Polski',audience:'Początkujący',style:'Praktyczny i prosty',goal:'Poradnik praktyczny',instructions:'',chapters:[]};if(!data.chapters?.length)data.chapters=[{title:'Rozdział 1 — Wprowadzenie',text:''}];let active=0;['bookTitle','topic','author','language','audience','style','goal','instructions'].forEach(k=>{let el=$('#'+k);if(el)el.value=data[k]||el.value});function persist(){data.title=$('#bookTitle').value;data.topic=$('#topic').value;data.author=$('#author').value;data.language=$('#language').value;data.audience=$('#audience').value;data.style=$('#style').value;data.goal=$('#goal').value;data.instructions=$('#instructions').value;if(data.chapters[active])data.chapters[active]={title:$('#chapterTitle').value,text:$('#editor').value};localStorage.setItem('kdpWriter',JSON.stringify(data));summary()}function render(){let box=$('#chapters');box.innerHTML=data.chapters.map((x,i)=>`<button class="chapter ${i===active?'on':''}" data-i="${i}">${i+1}. ${(x.title.split('—')[1]||x.title).trim()} ${x.text?'✓':''}</button>`).join('');summary()}function load(i){if(data.chapters[active])persist();active=i;$('#chapterTitle').value=data.chapters[i].title;$('#editor').value=data.chapters[i].text;render();count()}function count(){let t=$('#editor').value.trim();$('#words').textContent=(t?t.split(/\s+/).length:0)+' słów';$('#chars').textContent=t.length+' znaków'}function summary(){let total=data.chapters.length,done=data.chapters.filter(x=>x.text?.trim()).length,words=data.chapters.reduce((a,x)=>a+(x.text?.trim()?x.text.trim().split(/\s+/).length:0),0),pct=total?Math.round(done/total*100):0;$('#sumCh').textContent=total;$('#sumDone').textContent=done;$('#sumWords').textContent=words.toLocaleString('pl-PL');$('#sumPct').textContent=pct+'%';$('#progress').style.width=pct+'%'}function makePlan(){persist();let n=parseInt($('#chapterCount').value)||10;let names=['Wprowadzenie i obietnica dla czytelnika','Fundamenty i najważniejsze zasady','Kluczowe pojęcia bez komplikacji','Przygotowanie krok po kroku','Pierwsze praktyczne wdrożenie','Przykłady i realne scenariusze','Błędy, pułapki i sposoby naprawy','Narzędzia, checklisty i dobre praktyki','Plan działania na kolejne dni','Optymalizacja i dalszy rozwój','Techniki zaawansowane','Podsumowanie i plan dalszych kroków'];data.chapters=Array.from({length:n},(_,i)=>({title:`Rozdział ${i+1} — ${names[i]}`,text:''}));active=0;load(0);persist();$('#autoStatus').textContent='✓ Plan książki gotowy.'}function textFor(i,extra=false){let topic=data.topic||data.title||'temat książki',title=data.chapters[i].title.replace(/^Rozdział \d+ — /,''),aud=data.audience,style=data.style,goal=data.goal,inst=data.instructions;let p=[`${title} to ważny etap książki poświęconej tematowi „${topic}”. Ten rozdział został przygotowany z myślą o grupie: ${aud}. Jego zadaniem jest wyjaśnić zagadnienie w sposób zgodny ze stylem „${style}” i prowadzić czytelnika do praktycznego rezultatu.`,`Zacznijmy od najważniejszej zasady: wiedza ma być możliwa do zastosowania. W temacie „${topic}” warto najpierw określić cel, zebrać potrzebne informacje i podzielić pracę na niewielkie etapy. Dzięki temu nawet rozbudowane zagadnienie staje się łatwiejsze do opanowania.`,`Pierwszy krok polega na przygotowaniu podstaw. Zapisz, co chcesz osiągnąć, jakie dane lub materiały są potrzebne oraz po czym poznasz, że etap został wykonany prawidłowo. Następnie wykonaj pierwszą wersję bez nadmiernego poprawiania szczegółów. Dopiero po zakończeniu całości przejdź do kontroli jakości.`,`Przykład: osoba rozpoczynająca pracę z „${topic}” często próbuje zrobić wszystko jednocześnie. Lepsze rezultaty daje kolejność: przygotowanie, wykonanie, kontrola i poprawa. Taki schemat można powtarzać przy każdym kolejnym zadaniu, dzięki czemu praca staje się bardziej przewidywalna i łatwiejsza do monitorowania.`,`Najczęstsze problemy pojawiają się wtedy, gdy brakuje konkretnego celu, zadania nie są zapisywane albo kontrola odbywa się dopiero na samym końcu. Warto więc po każdym etapie odpowiedzieć sobie na trzy pytania: co jest gotowe, co wymaga poprawy i jaki będzie następny krok.`,`Ćwiczenie praktyczne: przygotuj krótką checklistę dla zagadnienia „${title}”. Umieść na niej maksymalnie pięć najważniejszych czynności. Wykonuj je po kolei i zaznaczaj postęp. Prosta lista często działa lepiej niż rozbudowany system, którego trudno używać regularnie.`,`Podsumowując, celem tego rozdziału jest przełożenie wiedzy na działanie. ${goal} powinien prowadzić czytelnika od zrozumienia problemu do samodzielnego wykonania kolejnego kroku. ${inst?'Dodatkowa zasada dla tej książki: '+inst:''}`];let len=$('#length').value;if(len==='short')p=p.slice(0,5);if(len==='long')p.push(`Warto również mierzyć rezultaty. Zapisuj, ile czasu zajmuje wykonanie poszczególnych etapów, które działania przynoszą najlepszy efekt i gdzie pojawiają się trudności. Po kilku powtórzeniach można na tej podstawie uprościć proces i stworzyć własny, dopracowany sposób pracy z tematem „${topic}”.`,`Na koniec spróbuj wyjaśnić najważniejszą ideę tego rozdziału własnymi słowami. Jeżeli potrafisz opisać ją krótko i wskazać praktyczny przykład, oznacza to, że materiał został dobrze zrozumiany. Jeśli nie, wróć do fragmentu, który nadal jest niejasny, i rozbij go na mniejsze elementy.`);if(extra)p=p.slice(-3);return p.join('\n\n')}function writeOne(i,extra=false){data.chapters[i].text=extra?(data.chapters[i].text+'\n\n'+textFor(i,true)):textFor(i,false)}async function run(onlyEmpty=false){persist();if(!data.topic.trim()&&!data.title.trim()){ $('#autoStatus').textContent='Wpisz temat lub tytuł książki.';return}if(data.chapters.length<2)makePlan();$('#writeAll').disabled=true;let targets=data.chapters.map((x,i)=>({x,i})).filter(o=>!onlyEmpty||!o.x.text?.trim());for(let z=0;z<targets.length;z++){let i=targets[z].i;$('#autoStatus').textContent=`Automatyczne pisanie: rozdział ${i+1}/${data.chapters.length}`;writeOne(i);localStorage.setItem('kdpWriter',JSON.stringify(data));render();await new Promise(r=>setTimeout(r,160))}load(active);$('#writeAll').disabled=false;$('#autoStatus').textContent='✓ Automatyczne pisanie zakończone. Wszystkie rozdziały zapisane.';$('#notice').textContent='Możesz teraz przejrzeć rozdziały albo przejść do Okładki AI.'}$('#chapters').onclick=e=>{let b=e.target.closest('[data-i]');if(b)load(+b.dataset.i)};$('#outline').onclick=makePlan;$('#writeAll').onclick=()=>run(false);$('#continue').onclick=()=>run(true);$('#rewrite').onclick=()=>{persist();writeOne(active);load(active);$('#notice').textContent='✓ Rozdział napisany ponownie.'};$('#more').onclick=()=>{persist();writeOne(active,true);load(active);$('#notice').textContent='✓ Rozdział rozwinięty.'};$('#editor').oninput=()=>{count();persist()};$('#chapterTitle').oninput=persist;$('#save').onclick=()=>{persist();$('#notice').textContent='✓ Zapisano książkę.'};document.querySelectorAll('#bookTitle,#topic,#author,#language,#audience,#style,#goal,#instructions').forEach(x=>x.addEventListener('change',persist));load(0);</script></body></html>
