<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — System Health Center 3.0</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f7fb;color:#151827}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 15px}.logo{font-size:22px;font-weight:900;margin-bottom:27px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:10px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.hero{border-radius:17px;padding:22px;margin:18px 0;color:#fff}.hero.ok{background:linear-gradient(135deg,#0d6b50,#18a879)}.hero.warn{background:linear-gradient(135deg,#8c650a,#d1a117)}.hero.bad{background:linear-gradient(135deg,#8c240a,#d14b17)}.btn{border:0;border-radius:9px;background:#fff;color:#4e2fc1;padding:11px 14px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e1e5ed;border-radius:13px;padding:15px}.card strong{display:block;font-size:27px;margin-top:6px}.engine{display:grid;grid-template-columns:1.2fr .7fr 1.5fr;gap:10px;align-items:center;background:#fff;border:1px solid #e1e5ed;border-radius:11px;padding:13px;margin:7px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#17a673;margin-right:7px}.dot.warn{background:#e4a11b}.dot.bad{background:#d44}.issue{background:#fff;border-left:5px solid #e4a11b;border-radius:10px;padding:12px;margin:7px 0}.issue.danger{border-color:#d44}.history{font-size:12px}.history .card{margin:7px 0}.pill{font-size:10px;font-weight:900;border-radius:99px;padding:5px 8px;background:#e7f8f1;color:#08794e}.pill.warn{background:#fff3d7;color:#8b6500}.pill.bad{background:#fee9e7;color:#a22}.health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.health{background:#fff;border:1px solid #e1e5ed;border-radius:12px;padding:14px}.health b{display:block;margin-bottom:5px}.health.ok{border-left:5px solid #17a673}.health.warn{border-left:5px solid #e4a11b}.health.bad{border-left:5px solid #d44}@media(max-width:750px){.grid,.health-grid{grid-template-columns:1fr 1fr}.engine{grid-template-columns:1fr}}@media(max-width:520px){.app{grid-template-columns:1fr}.grid,.health-grid{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="control-tower.html">◈ Control Tower</a><a href="morning-command-center.html">☀ Morning Command</a><a class="on" href="system-health-center.html">🛡 System Health</a><a href="ceo-mode.html">♛ CEO Mode</a></aside><main class="main"><h1 style="margin-bottom:4px">🛡 System Health Center 3.0</h1><div class="muted">Kontrola API, projektów, planu dnia, limitów, sesji produkcyjnej i Autopilota.</div><section id="hero" class="hero"></section><div id="stats" class="grid"></div><h2>Stan produkcji</h2><div id="productionHealth" class="health-grid"></div><h2>Testy silników i API</h2><div id="engines"></div><h2>Wykryte problemy</h2><div id="issues"></div><h2>Historia napraw</h2><div id="history" class="history"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="production-calendar.js"></script><script src="calendar-load-balancer.js"></script><script src="production-forecast.js"></script><script src="smart-workload-engine.js"></script><script src="ceo-mode.js"></script><script src="self-healing-engine.js"></script><script src="day-autopilot.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function test(name,fn,detail){try{let v=fn();return{name,status:'ok',detail:detail?detail(v):'API działa'}}catch(e){return{name,status:'bad',detail:e.message||'Błąd API'}}}function diagnostics(){let t=[];t.push(test('Project Store',()=>{if(!KDPProjectStore.list||!KDPProjectStore.active||!KDPProjectStore.load)throw Error('Niepełne API');return KDPProjectStore.list()},v=>v.length+' projektów'));t.push(test('Book Status Engine',()=>{if(!KDPBookStatus.status)throw Error('Brak status()');let b=KDPProjectStore.list()[0];return b?KDPBookStatus.status(b):null},v=>v?'Status: '+v.label:'Brak książek do testu'));t.push(test('Today Queue',()=>{if(!KDPTodayQueue.plan&&!KDPTodayQueue.build)throw Error('Brak plan()/build()');return KDPTodayQueue.plan?KDPTodayQueue.plan(100):KDPTodayQueue.build(100)},v=>v.length+' zadań'));t.push(test('Production Calendar',()=>{if(!KDPProductionCalendar.events||!KDPProductionCalendar.rebuild)throw Error('Niepełne API');return KDPProductionCalendar.events()},v=>v.length+' wydarzeń'));t.push(test('Calendar Load Balancer',()=>{if(!KDPCalendarLoad.overloads||!KDPCalendarLoad.balance)throw Error('Niepełne API');return KDPCalendarLoad.overloads()},v=>v.length?'Przeciążone dni: '+v.length:'Obciążenie OK'));t.push(test('Production Forecast',()=>{if(!KDPProductionForecast.all)throw Error('Brak all()');return KDPProductionForecast.all()},v=>v.length+' prognoz'));t.push(test('Smart Workload',()=>{if(!KDPSmartWorkload.capacity||!KDPSmartWorkload.plan)throw Error('Niepełne API');return KDPSmartWorkload.capacity()},v=>'Limit dnia: '+v.limit));t.push(test('CEO Mode',()=>{if(!KDPCEOMode.rows||!KDPCEOMode.build)throw Error('Niepełne API');return KDPCEOMode.rows()},v=>v.length+' projektów ocenionych'));t.push(test('Day Autopilot',()=>{if(!KDPDayAutopilot.state||!KDPDayAutopilot.replan||!KDPDayAutopilot.heal)throw Error('Niepełne API 3.0');return KDPDayAutopilot.state()},v=>v&&v.active?'Sesja aktywna':v&&v.paused?'Sesja wstrzymana':v&&v.limitReached?'Limit osiągnięty':'Gotowy'));t.push(test('Self-Healing',()=>{if(!KDPSelfHealing.diagnose||!KDPSelfHealing.repair)throw Error('Niepełne API');return KDPSelfHealing.diagnose()},v=>v.healthy?'Diagnostyka OK':v.issues.length+' problemów'));return t}function productionCards(h,ap){let ps=read('kdpAutoProductionSession',null),plan=read('kdpNextWorkdayPlan',null),cap=window.KDPSmartWorkload?KDPSmartWorkload.capacity():null,active=window.KDPProjectStore?KDPProjectStore.active():null,books=window.KDPProjectStore?KDPProjectStore.list():[],activeOk=!active||books.some(b=>String(b.id)===String(active)),limit=Number(cap&&cap.limit)||0,done=Number(ap&&ap.completed)||0,limitBad=!!(ap&&ap.active&&limit&&done>=limit),sessionBad=!!(ps&&ps.active&&ap&&(ap.finished||ap.limitReached)&&!ap.active),planBad=!!(plan&&plan.day&&plan.day<today());let cards=[{name:'Aktywna książka',status:activeOk?'ok':'bad',text:activeOk?(active?'Projekt istnieje i jest dostępny':'Brak wybranego projektu'):'Wskazanie projektu jest uszkodzone'},{name:'Dzienny limit',status:limitBad?'bad':'ok',text:limit?done+' / '+limit+' wykonanych':'Limit automatyczny'},{name:'Sesja produkcyjna',status:sessionBad?'bad':ps&&ps.active?'ok':'ok',text:sessionBad?'Sesja pozostała po zakończeniu dnia':ps&&ps.active?'Aktywna i spójna':'Brak aktywnej sesji'},{name:'Plan dnia',status:planBad?'warn':plan&&plan.day===today()?'ok':'ok',text:planBad?'Plan jest przeterminowany':plan&&plan.day===today()?'Plan na dziś gotowy':'Brak planu wymagającego uwagi'},{name:'Day Autopilot',status:limitBad?'bad':ap&&ap.paused?'warn':'ok',text:ap&&ap.active?'Aktywny':ap&&ap.paused?'Wstrzymany':ap&&ap.limitReached?'Limit osiągnięty':ap&&ap.finished?'Dzień zakończony':'Gotowy'},{name:'Self-Healing',status:h.healthy?'ok':h.issues.some(x=>x.severity==='danger')?'bad':'warn',text:h.healthy?'Nie wykryto niespójności':h.issues.length+' problemów do kontroli'}];return cards}function render(){let h=KDPSelfHealing.diagnose(),log=KDPSelfHealing.history(),ap=KDPDayAutopilot.state(),tests=diagnostics(),failed=tests.filter(x=>x.status==='bad'),danger=h.issues.filter(x=>x.severity==='danger'),level=failed.length||danger.length?'bad':h.issues.length?'warn':'ok';hero.className='hero '+level;hero.innerHTML=level==='ok'?'<h2>✓ System działa prawidłowo</h2><p>API, dane i zabezpieczenia produkcji przeszły kontrolę.</p><button class="btn" id="repair">🛠 Napraw automatycznie / kontrola</button>':level==='warn'?`<h2>⚠ System wymaga uwagi</h2><p>${h.issues.length} ostrzeżeń. Produkcja może działać, ale zalecana jest automatyczna naprawa.</p><button class="btn" id="repair">🛠 Napraw automatycznie</button>`:`<h2>⛔ System wymaga naprawy</h2><p>${failed.length} błędów API · ${danger.length} krytycznych niespójności danych.</p><button class="btn" id="repair">🛠 Napraw automatycznie</button>`;stats.innerHTML=`<div class="card">Książki<strong>${h.books}</strong></div><div class="card">Zadania<strong>${h.tasks}</strong></div><div class="card">Problemy<strong>${h.issues.length+failed.length}</strong></div><div class="card">Autopilot<strong>${ap&&ap.active?'ON':ap&&ap.paused?'PAUZA':ap&&ap.limitReached?'LIMIT':'OFF'}</strong></div>`;productionHealth.innerHTML=productionCards(h,ap).map(x=>`<div class="health ${x.status}"><b>${esc(x.name)}</b><span class="muted">${esc(x.text)}</span></div>`).join('');engines.innerHTML=tests.map(e=>`<div class="engine"><span><i class="dot ${e.status==='ok'?'':e.status}"></i><b>${esc(e.name)}</b></span><span><i class="pill ${e.status==='ok'?'':e.status}">${e.status==='ok'?'OK':e.status==='warn'?'OSTRZEŻENIE':'WYMAGA NAPRAWY'}</i></span><span class="muted">${esc(e.detail)}</span></div>`).join('');let combined=[...failed.map(x=>({type:'api-'+x.name,severity:'danger',text:x.detail})),...h.issues];issues.innerHTML=combined.map(i=>`<div class="issue ${i.severity==='danger'?'danger':''}"><b>${esc(i.type)}</b><div class="muted">${esc(i.text)}</div></div>`).join('')||'<div class="card muted">✓ Brak wykrytych problemów.</div>';history.innerHTML=log.slice(0,20).map(x=>`<div class="card"><b>${new Date(x.at).toLocaleString('pl-PL')}</b> · ${esc(x.source||'manual')} · problemy ${x.before} → ${x.after}<div class="muted">${esc((x.actions||[]).join(' · ')||'Kontrola bez konieczności zmian')}</div></div>`).join('')||'<div class="card muted">Brak zapisanych napraw.</div>';document.getElementById('repair').onclick=()=>{KDPSelfHealing.repair({source:'health-center'});if(window.KDPCalendarLoad&&KDPCalendarLoad.overloads().length)KDPCalendarLoad.balance();render()}}render();window.addEventListener('kdp-self-healed',()=>setTimeout(render,30));window.addEventListener('kdp-day-autopilot',()=>setTimeout(render,30));</script></body></html>
