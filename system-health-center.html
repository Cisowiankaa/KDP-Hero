<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — System Health Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f7fb;color:#151827}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 15px}.logo{font-size:22px;font-weight:900;margin-bottom:27px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:10px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.hero{border-radius:17px;padding:22px;margin:18px 0;color:#fff}.hero.ok{background:linear-gradient(135deg,#0d6b50,#18a879)}.hero.bad{background:linear-gradient(135deg,#8c3e0a,#d18417)}.btn{border:0;border-radius:9px;background:#fff;color:#4e2fc1;padding:11px 14px;font-weight:900;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e1e5ed;border-radius:13px;padding:15px}.card strong{display:block;font-size:27px;margin-top:6px}.engine{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid #e1e5ed;border-radius:11px;padding:13px;margin:7px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#17a673;margin-right:7px}.dot.off{background:#c7cad2}.issue{background:#fff;border-left:5px solid #e4a11b;border-radius:10px;padding:12px;margin:7px 0}.history{font-size:12px}.history .card{margin:7px 0}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="control-tower.html">◈ Control Tower</a><a href="morning-command-center.html">☀ Morning Command</a><a class="on" href="system-health-center.html">🛡 System Health</a><a href="ceo-mode.html">♛ CEO Mode</a></aside><main class="main"><h1 style="margin-bottom:4px">🛡 System Health Center</h1><div class="muted">Diagnostyka i automatyczna naprawa silników produkcyjnych KDP HERO.</div><section id="hero" class="hero"></section><div id="stats" class="grid"></div><h2>Silniki systemu</h2><div id="engines"></div><h2>Wykryte problemy</h2><div id="issues"></div><h2>Historia automatycznych napraw</h2><div id="history" class="history"></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="production-calendar.js"></script><script src="production-forecast.js"></script><script src="smart-workload-engine.js"></script><script src="ceo-mode.js"></script><script src="day-autopilot.js"></script><script src="self-healing-engine.js"></script><script>function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let h=KDPSelfHealing.diagnose(),log=KDPSelfHealing.history(),ap=KDPDayAutopilot.state(),engineList=[['Project Store',!!window.KDPProjectStore],['Book Status Engine',!!window.KDPBookStatus],['Priority Engine',!!window.KDPBookPriority],['Today Queue',!!window.KDPTodayQueue],['Smart Workload',!!window.KDPSmartWorkload],['Production Forecast',!!window.KDPProductionForecast],['CEO Mode',!!window.KDPCEOMode],['Day Autopilot',!!window.KDPDayAutopilot],['Self-Healing',!!window.KDPSelfHealing]];hero.className='hero '+(h.healthy?'ok':'bad');hero.innerHTML=h.healthy?'<h2>✓ System jest zdrowy</h2><p>Nie wykryto niespójności blokujących produkcję.</p><button class="btn" id="repair">Sprawdź i napraw cały system</button>':`<h2>⚠ Wykryto ${h.issues.length} problemów</h2><p>Self-Healing może automatycznie naprawić bezpieczne niespójności.</p><button class="btn" id="repair">🛠 Sprawdź i napraw cały system</button>`;stats.innerHTML=`<div class="card">Książki<strong>${h.books}</strong></div><div class="card">Zadania<strong>${h.tasks}</strong></div><div class="card">Problemy<strong>${h.issues.length}</strong></div><div class="card">Autopilot<strong>${ap&&ap.active?'ON':'OFF'}</strong></div>`;engines.innerHTML=engineList.map(e=>`<div class="engine"><span><i class="dot ${e[1]?'':'off'}"></i><b>${e[0]}</b></span><span class="muted">${e[1]?'aktywny':'niedostępny'}</span></div>`).join('');issues.innerHTML=h.issues.map(i=>`<div class="issue"><b>${esc(i.type)}</b><div class="muted">${esc(i.text)}</div></div>`).join('')||'<div class="card muted">✓ Brak wykrytych problemów.</div>';history.innerHTML=log.slice(0,20).map(x=>`<div class="card"><b>${new Date(x.at).toLocaleString('pl-PL')}</b> · problemy ${x.before} → ${x.after}<div class="muted">${esc((x.actions||[]).join(' · ')||'Kontrola bez konieczności zmian')}</div></div>`).join('')||'<div class="card muted">Brak zapisanych napraw.</div>';document.getElementById('repair').onclick=()=>{KDPSelfHealing.repair();render()}}render();</script></body></html>
