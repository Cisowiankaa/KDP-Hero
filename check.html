<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — KDP Check</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#171827}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:800}.logo b{color:#8b5cf6}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:8px;margin-top:10px}.side a:hover,.side .on{background:#5b36e8}.main{padding:30px}.muted{color:#747c8e}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:18px}.score{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;margin:20px auto;background:conic-gradient(#16a36a var(--score),#e8ebf0 0);position:relative}.score:after{content:'';position:absolute;width:135px;height:135px;border-radius:50%;background:#fff}.score b{position:relative;z-index:1;font-size:36px}.item{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:14px 4px;border-bottom:1px solid #edf0f4}.dot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#eef1f5}.ok .dot{background:#e6faef;color:#08794e}.warn .dot{background:#fff4df;color:#a66200}.pill{font-size:11px;border-radius:99px;padding:5px 8px;background:#eef1f5}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.ready{color:#08794e;font-weight:800}@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka AI</a><a class="on" href="check.html">✓ KDP Check</a></aside><main class="main"><div class="muted" style="font-size:13px">KDP HERO / KDP Check</div><h1 style="margin-bottom:5px">KDP Check</h1><p class="muted">Sprawdź gotowość książki przed publikacją na Amazon KDP.</p><div class="grid"><div class="card"><h3>Wynik gotowości</h3><div id="score" class="score" style="--score:0%"><b id="scoreText">0/100</b></div><p id="summary" class="muted" style="text-align:center">Uruchamiam kontrolę projektu…</p><button id="run" class="btn" style="width:100%">Sprawdź ponownie</button></div><div class="card"><h3>Kontrola publikacji</h3><div id="checks"></div></div></div><div class="card"><h3>Rekomendacja</h3><p id="recommendation" class="muted"></p></div><script>const cover=JSON.parse(localStorage.getItem('kdpCover')||'{}'),writer=JSON.parse(localStorage.getItem('kdpWriter')||'{}');const rules=[['Tytuł książki',()=>!!(cover.title||writer.title),'Uzupełnij tytuł książki.'],['Autor',()=>!!(cover.author||writer.author),'Uzupełnij nazwę autora.'],['Format KDP',()=>!!cover.format,'Wybierz format książki w Okładka AI.'],['Typ publikacji',()=>!!cover.type,'Wybierz Paperback, Hardcover lub E-book.'],['Liczba stron',()=>Number(cover.pages)>=24,'Podaj prawidłową liczbę stron.'],['Brief okładki',()=>!!cover.prompt,'Utwórz prompt/brief okładki.'],['Wariant okładki',()=>!!cover.variant,'Wybierz wariant Minimalistyczny lub Premium.'],['Treść książki',()=>Array.isArray(writer.chapters)&&writer.chapters.some(x=>x.text&&x.text.trim()),'Dodaj treść przynajmniej jednego rozdziału.'],['Struktura rozdziałów',()=>Array.isArray(writer.chapters)&&writer.chapters.length>=3,'Utwórz co najmniej 3 rozdziały.'],['Nisza / temat',()=>!!cover.niche,'Uzupełnij niszę lub temat książki.']];function run(){let passed=0,html='',missing=[];rules.forEach(([name,test,tip])=>{let ok=false;try{ok=!!test()}catch(e){}if(ok)passed++;else missing.push(tip);html+=`<div class="item ${ok?'ok':'warn'}"><span class="dot">${ok?'✓':'!'}</span><div><b>${name}</b><div class="muted" style="font-size:12px">${ok?'Gotowe':tip}</div></div><span class="pill">${ok?'OK':'DO POPRAWY'}</span></div>`});let score=passed*10;document.querySelector('#checks').innerHTML=html;document.querySelector('#score').style.setProperty('--score',score+'%');document.querySelector('#scoreText').textContent=score+'/100';document.querySelector('#summary').innerHTML=score===100?'<span class="ready">✓ KDP-ready</span>':`${passed}/10 elementów gotowych`;document.querySelector('#recommendation').textContent=score===100?'Projekt przeszedł podstawową kontrolę KDP HERO. Możesz przejść do końcowej weryfikacji plików przed publikacją.':'Najpierw popraw: '+missing.slice(0,4).join(' ');localStorage.setItem('kdpCheckScore',String(score))}document.querySelector('#run').onclick=run;run();</script></main></div></body></html>
