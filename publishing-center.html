<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Final Publishing Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1300px}.muted{color:#747c8e}.hero,.card{background:#fff;border:1px solid #e1e5ec;border-radius:16px;padding:22px;margin-bottom:16px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center}.status{font-size:25px;font-weight:900}.ok{color:#08794e}.warn{color:#a66200}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:#f8f9fc;border-radius:12px;padding:17px}.tile small{color:#747c8e}.tile b{display:block;font-size:20px;margin-top:7px}.bar{height:10px;background:#e9edf3;border-radius:20px;overflow:hidden;margin-top:9px}.fill{height:100%;background:#6842ed}.btn{display:inline-block;text-decoration:none;border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer}.dark{background:#101827}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.hero{display:block}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka</a><a href="keywords.html">⌕ Keywords</a><a href="check.html">✓ KDP Check</a><a href="publish-package.html">★ Publish Package</a><a class="on" href="publishing-center.html">🚀 Publishing Center</a></aside><main class="main"><section class="hero"><div><h1>Final Publishing Center</h1><p class="muted">Końcowa kontrola książki przed publikacją na Amazon KDP.</p></div><div id="status" class="status"></div></section><section class="card"><div id="grid" class="grid"></div></section><section class="card"><h2>Gotowość projektu</h2><div class="bar"><div id="fill" class="fill"></div></div><p id="summary"></p><div id="problems"></div></section><section class="card"><h2>Akcje</h2><div class="actions"><a class="btn" href="publish-package.html">Otwórz Publish Package</a><a class="btn dark" href="check.html">Uruchom KDP Check</a><a class="btn dark" href="cover.html">Sprawdź okładkę</a><button id="refresh" class="btn dark">Odśwież kontrolę</button></div></section><script>const $=s=>document.querySelector(s);function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}}function render(){let m=get('kdpManuscript'),c=get('kdpCover'),p=get('kdpPublishPackage'),pro=get('kdpPublishPro'),check=get('kdpPublishReady'),ls=get('kdpListingScore'),words=String(m.content||m.text||'').trim().split(/\s+/).filter(Boolean).length,kws=Array.isArray(pro.keywords)?pro.keywords.filter(Boolean):[],items=[['Manuskrypt',words?words.toLocaleString()+' słów':'Brak',words>500],['Okładka',c.generated?'Gotowa':'Brak',!!c.generated],['Opis Amazon',String(p.description||'').length>=400?'Gotowy':'Do poprawy',String(p.description||'').length>=400],['Keywords',kws.length+'/7',kws.length===7],['KDP Check',check.score!=null?check.score+'%':'Brak',!!check.ready],['Listing Score',ls.score!=null?ls.score+'/100':'Brak',ls.score>=90]];let passed=items.filter(x=>x[2]).length,score=Math.round(passed/items.length*100),problems=items.filter(x=>!x[2]);$('#grid').innerHTML=items.map(x=>`<div class="tile"><small>${x[0]}</small><b class="${x[2]?'ok':'warn'}">${x[2]?'✓ ':'○ '}${x[1]}</b></div>`).join('');$('#fill').style.width=score+'%';$('#summary').innerHTML=`Gotowość techniczna: <b>${score}%</b> · ${passed}/${items.length} obszarów zakończonych.`;$('#problems').innerHTML=problems.length?'<b>Do zrobienia przed publikacją:</b><br>'+problems.map(x=>'• '+x[0]).join('<br>'):'<b class="ok">✓ Wszystkie kluczowe kontrole zakończone.</b>';let ready=passed===items.length;$('#status').className='status '+(ready?'ok':'warn');$('#status').textContent=ready?'✓ GOTOWE DO PUBLIKACJI':'○ WYMAGA POPRAWEK';localStorage.setItem('kdpFinalPublishing',JSON.stringify({score,ready,passed,total:items.length,updatedAt:new Date().toISOString()}))}$('#refresh').onclick=render;render();</script></main></div></body></html>
