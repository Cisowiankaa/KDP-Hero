<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Historia wersji</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#111725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:24px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1050px}.muted{color:#747c8e}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:16px}.version{display:grid;grid-template-columns:1fr auto;gap:15px;padding:15px 0;border-bottom:1px solid #edf0f4}.version:last-child{border:0}.btn{border:1px solid #dce0e8;background:#fff;border-radius:8px;padding:9px 11px;cursor:pointer}.primary{background:#6842ed;color:#fff;border-color:#6842ed}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:16px}.version{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="books.html">▤ Wszystkie książki</a><a class="on" href="history.html">↶ Historia wersji</a><a href="workflow.html">⚡ Auto Workflow</a></aside><main class="main"><h1>Historia wersji</h1><p class="muted">Cofnij aktywną książkę do wcześniejszego stanu bez utraty bieżącej wersji.</p><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b id="title">Aktywna książka</b><div class="muted" id="count"></div></div><button id="checkpoint" class="btn primary">＋ Zapisz wersję teraz</button></div></section><section id="versions" class="card"></section><script src="project-store.js"></script><script src="version-history.js"></script><script src="project-switcher.js"></script><script>const $=s=>document.querySelector(s);function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let id=KDPProjectStore.active(),b=KDPProjectStore.books()[id],list=KDPVersions.list();$('#title').textContent=b?b.title:'Brak aktywnej książki';$('#count').textContent=list.length+' zapisanych wersji · maksymalnie 20';$('#versions').innerHTML=list.length?list.map((v,i)=>`<div class="version"><div><b>${esc(v.label||'Wersja')} ${i===0?'— najnowsza':''}</b><div class="muted">${new Date(v.at).toLocaleString('pl-PL')} · ${esc(v.type||'')}</div></div><div class="actions"><button class="btn primary" data-restore="${v.id}">↶ Przywróć</button><button class="btn" data-delete="${v.id}">Usuń</button></div></div>`).join(''):'<p class="muted">Historia jest pusta. Zapisz pierwszy checkpoint.</p>'}$('#checkpoint').onclick=()=>{KDPVersions.snapshot('Ręczny checkpoint');render()};$('#versions').onclick=e=>{let r=e.target.closest('[data-restore]'),d=e.target.closest('[data-delete]');if(r)KDPVersions.restore(r.dataset.restore);if(d&&confirm('Usunąć tę wersję z historii?')){KDPVersions.remove(d.dataset.delete);render()}};render();</script></main></div></body></html>
