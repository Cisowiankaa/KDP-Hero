<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Podsumowanie tygodnia</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8;color:#fff}.main{padding:26px}.muted{color:#70788c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:17px}.card strong{display:block;font-size:28px;margin-top:7px}.wide{grid-column:span 2}.btn{border:0;border-radius:9px;padding:11px 14px;font-weight:900;cursor:pointer;background:#6842ed;color:#fff}.dark{background:#101827}.score{font-size:50px;font-weight:900;color:#5634d6}.actions{display:flex;gap:9px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="production-manager.html">▶ Production Manager</a><a href="work-history.html">📊 Historia pracy</a><a class="on" href="weekly-summary.html">▦ Podsumowanie tygodnia</a><a href="weekly-production.html">▤ Plan tygodnia</a></aside><main class="main"><h1 style="margin-bottom:4px">▦ Podsumowanie tygodnia</h1><div class="muted" id="period"></div><div id="stats" class="grid"></div><div class="card"><h3 style="margin-top:0">⚡ Automatyczny plan kolejnego tygodnia</h3><p class="muted">KDP HERO może rozłożyć niewykonane zadania od poniedziałku do piątku według aktualnych priorytetów.</p><div class="actions"><button class="btn" id="refresh">↻ Przelicz tydzień</button><button class="btn dark" id="plan">⚡ Przygotuj następny tydzień</button></div><div id="msg" class="muted" style="margin-top:12px"></div></div></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="weekly-summary.js"></script><script>function render(){let s=KDPWeeklySummary.build();document.querySelector('#period').textContent=`${new Date(s.from+'T12:00').toLocaleDateString('pl-PL')} — ${new Date(s.to+'T12:00').toLocaleDateString('pl-PL')}`;document.querySelector('#stats').innerHTML=`<div class="card"><span>Wynik tygodnia</span><div class="score">${s.score}</div><span class="muted">/ 100</span></div><div class="card">Ukończone etapy<strong>${s.completed}</strong></div><div class="card">Aktywne książki<strong>${s.activeBooks}</strong></div><div class="card">Zaległe / oczekujące<strong>${s.pending}</strong></div><div class="card wide"><span>Największe obciążenie</span><strong style="font-size:20px">${s.busiestBook}</strong><span class="muted">${s.busiestCount} zadań w kolejce</span></div><div class="card wide"><span>Przeniesione zadania</span><strong>${s.carried}</strong><span class="muted">z raportów dziennych tego tygodnia</span></div>`}render();document.querySelector('#refresh').onclick=render;document.querySelector('#plan').onclick=()=>{let p=KDPWeeklySummary.nextWeek();document.querySelector('#msg').innerHTML=`✓ Przygotowano <b>${p.tasks.length}</b> zadań. Nowy tydzień zaczyna się ${new Date(p.weekStart+'T12:00').toLocaleDateString('pl-PL')}. <a href="weekly-production.html">Otwórz plan →</a>`};</script></body></html>
