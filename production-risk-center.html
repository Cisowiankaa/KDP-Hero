<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Production Risk Center</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:28px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:11px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.card{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:18px;margin-top:16px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;border:1px solid #e5e8ee;border-radius:11px}.stat strong{display:block;font-size:25px;margin-top:5px}.risk{padding:13px;border-radius:10px;margin-top:9px;border:1px solid #e5e8ee}.critical{background:#fff1f2;border-color:#ffcbd2}.warning{background:#fff8e8;border-color:#f3d699}.info{background:#eef6ff;border-color:#c8dcf5}.risk a{color:#4d35b5;text-decoration:none;font-weight:800}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:10px 14px;font-weight:800;cursor:pointer}@media(max-width:650px){.app{grid-template-columns:1fr}.main{padding:15px}.stats{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="production-manager.html">▶ Production Manager</a><a href="production-calendar.html">📅 Production Calendar</a><a class="on" href="production-risk-center.html">⚠ Production Risk Center</a><a href="system-health-center.html">🛡 System Health</a></aside><main class="main"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h1 style="margin-bottom:4px">⚠ Production Risk Center</h1><div class="muted">Jedno miejsce dla ryzyka terminów, obciążenia, workflow i stanu systemu.</div></div><button class="btn" id="scan">↻ Skanuj ponownie</button></div><section class="card"><div class="stats"><div class="stat">Krytyczne<strong id="critical">0</strong></div><div class="stat">Ostrzeżenia<strong id="warning">0</strong></div><div class="stat">Informacyjne<strong id="info">0</strong></div></div><div id="list"></div></section></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="smart-workload-engine.js"></script><script src="smart-production-forecast.js"></script><script src="production-calendar.js"></script><script src="calendar-load-balancer.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="day-autopilot.js"></script><script src="deadline-rescue-2.js"></script><script src="production-risk-center.js"></script><script>function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){let s=KDPProductionRiskCenter.scan();critical.textContent=s.critical;warning.textContent=s.warning;info.textContent=s.info;list.innerHTML=s.items.length?s.items.map(x=>`<div class="risk ${x.level}"><b>${x.level==='critical'?'🔴 KRYTYCZNE':x.level==='warning'?'🟠 OSTRZEŻENIE':'🔵 INFORMACJA'} — ${esc(x.title)}</b><div style="margin:5px 0">${esc(x.text)}</div>${x.url?`<a href="${x.url}">Otwórz moduł →</a>`:''}</div>`).join(''):'<div style="padding:20px 0" class="muted">✓ Nie wykryto aktywnych ryzyk produkcyjnych.</div>'}scan.onclick=render;render();</script></body></html>
