<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Publish Package</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:white;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1300px}.muted{color:#747c8e}.card{background:white;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tile{background:#f8f9fc;border-radius:12px;padding:16px}.tile b{display:block;font-size:18px;margin-top:5px}.ok{color:#08794e}.warn{color:#a66200}.field{width:100%;padding:11px;border:1px solid #dce1e8;border-radius:9px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.dark{background:#101827}.actions{display:flex;gap:10px;flex-wrap:wrap}.package{white-space:pre-wrap;background:#f8f9fc;border-radius:10px;padding:16px;max-height:500px;overflow:auto}@media(max-width:800px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:16px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="writer.html">✐ AI Pisanie</a><a href="cover.html">▧ Okładka</a><a href="keywords.html">⌕ Keywords</a><a href="check.html">✓ KDP Check</a><a class="on" href="publish-package.html">★ Publish Package</a></aside><main class="main"><h1>Amazon KDP Publish Package</h1><p class="muted">Wszystkie dane potrzebne do publikacji książki w jednym miejscu.</p><section class="card"><div id="tiles" class="grid"></div></section><section class="card"><h2>Metadane publikacji</h2><div class="grid"><label>Podtytuł<input id="subtitle" class="field"></label><label>Język<select id="language" class="field"><option>Polski</option><option>English</option><option>Deutsch</option></select></label><label>Kategoria<input id="category" class="field" placeholder="np. Business & Money"></label></div><label><p>Opis Amazon</p><textarea id="description" class="field" rows="8"></textarea></label><div class="actions" style="margin-top:12px"><button id="autoDesc" class="btn">✦ Przygotuj opis</button><button id="save" class="btn dark">Zapisz pakiet</button><button id="download" class="btn dark">Pobierz TXT</button></div></section><section class="card"><h2>Podsumowanie pakietu</h2><div id="package" class="package"></div></section><script>const $=s=>document.querySelector(s);function get(k){try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return {}}}let w=get('kdpWriter'),c=get('kdpCover'),m=get('kdpManuscript'),k=get('kdpKeywords'),p=get('kdpPublishPackage'),ready=get('kdpPublishReady');let keywords=Array.isArray(k.selected)?k.selected:Array.isArray(k.keywords)?k.keywords:[];['subtitle','language','category','description'].forEach(x=>{if(p[x])$('#'+x).value=p[x]});function render(){let words=String(m.content||m.text||'').trim().split(/\s+/).filter(Boolean).length,items=[['Manuskrypt',words?words.toLocaleString()+' słów':'Brak',words>0],['Okładka',c.generated?'Wygenerowana':'Do przygotowania',!!c.generated],['Keywords',keywords.length+'/7',keywords.length>=3],['KDP Check',ready.score!=null?ready.score+'%':'Brak wyniku',!!ready.ready],['Format',c.format||'—',!!c.format],['Typ',c.type||'—',!!c.type]];$('#tiles').innerHTML=items.map(x=>`<div class="tile"><small>${x[0]}</small><b class="${x[2]?'ok':'warn'}">${x[1]}</b></div>`).join('');let data=collect();$('#package').textContent=`TYTUŁ: ${data.title}\nPODTYTUŁ: ${data.subtitle}\nAUTOR: ${data.author}\nJĘZYK: ${data.language}\nFORMAT: ${data.format}\nTYP: ${data.type}\nKATEGORIA: ${data.category}\n\nSŁOWA KLUCZOWE:\n${data.keywords.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\nOPIS AMAZON:\n${data.description}`;}function collect(){return{title:c.title||w.title||'',subtitle:$('#subtitle').value,author:c.author||w.author||'',language:$('#language').value,format:c.format||'',type:c.type||'',category:$('#category').value,keywords,description:$('#description').value,updatedAt:new Date().toISOString()}}$('#autoDesc').onclick=()=>{let topic=c.niche||w.topic||'temat książki',title=c.title||w.title||'Ta książka';$('#description').value=`${title} to praktyczny przewodnik dla osób, które chcą lepiej zrozumieć ${topic} i przejść od teorii do konkretnych działań.\n\nW środku znajdziesz uporządkowane wyjaśnienia, praktyczne wskazówki i rozwiązania, które możesz zastosować krok po kroku. Treść została zaprojektowana tak, aby była czytelna zarówno dla początkujących, jak i osób chcących uporządkować swoją wiedzę.\n\nJeśli szukasz konkretnego, przystępnego i dobrze zorganizowanego poradnika, ta publikacja pomoże Ci zacząć i konsekwentnie przejść przez najważniejsze zagadnienia.`;render()};$('#save').onclick=()=>{localStorage.setItem('kdpPublishPackage',JSON.stringify(collect()));render()};$('#download').onclick=()=>{render();let a=document.createElement('a'),b=new Blob([$('#package').textContent],{type:'text/plain;charset=utf-8'});a.href=URL.createObjectURL(b);a.download=(c.title||w.title||'KDP-Publish-Package').replace(/[^a-z0-9ąćęłńóśźż]+/gi,'-')+'-publish-package.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};document.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('input',render));render();</script><script src="publish-pro.js"></script><script src="metadata-auto.js"></script></main></div></body></html>
