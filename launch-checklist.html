<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Launch Checklist</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f6fa;color:#121725}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:22px}.logo{font-size:21px;font-weight:900;margin-bottom:22px}.logo b{color:#9a6cff}.side a{display:block;color:#dce3ef;text-decoration:none;padding:11px;border-radius:9px;margin:5px 0}.side a:hover,.on{background:#5b36e8}.main{padding:28px;max-width:1050px}.card{background:#fff;border:1px solid #e1e5ec;border-radius:15px;padding:20px;margin:16px 0}.hero{background:linear-gradient(135deg,#101827,#291b61);color:#fff}.muted{color:#747c8e}.hero .muted{color:#c8c7dc}.step{display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f4}.step input{width:22px;height:22px}.field{padding:9px;border:1px solid #dce1e8;border-radius:8px;min-width:180px}.btn{border:0;border-radius:9px;background:#6842ed;color:#fff;padding:11px 15px;font-weight:800;text-decoration:none;cursor:pointer;display:inline-block}.dark{background:#101827}.locked{opacity:.45;pointer-events:none}.good{color:#62e6a2}.bad{color:#ff9aa4}.progress{height:10px;background:#ffffff22;border-radius:20px;overflow:hidden}.fill{height:100%;background:#8b5cf6}.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.meta label{display:flex;flex-direction:column;gap:6px}.decision{font-size:25px;font-weight:900}@media(max-width:700px){.app{grid-template-columns:1fr}.main{padding:15px}.step,.meta{grid-template-columns:1fr}.step input{display:block}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="publishing-center.html">🚀 Publishing Center</a><a href="pre-publish.html">✓ Pre-Publish Assistant</a><a class="on" href="launch-checklist.html">★ Launch Checklist</a></aside><main class="main"><h1>★ Amazon KDP Launch Checklist</h1><p class="muted">Ostatnie czynności wykonywane podczas wystawiania książki w panelu Amazon KDP.</p><section class="card hero"><div id="decision" class="decision">Przygotowanie…</div><p id="summary" class="muted"></p><div class="progress"><div id="fill" class="fill"></div></div></section><section class="card"><h2>Dane uruchomienia</h2><div class="meta"><label>ISBN / identyfikator<input id="isbn" class="field" placeholder="ISBN lub Amazon free ISBN"></label><label>Marketplace<select id="market" class="field"><option>Amazon.com</option><option>Amazon.co.uk</option><option>Amazon.de</option><option>Amazon.fr</option><option>Amazon.it</option><option>Amazon.es</option></select></label><label>Planowana data publikacji<input id="date" type="date" class="field"></label><label>Status<select id="launchStatus" class="field"><option value="draft">Szkic</option><option value="submitted">Przesłano do KDP</option><option value="review">W weryfikacji Amazon</option><option value="live">Opublikowana</option></select></label></div><button id="save" class="btn dark" style="margin-top:12px">Zapisz</button></section><section class="card"><h2>Checklista uruchomienia</h2><div id="steps"></div></section><section class="card"><button id="finish" class="btn locked">✓ Zapisz jako gotową do wysłania</button> <a href="publishing-center.html" class="btn dark">Publishing Center</a></section><script src="project-store.js"></script><script>const $=s=>document.querySelector(s),KEY='kdpLaunchChecklist';const names=['Sprawdzono książkę w Amazon Previewer','Wybrano ISBN / identyfikator wydania','Zweryfikowano tytuł i dane autora','Zweryfikowano opis, kategorię i keywords','Przesłano finalny plik wnętrza','Przesłano finalną okładkę','Sprawdzono cenę i marketplace','Potwierdzono prawa i terytoria','Sprawdzono podgląd finalnej książki','Gotowe do kliknięcia Publish w Amazon KDP'];function get(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return {}}}function saveData(){let d=get();d.isbn=$('#isbn').value.trim();d.market=$('#market').value;d.date=$('#date').value;d.status=$('#launchStatus').value;d.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(d));if(window.KDPProjectStore)KDPProjectStore.saveCurrent();render()}function render(){let d=get(),pre;try{pre=JSON.parse(localStorage.getItem('kdpPrePublishStatus')||'{}')}catch(e){pre={}}d.checked=Array.isArray(d.checked)?d.checked:[];$('#isbn').value=d.isbn||'';$('#market').value=d.market||'Amazon.com';$('#date').value=d.date||'';$('#launchStatus').value=d.status||'draft';$('#steps').innerHTML=names.map((n,i)=>`<div class="step"><input type="checkbox" data-i="${i}" ${d.checked.includes(i)?'checked':''}><div><b>${i+1}. ${n}</b>${i===0?'<div class="muted">Ten krok wykonujesz w Amazon KDP po przesłaniu plików.</div>':''}</div><span>${d.checked.includes(i)?'✓':'○'}</span></div>`).join('');document.querySelectorAll('[data-i]').forEach(x=>x.onchange=()=>{let z=get();z.checked=Array.isArray(z.checked)?z.checked:[];let i=+x.dataset.i;if(x.checked&&!z.checked.includes(i))z.checked.push(i);if(!x.checked)z.checked=z.checked.filter(v=>v!==i);localStorage.setItem(KEY,JSON.stringify(z));render()});let completed=d.checked.length,ready=pre.ready===true&&completed===names.length&&!!d.market&&!!d.date;let pct=Math.round(completed/names.length*100);$('#fill').style.width=pct+'%';$('#decision').className='decision '+(ready?'good':'bad');$('#decision').textContent=ready?'✓ LAUNCH CHECKLIST GOTOWA':'○ PRZYGOTOWANIE PUBLIKACJI';$('#summary').textContent=`${completed}/${names.length} kroków wykonanych · ${pct}%`+(pre.ready?'':' · Pre-Publish Assistant nie jest jeszcze zaliczony.');$('#finish').className='btn '+(ready?'':'locked');$('#finish').onclick=()=>{if(!ready)return;let z=get();z.ready=true;z.readyAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(z));localStorage.setItem('kdpLaunchReady',JSON.stringify({ready:true,date:z.date,market:z.market,at:z.readyAt}));if(window.KDPProjectStore)KDPProjectStore.saveCurrent();alert('Projekt zapisany jako gotowy do wysłania do Amazon KDP.')};}$('#save').onclick=saveData;render();</script></main></div></body></html>
