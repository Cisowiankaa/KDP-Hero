<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Executive Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial;background:#f5f7fb;color:#151827}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 15px}.logo{font-size:22px;font-weight:900;margin-bottom:27px}.logo b{color:#8b5cf6}.side a{display:block;color:#d8dfeb;text-decoration:none;padding:10px;border-radius:9px}.side a:hover,.side .on{background:#5b36e8}.main{padding:26px}.muted{color:#70788c}.hero{background:#fff;border:1px solid #e1e5ed;border-radius:17px;padding:20px;margin:18px 0}.goal{display:flex;justify-content:space-between;gap:20px;align-items:center}.goal input{width:75px;padding:9px;border:1px solid #d8dce5;border-radius:8px}.bar{height:14px;background:#e9ebf1;border-radius:99px;overflow:hidden;margin-top:13px}.bar i{display:block;height:100%;background:#6842ed}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{background:#fff;border:1px solid #e1e5ed;border-radius:13px;padding:15px}.card strong{display:block;font-size:29px;margin-top:6px}.forecast{margin-top:14px;padding:20px;border-radius:15px;background:#171d2b;color:#fff;display:flex;justify-content:space-between;align-items:center}.forecast strong{font-size:36px}.good{color:#62d9a5}.warn{color:#ffd16b}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.app{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><a href="index.html">⌂ Dashboard</a><a href="control-tower.html">◈ Control Tower</a><a class="on" href="executive-dashboard.html">◆ Executive Dashboard</a><a href="publishing-pipeline.html">▤ Pipeline</a><a href="portfolio-planner.html">▦ Portfolio</a><a href="work-history.html">📊 Historia pracy</a></aside><main class="main"><h1 style="margin-bottom:4px">◆ Executive Dashboard</h1><div class="muted">Wyniki, tempo produkcji i prognoza wydawnicza miesiąca.</div><section class="hero"><div class="goal"><div><b>Cel publikacji na miesiąc</b><div id="goalText" class="muted"></div></div><label>Cel: <input id="goal" type="number" min="1" max="100"></label></div><div class="bar"><i id="goalBar"></i></div></section><div id="stats" class="grid"></div><section id="forecast" class="forecast"></section></main></div><script src="project-store.js"></script><script src="book-status-engine.js"></script><script src="book-priority-engine.js"></script><script src="today-queue.js"></script><script src="smart-workload-engine.js"></script><script src="production-forecast.js"></script><script src="executive-dashboard.js"></script><script>function render(){let x=KDPExecutiveDashboard.build();goal.value=x.goal;goalText.textContent=`Opublikowano ${x.published} z ${x.goal} książek · ${Math.min(100,x.goalProgress)}% celu`;goalBar.style.width=Math.min(100,x.goalProgress)+'%';stats.innerHTML=`<div class="card">Opublikowane<strong>${x.published}</strong><span class="muted">w tym miesiącu</span></div><div class="card">Aktywne projekty<strong>${x.active}</strong></div><div class="card">Ukończone etapy<strong>${x.completedStages}</strong></div><div class="card">Tempo pracy<strong>${x.velocity}</strong><span class="muted">etapów / dzień pracy</span></div><div class="card">Moc dzienna<strong>${x.dailyCapacity}</strong></div><div class="card">Wykorzystanie mocy<strong>${x.capacityUse}%</strong></div><div class="card">Dni robocze pozostałe<strong>${x.workdaysLeft}</strong></div><div class="card">Cel miesiąca<strong>${x.goal}</strong></div>`;forecast.innerHTML=`<div><div class="muted" style="color:#bbc2d2">PROGNOZA DO KOŃCA MIESIĄCA</div><strong>${x.predicted} książek</strong></div><div class="${x.onTrack?'good':'warn'}"><b>${x.onTrack?'✓ Cel jest osiągalny':'⚠ Tempo poniżej celu'}</b><div>${x.onTrack?'Obecne tempo wystarcza do realizacji planu.':'Control Tower powinien zwiększyć priorytet projektów najbliżej publikacji.'}</div></div>`}goal.onchange=()=>{KDPExecutiveDashboard.setGoal(goal.value);render()};render();</script></body></html>
