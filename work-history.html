<!doctype html><html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KDP HERO — Historia pracy</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f6f7fb;color:#151827}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:#07101f;color:#fff;padding:24px 16px}.logo{font-size:22px;font-weight:900;margin-bottom:30px}.logo b{color:#8b5cf6}.nav a{display:block;color:#d8dfeb;padding:11px 12px;border-radius:9px;margin:2px 0;text-decoration:none;font-size:13px}.nav a:hover,.nav .on{background:#5b36e8;color:#fff}.label{font-size:10px;color:#7f8aa0;font-weight:800;margin:22px 10px 7px}.main{padding:26px}.muted{color:#70788c}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.card,.report{background:#fff;border:1px solid #e3e6ed;border-radius:14px;padding:17px}.card strong{display:block;font-size:27px;margin-top:7px}.report{margin:10px 0}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.pills span{display:inline-block;background:#ede9fe;color:#5634d6;border-radius:99px;padding:6px 9px;margin:3px;font-size:11px;font-weight:800}.bar{height:8px;background:#e7e8ed;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#6842ed}.empty{padding:30px;text-align:center;background:#fff;border:1px dashed #ccd2dc;border-radius:14px}@media(max-width:850px){.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.app{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.main{padding:15px}}</style></head><body><div class="app"><aside class="side"><div class="logo">📖 KDP <b>HERO</b></div><div class="nav"><a href="index.html">⌂ Dashboard</a><div class="label">PRODUKCJA</div><a href="production-manager.html">▶ Production Manager</a><a class="on" href="work-history.html">📊 Historia pracy</a><a href="monthly-production.html">▦ Plan miesiąca</a><a href="weekly-production.html">▤ Plan tygodnia</a></div></aside><main class="main"><div class="head"><div><h1 style="margin:0">📊 Historia pracy</h1><div class="muted">Raporty dzienne, produktywność i przeniesione zadania.</div></div><a href="index.html" style="text-decoration:none;color:#5634d6;font-weight:800">← Dashboard</a></div><div id="stats" class="cards"></div><div id="reports"></div></main></div><script>function read(k,d){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(d))}catch(e){return d}}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}let data=read('kdpDailyReports',[]),now=new Date(),weekAgo=new Date(now);weekAgo.setDate(now.getDate()-6);let month=data.filter(r=>{let d=new Date(r.day+'T12:00');return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear()}),week=data.filter(r=>new Date(r.day+'T12:00')>=weekAgo),sum=a=>a.reduce((n,r)=>n+(r.completed||0),0),car=a=>a.reduce((n,r)=>n+(r.carried||0),0),books=new Set(month.flatMap(r=>(r.books||[]).map(b=>b.id||b.title)));document.querySelector('#stats').innerHTML=`<div class="card">Ostatnie 7 dni<strong>${sum(week)}</strong><span class="muted">ukończonych etapów</span></div><div class="card">Ten miesiąc<strong>${sum(month)}</strong><span class="muted">ukończonych etapów</span></div><div class="card">Książki w miesiącu<strong>${books.size}</strong><span class="muted">aktywnych projektów</span></div><div class="card">Przeniesione<strong>${car(month)}</strong><span class="muted">zadań w miesiącu</span></div>`;let max=Math.max(1,...data.map(r=>r.completed||0));document.querySelector('#reports').innerHTML=data.length?data.map(r=>`<article class="report"><div class="head"><div><b>${new Date(r.day+'T12:00').toLocaleDateString('pl-PL',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</b><div class="muted" style="font-size:12px;margin-top:4px">${r.completed||0} wykonanych · ${r.carried||0} przeniesionych · ${(r.books||[]).length} książek</div></div><strong>${r.completed||0}</strong></div><div class="bar"><i style="width:${Math.round((r.completed||0)/max*100)}%"></i></div><div class="pills" style="margin-top:10px">${(r.books||[]).map(b=>`<span>${esc(b.title)}</span>`).join('')||'<span>Brak ukończonych etapów</span>'}</div></article>`).join(''):'<div class="empty"><h3>Brak raportów</h3><p class="muted">Pierwszy raport pojawi się po użyciu „Zakończ dzień + raport” na Dashboardzie.</p></div>';</script></body></html>
